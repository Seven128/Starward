# Schema v4 Minimal Context graph manifest.
# Keep only near-universal recovery facts in the default path; route specialized
# facts through registered on-demand nodes and widen reads through bounded search.
# `workspaces/<workspace-id>/**` is optional and only for workspace-local owners;
# cross-workspace truth remains under `areas/**` or a project-root role node.
# `ty-context route` and doctor are diagnostics, not read ACLs or proof.

[[areas]]
id = "main"
root = "."
context = "project_context/areas/main.md"
kind = "app"
default = true

[[context]]
path = "project_context/development-workflow.md"
role = "verification"
read_policy = "on-demand"
triggers = ["miniapp environment", "miniapp development", "miniapp test", "miniapp acceptance", "微信小程序环境", "小程序开发", "小程序测试", "小程序验收"]

[[context]]
path = "project_context/deployment.md"
role = "deployment"
read_policy = "on-demand"
triggers = ["deployment", "deploy", "release", "staging", "production", "cloud", "部署", "发布", "测试环境", "生产环境"]

[[context]]
