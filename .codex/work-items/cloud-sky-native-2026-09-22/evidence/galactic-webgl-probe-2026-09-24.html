const vertex="\n  attribute vec2 a_position;\n  uniform vec2 u_resolution;\n  varying vec2 v_pixel;\n  \n  vec4 screenPosition(vec2 p) {\n    return vec4(p.x / u_resolution.x * 2.0 - 1.0, 1.0 - p.y / u_resolution.y * 2.0, 0.0, 1.0);\n  }\n  void main() { v_pixel = a_position; gl_Position = screenPosition(a_position); }",fragment="\n  precision highp float;\n  varying vec2 v_pixel;\n  \n  uniform vec2 u_center;\n  uniform float u_scale;\n  uniform vec3 u_right, u_up, u_forward;\n  vec3 skyRay(vec2 pixel) {\n    vec2 p = (pixel-u_center)/u_scale;\n    p.y = -p.y;\n    float squared = dot(p,p);\n    vec3 camera = vec3(2.0*p,1.0-squared)/(1.0+squared);\n    return u_right*camera.x+u_up*camera.y+u_forward*camera.z;\n  }\n  uniform vec3 u_galacticPole, u_galacticCenter;\n  uniform sampler2D u_image;\n  uniform float u_strength;\n  void main() {\n    vec3 ray = skyRay(v_pixel);\n    if (ray.z <= 0.0) discard;\n    vec3 east = cross(u_galacticPole,u_galacticCenter);\n    float longitude = atan(dot(ray,east),dot(ray,u_galacticCenter));\n    float latitude = asin(clamp(dot(ray,u_galacticPole),-1.0,1.0));\n    vec2 uv = vec2(0.5-longitude/6.28318530718,0.5-latitude/3.14159265359);\n    vec3 infrared = texture2D(u_image,uv).rgb;\n    gl_FragColor = vec4(infrared,0.24*u_strength);\n  }",imageUrl="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAQACAADAREAAhEBAxEB/8QAHAAAAwEBAQEBAQAAAAAAAAAAAgMEAQAFBgcI/8QAXhAAAgIBAwIFAgQEBAQDAAAnAQIDEQQAEiEFMRMiQVFhFHEGMoGRI0KhsRVSwdEzYuHwJHKCkvFDBxZToiVEY3OywtLTNIOTNUWUJkZUZHSEo7PDCBc2hZa0xNTi/8QAGgEBAQEBAQEBAAAAAAAAAAAAAQACAwQFBv/EADYRAAMAAgIDAAIABAQGAwABBQABESExAkESUWEDcQQTIoEykaHwFEJSsdHhBcHxFWIGcpKi/9oADAMBAAIRAxEAPwD+AQnuR++tJAEAnsf/AGLTgshDwvVX/Rh/tp/pDIwNhgeZJv0kA/8Akdav4/T/AM//AEE5Bh+n+seT+kq//K6b+P0/8/8A0E5/7/8A0MSdK/mizP0nX/5TTfxen/mv/ATn/v8A/QvE   gl.drawArrays(gl.TRIANGLES,0,6);
  const reference=document.createElement('canvas');reference.width=2048;reference.height=1024;
  const ctx=reference.getContext('2d');ctx.drawImage(bitmap,0,0);
  const results=[];
  for(const [x,y] of [[64,64],[64,32],[96,64]]){
    const p=[(x+.5-64)/128,-(y+.5-64)/128];const sq=p[0]*p[0]+p[1]*p[1];
    const ray=[2*p[0]/(1+sq),2*p[1]/(1+sq),(1-sq)/(1+sq)];
    const uv=[.5-Math.atan2(ray[0],ray[2])/(2*Math.PI),.5-Math.asin(ray[1])/Math.PI];
    const expected=[...ctx.getImageData(Math.floor(uv[0]*2048),Math.floor(uv[1]*1024),1,1).data].slice(0,3);
    const actual=new Uint8Array(4);gl.readPixels(x,127-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,actual);
    results.push({x,y,uv,expected,actual:[...actual],difference:expected.map((value,i)=>Math.abs(actual[i]-Math.round(value*.24)))});
  }
  return {ok:gl.getError()===gl.NO_ERROR&&results.every(p=>p.difference.every(d=>d<=8)),version:gl.getParameter(gl.VERSION),results};
}
run().then(value=>{document.getElementById('result').textContent=JSON.stringify(value);})
  .catch(error=>{document.getElementById('result').textContent=JSON.stringify({ok:false,error:String(error)});});
</script>
