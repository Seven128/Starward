const vertex="\n  attribute vec2 a_position;\n  attribute vec2 a_uv;\n  uniform vec2 u_resolution;\n  varying vec2 v_uv, v_pixel;\n  \n  vec4 screenPosition(vec2 p) {\n    return vec4(p.x / u_resolution.x * 2.0 - 1.0, 1.0 - p.y / u_resolution.y * 2.0, 0.0, 1.0);\n  }\n  void main() { gl_Position = screenPosition(a_position); v_uv = a_uv; v_pixel = a_position; }",fragment="\n  precision highp float;\n  varying vec2 v_uv, v_pixel;\n  \n  uniform vec2 u_center;\n  uniform float u_scale;\n  uniform vec3 u_right, u_up, u_forward;\n  vec3 skyRay(vec2 pixel) {\n    vec2 p = (pixel-u_center)/u_scale;\n    p.y = -p.y;\n    float squared = dot(p,p);\n    vec3 camera = vec3(2.0*p,1.0-squared)/(1.0+squared);\n    return u_right*camera.x+u_up*camera.y+u_forward*camera.z;\n  }\n  uniform vec2 u_sunward;\n  uniform float u_illuminatedFraction;\n  uniform vec3 u_tint;\n  uniform float u_colorMode;\n  uniform vec3 u_bodyObserver, u_bodyRight, u_bodyDown;\n  uniform float u_polarRatio;\n  uniform float u_profile;\n  uniform vec3 u_fallbackTint;\n  uniform sampler2D u_image;\n  const float PI=3.141592653589793;\n  void main() {\n    vec2 p=2.0*v_uv-1.0;\n    float squared=dot(p,p);\n    if(squared>1.0)discard;\n    if(skyRay(v_pixel).z<0.0)discard;\n    float invPolarSquared=1.0/(u_polarRatio*u_polarRatio);\n    vec3 offset=u_bodyRight*p.x+u_bodyDown*p.y;\n    vec3 observer=u_bodyObserver;\n    vec3 weightedObserver=vec3(observer.xy,observer.z*invPolarSquared);\n    float qa=dot(observer,weightedObserver);\n    float qb=dot(offset,weightedObserver);\n    float qc=dot(offset,vec3(offset.xy,offset.z*invPolarSquared))-1.0;\n    float discriminant=qb*qb-qa*qc;\n    if(discriminant<0.0)discard;\n    vec3 body=offset+observer*((-qb+sqrt(discriminant))/qa);\n    vec3 normal=normalize(vec3(body.xy,body.z*invPolarSquared));\n    float facing=max(0.0,dot(normal,observer));\n    float longitude=atan(body.y,body.x);\n    float latitude=atan(normal.z,length(normal.xy));\n    vec2 mapUv=vec2((longitude+PI)/(2.0*PI),0.5-latitude/PI);\n    vec4 sampleColor=texture2D(u_image,mapUv);\n    vec3 albedo=sampleColor.rgb;\n    float phaseCos=2.0*u_illuminatedFraction-1.0;\n    float phaseSin=sqrt(max(0.0,1.0-phaseCos*phaseCos));\n    float incidence=dot(vec3(p,facing),vec3(u_sunward*phaseSin,phaseCos));\n    float daylight=smoothstep(-0.012,0.012,incidence);\n    float brightness=0.045+daylight*(0.62+0.335*max(incidence,0.0));\n    float edge=smoothstep(0.0,0.04,discriminant);\n    vec3 surface=mix(vec3(albedo.r),albedo,u_colorMode);\n    vec3 textured=u_tint*brightness*(mix(0.3,0.08,u_profile)+\n      mix(1.2,0.9,u_profile)*clamp(surface,0.0,1.0));\n    gl_FragColor=vec4(mix(u_fallbackTint*brightness,textured,sampleColor.a),edge);\n  }",imageUrl="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAIABAADASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAgMEAQAFBgf/xABTEAACAQMDAQUFBgQEAwUFAg8BAhEAAyEEEjFBBRMiUWEycYGRoRRCscHR8AYjUuEVM2LxcoKiJJKywtIWNENEc1NUY4STJYOjs8PT4gc1ZHWU/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/APyP7KqN4tFrD6NacR/1UJ0wJJGj1QH/ANJ//VX1/wBi373/AMRY7erWVE+f3iPwp9rSab7KyvqDeuFgFIARY65E0Hw7aVFXe1nVKPM2mA+rUCWrDmFa4WJgAW2J/wDFX3X+FIquBdtkMPYuXN4Hzt0NnsqwrK5XSgq3MAGfQBBNB8Pc0yWzD/aEjzst/wCqhW1ZIktfPust/wCuv0O/2b2XfMvfVbg9qbJcH/qFL/wPsdpDO6kjBS2w+kmg+A7tOi3v/wAk3/qpiaVH9o3lB69yx/OvtD/DWjRA1rVam4T07rj/ALwFLv8AYJUeHWoFPO4KhH4UHg2+zUPZl3Ti4pu3Ltu4rFIKhQ4Iz4s7gcMB4cgnaVTc7GFjQM9y+vfs6lPG4AWDuBWDJJ2wdwiDgzI9k9iaxTK3w3ke+XP1obnZvaQ2i4lq4o4D3FI+hmg+Y+y3NxAcGPLd+dENOw9q4Y8hP519EOyr2WOjtEnkC44HzBpR7G3mO4KnqBfZqDxBZVsfzQ3/ABgUYsAcs7R/rFeyP4cvMZQXJPGDH41z/wANa5PEbQIOB/N2z9aDxhYcsYMjyJNMt6HU3X2rsB6Ft8V73/s/esJN7T6i3JwQ4I+Yml3+ztrbrOp1FhfJgWj44FB4fdXFYq1/RKR5s5n5UJS9DMH0hC9QXr1P/Z9z4hfRvU2//wCetHYrgHddXZPi/lxj/vfrQeSBfn/M03zemj7Vx3ulA9716dzsBXuk2NSVtkY3MrZ+h function compile(gl,type,code){const item=gl.createShader(type);gl.shaderSource(item,code);gl.compileShader(item);
  if(!gl.getShaderParameter(item,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(item));return item;}
async function run(){
  const bitmap=new Image();bitmap.src=imageUrl;await bitmap.decode();
  const canvas=document.getElementById('sky'),gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
  if(!gl)throw Error('WebGL1 unavailable');
  const program=gl.createProgram();gl.attachShader(program,compile(gl,gl.VERTEX_SHADER,vertex));
  gl.attachShader(program,compile(gl,gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
    32,32,0,0, 96,32,1,0, 32,96,0,1,
    32,96,0,1, 96,32,1,0, 96,96,1,1]),gl.STATIC_DRAW);
  for(const [name,offset] of [['a_position',0],['a_uv',8]]){
    const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,16,offset);
  }
  function u2(name,value){gl.uniform2fv(gl.getUniformLocation(program,name),value);}
  function u3(name,value){gl.uniform3fv(gl.getUniformLocation(program,name),value);}
  function u1(name,value){gl.uniform1f(gl.getUniformLocation(program,name),value);}
  u2('u_resolution',[128,128]);u2('u_center',[64,64]);u1('u_scale',128);
  u3('u_right',[1,0,0]);u3('u_up',[0,1,0]);u3('u_forward',[0,0,1]);
  u2('u_sunward',[1,0]);u1('u_illuminatedFraction',1);u3('u_tint',[1,1,1]);u1('u_colorMode',0);
  u1('u_polarRatio',1);u1('u_profile',0);u3('u_fallbackTint',[1,1,1]);
  const lon=164.687327*Math.PI/180,lat=3.607425*Math.PI/180;
  const observer=[Math.cos(lat)*Math.cos(lon),Math.cos(lat)*Math.sin(lon),Math.sin(lat)];
  const right=[-Math.sin(lon),Math.cos(lon),0];
  const down=[Math.sin(lat)*Math.cos(lon),Math.sin(lat)*Math.sin(lon),-Math.cos(lat)];
  u3('u_bodyObserver',observer);u3('u_bodyRight',right);u3('u_bodyDown',down);
  const texture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);

  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bitmap);
  gl.uniform1i(gl.getUniformLocation(program,'u_image'),0);
  gl.viewport(0,0,128,128);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES,0,6);
  const reference=document.createElement('canvas');reference.width=1024;reference.height=512;
  const ctx=reference.getContext('2d');ctx.drawImage(bitmap,0,0);
  const results=[];
  for(const [x,y] of [[64,64],[76,64],[52,64],[64,52],[64,76]]){
    const p=[(x+.5-64)/32,(y+.5-64)/32],sq=p[0]*p[0]+p[1]*p[1],facing=Math.sqrt(1-sq);
    const body=observer.map((v,i)=>v*facing+right[i]*p[0]+down[i]*p[1]);
    const longitude=Math.atan2(body[1],body[0]),latitude=Math.asin(body[2]);
    const uv=[(longitude+Math.PI)/(2*Math.PI),.5-latitude/Math.PI];
    const sx=uv[0]*1024-.5,sy=uv[1]*512-.5,x0=Math.floor(sx),y0=Math.floor(sy),fx=sx-x0,fy=sy-y0;
    const pix=(a,b)=>ctx.getImageData(Math.max(0,Math.min(1023,a)),Math.max(0,Math.min(511,b)),1,1).data[0]/255;
    const top=pix(x0,y0)*(1-fx)+pix(x0+1,y0)*fx;

run().then(value=>{document.getElementById('result').textContent=JSON.stringify(value);})
  .catch(error=>{document.getElementById('result').textContent=JSON.stringify({ok:false,error:String(error)});});
