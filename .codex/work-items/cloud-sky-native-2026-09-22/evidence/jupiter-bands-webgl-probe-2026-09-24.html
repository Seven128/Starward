const vertex="\n  attribute vec2 a_position;\n  attribute vec2 a_uv;\n  uniform vec2 u_resolution;\n  varying vec2 v_uv, v_pixel;\n  \n  vec4 screenPosition(vec2 p) {\n    return vec4(p.x / u_resolution.x * 2.0 - 1.0, 1.0 - p.y / u_resolution.y * 2.0, 0.0, 1.0);\n  }\n  void main() { gl_Position = screenPosition(a_position); v_uv = a_uv; v_pixel = a_position; }",fragment="\n  precision highp float;\n  varying vec2 v_uv, v_pixel;\n  \n  uniform vec2 u_center;\n  uniform float u_scale;\n  uniform vec3 u_right, u_up, u_forward;\n  vec3 skyRay(vec2 pixel) {\n    vec2 p = (pixel-u_center)/u_scale;\n    p.y = -p.y;\n    float squared = dot(p,p);\n    vec3 camera = vec3(2.0*p,1.0-squared)/(1.0+squared);\n    return u_right*camera.x+u_up*camera.y+u_forward*camera.z;\n  }\n  uniform vec2 u_sunward;\n  uniform float u_illuminatedFraction;\n  uniform vec3 u_tint;\n  uniform float u_colorMode;\n  uniform vec3 u_bodyObserver, u_bodyRight, u_bodyDown;\n  uniform float u_polarRatio;\n  uniform float u_profile;\n  uniform vec3 u_fallbackTint;\n  uniform sampler2D u_image;\n  const float PI=3.141592653589793;\n  void main() {\n    vec2 p=2.0*v_uv-1.0;\n    float squared=dot(p,p);\n    if(squared>1.0)discard;\n    if(skyRay(v_pixel).z<0.0)discard;\n    float invPolarSquared=1.0/(u_polarRatio*u_polarRatio);\n    vec3 offset=u_bodyRight*p.x+u_bodyDown*p.y;\n    vec3 observer=u_bodyObserver;\n    vec3 weightedObserver=vec3(observer.xy,observer.z*invPolarSquared);\n    float qa=dot(observer,weightedObserver);\n    float qb=dot(offset,weightedObserver);\n    float qc=dot(offset,vec3(offset.xy,offset.z*invPolarSquared))-1.0;\n    float discriminant=qb*qb-qa*qc;\n    if(discriminant<0.0)discard;\n    vec3 body=offset+observer*((-qb+sqrt(discriminant))/qa);\n    vec3 normal=normalize(vec3(body.xy,body.z*invPolarSquared));\n    float facing=max(0.0,dot(normal,observer));\n    float longitude=atan(body.y,body.x);\n    float latitude=atan(normal.z,length(normal.xy));\n    vec2 mapUv=vec2((longitude+PI)/(2.0*PI),0.5-latitude/PI);\n    vec4 sampleColor=texture2D(u_image,mapUv);\n    vec3 albedo=sampleColor.rgb;\n    float phaseCos=2.0*u_illuminatedFraction-1.0;\n    float phaseSin=sqrt(max(0.0,1.0-phaseCos*phaseCos));\n    float incidence=dot(vec3(p,facing),vec3(u_sunward*phaseSin,phaseCos));\n    float daylight=smoothstep(-0.012,0.012,incidence);\n    float brightness=0.045+daylight*(0.62+0.335*max(incidence,0.0));\n    float edge=smoothstep(0.0,0.04,discriminant);\n    vec3 surface=mix(vec3(albedo.r),albedo,u_colorMode);\n    vec3 textured=u_tint*brightness*(mix(0.3,0.08,u_profile)+\n      mix(1.2,0.9,u_profile)*clamp(surface,0.0,1.0));\n    gl_FragColor=vec4(mix(u_fallbackTint*brightness,textured,sampleColor.a),edge);\n  }",imageUrl="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAIACAYAAAC/wy3PAAADyUlEQVR42u2bTWocQQyFJVW1PeCAySlyhUBWOUAIgdzH18hpcpUQQhbZhYnxePqnlBv01/C6xsZ41g+VSq1SPb3SmL2En9/d3YVm4dPnD9/XAPXL1/cfVy38+vNtXrVwOERZBYzTsupknce2DpgmBMAS0wwWZgKghWVJcYmlgYW2yBb6A1K3kLgExKEl+mCiDztYSBN3kWkiwExcAutTNTCBFrYsoVrQPxZ/C3v6b4HbNHkXfHjZBwA4OenW34I9+bnQ0/4CAMzq53H88eipPlRzDJSL9QF9cPfnnzAuh1quUc8hDnraV3cMtasfS85qdlJN2g0nSw2UHoctofYnzyguQRjqAEBEEMC1QFVz1ULIAD0fTN7mhjh05zAbOhSXL/fuNYp3kSLBuAQLwrR3029eOZLoJBaQoRLgigADOFkH0UIhC14KZTXEoe1wsaYIwD5rQxELEUBxqFkhH3w4AKASoAziLpKKWKZ+X+hdMwh3tsxgYRkNZFhSmxtF0oscauzUwElrC8VhAgune4jD37/rgOl4BAv3D3CyHh8BMI4EgHxI+twp69UmC1bsg2X/Xcg0yeWGNFSCwYwUi7lbb+KdrjZBCEh1m9X53qQ4hHrzekUmBqX4mrjc9TVcrJUATksY7aLhhYKRJIBugXlUuNpGIT3w7P3AwVez/HagN0EbhLv+kpesHjBNMrmQUo/jJajPgrNZuFaH7GTpr+SEKljxq1wjykpcbjwDIz2dgJE+AOFczrBEzuBkcIdCjBTjQGMeOS80nEA+0CwK+yAz0szukySNBkU2ZDUAQgawJobjLjPFIYiBEIcxqlFZQq1RRRXuygGEmoqAK1oCfbgCPjkcQAsabt4A4PYt+HBzS06iHlW1r7mD8r+ByzVZh2ni0UvSYRBg80g+0H3B1R58WKYzjWiSk9NMNWoWQ80KRkT3pG0p0uZChZRFEuRytXscguqDV3wioTigRjpBVrfziQBnkWBskOVNbII29FlqM1jw5qWTxcJd6HNB8oxWazIjXVQ+qfZZW/RJUdnb8qSuvsrJpHeH52xUtPAp2SN6C7m6Tpv9R9GYaDGPopZ2ntSXICJaDZkY3ThMFy17C5ipDtzqs80XGBve4a8Nro83ZO/h50uMT8vTsBt0GPXvFXtsk/mD957R2kHY12f25Ckvj/ function compile(gl,type,code){const item=gl.createShader(type);gl.shaderSource(item,code);gl.compileShader(item);
  if(!gl.getShaderParameter(item,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(item));return item;}
async function run(){
  const bitmap=new Image();bitmap.src=imageUrl;await bitmap.decode();
  const canvas=document.getElementById('sky'),gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
  if(!gl)throw Error('WebGL1 unavailable');
  const program=gl.createProgram();gl.attachShader(program,compile(gl,gl.VERTEX_SHADER,vertex));
  gl.attachShader(program,compile(gl,gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
    32,32,0,0, 96,32,1,0, 32,96,0,1,
    32,96,0,1, 96,32,1,0, 96,96,1,1]),gl.STATIC_DRAW);
  for(const [name,offset] of [['a_position',0],['a_uv',8]]){
    const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,16,offset);
  }
  function u2(name,value){gl.uniform2fv(gl.getUniformLocation(program,name),value);}
  function u3(name,value){gl.uniform3fv(gl.getUniformLocation(program,name),value);}
  function u1(name,value){gl.uniform1f(gl.getUniformLocation(program,name),value);}
  u2('u_resolution',[128,128]);u2('u_center',[64,64]);u1('u_scale',128);
  u3('u_right',[1,0,0]);u3('u_up',[0,1,0]);u3('u_forward',[0,0,1]);
  u2('u_sunward',[1,0]);u1('u_illuminatedFraction',1);u3('u_tint',[1,1,1]);u1('u_colorMode',1);
  u1('u_polarRatio',66854/71492);u1('u_profile',1);u3('u_fallbackTint',[.84,.76,.65]);
  const texture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bitmap);
  gl.uniform1i(gl.getUniformLocation(program,'u_image'),0);
  const pixel=(x,y)=>{const out=new Uint8Array(4);gl.readPixels(x,127-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,out);return [...out];};
  const draw=(observer,right,down)=>{
    u3('u_bodyObserver',observer);u3('u_bodyRight',right);u3('u_bodyDown',down);
    gl.viewport(0,0,128,128);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,6);
    return {center:pixel(64,64),north:pixel(64,56),south:pixel(64,72),
      equatorialEdge:pixel(95,64),polarOutside:pixel(64,33)};
  };
  const equator=draw([1,0,0],[0,1,0],[0,0,-1]);
  const northPole=draw([0,0,1],[1,0,0],[0,1,0]);
  const colorDistance=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);
  return {ok:gl.getError()===gl.NO_ERROR&&equator.center[3]===255&&
    equator.equatorialEdge[3]>200&&equator.polarOutside[0]===0&&
    colorDistance(equator.north,equator.south)>10&&
    colorDistance(equator.center,northPole.center)>10&&
    colorDistance(northPole.center,[214,194,166])<=3,
    version:gl.getParameter(gl.VERSION),equator,northPole};
}
run().then(value=>{document.getElementById('result').textContent=JSON.stringify(value);})
  .catch(error=>{document.getElementById('result').textContent=JSON.stringify({ok:false,error:String(error)});});
