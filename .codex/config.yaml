core:
  package: project-tiny-context-harness
  schema_version: "4"
profiles:
  enabled:
    - core-portable
    - workflow-default
    - long-task
modularity:
  limit: 300
  policy: scoped_waivers
  waivers:
    - path: apps/wechat-miniapp/src/content/import/index.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: Complete V2 Demo import workflow is intentionally kept stable for this Final Gate; its page orchestration and branch count require a bounded post-baseline extraction.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Split import parsing, permission and recovery orchestration before the next functional change to this file.
    - path: apps/wechat-miniapp/src/features/my/my-library-page.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: Complete V2 Demo My-library states are stable for this Final Gate; extracting tab-specific owners is deferred to avoid destabilizing the verified baseline.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract favorites, plans and settings presenters before the next functional change to this file.
    - path: apps/wechat-miniapp/src/features/sky/spot-sky-page.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: Complete V2 Demo sky and observation lifecycle is stable for this Final Gate; controller and presentation extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract observation lifecycle and sky presentation before the next functional change to this file.
    - path: apps/wechat-miniapp/src/features/spot/spot-detail-page.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: Complete V2 Demo detail states and actions are stable for this Final Gate; section extraction is deferred to preserve current-candidate behavior.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract detail sections and action orchestration before the next functional change to this file.
    - path: apps/wechat-miniapp/src/pages/map/index.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: Complete V2 Demo map coordination is stable for this Final Gate; filters, viewport and selection owners need a bounded follow-up split.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract filter, viewport and selection controllers before the next functional change to this file.
    - path: apps/wechat-miniapp/src/services/api-client.ts
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: BFF transport, timeout and stable fallback semantics are deliberately co-located for the V2 Demo baseline and need post-baseline adapter extraction.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract transport and fallback adapters before adding another endpoint or provider.
    - path: packages/miniapp-contracts/src/catalog.ts
      category: legacy_migration
      owner: miniapp-contract-maintainers
      introduced_at: "2026-08-06"
      reason: Frozen Demo catalog and fallback fixtures are co-located to preserve one reviewed semantic baseline; catalog partitions remain bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Partition catalog data by domain before adding or materially changing catalog entries.
    - path: packages/miniapp-contracts/src/filters.ts
      category: legacy_migration
      owner: miniapp-contract-maintainers
      introduced_at: "2026-08-06"
      reason: Filter vocabulary and predicates are co-located for the complete V2 Demo baseline; predicate extraction is deferred until the next filter evolution.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Separate filter vocabulary from predicate evaluation before adding or changing a filter dimension.
    - path: packages/miniapp-contracts/src/types.ts
      category: legacy_migration
      owner: miniapp-contract-maintainers
      introduced_at: "2026-08-06"
      reason: The V2 Demo public contract surface is centralized for baseline review; domain type modules and re-export facade remain bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Split domain types behind a compatibility re-export facade before adding another public contract family.
    - path: tools/miniapp/verify-miniapp-target.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: Current-candidate evidence collection is intentionally one executable authority entry; internal check adapters need a bounded post-baseline split without changing acceptance semantics.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract check adapters before adding a new evidence method or changing acceptance semantics.
    - path: workers/miniapp-api/src/astronomy-engine-adapter.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: Capability gating, validation and stable fallback branches are co-located to keep failure semantics explicit for the V2 Demo baseline.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract provider validation and fallback policy before enabling a production astronomy provider.
    - path: workers/miniapp-api/src/miniapp-service.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: Demo BFF use-case orchestration is complete and stable for this Final Gate; domain service extraction remains bounded follow-up work.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Split catalog, observation, profile and import services before adding another BFF use case.
    - path: apps/wechat-miniapp/src/content/plan/detail/index.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: The V2 Demo plan-detail state machine and recovery branches are kept together for the baseline; presenter and command extraction is bounded post-baseline debt.
      tracking_issue: WECHAT-MINIAPP-MOD-002
      expiry_condition: Extract plan-detail presentation and command orchestration before the next functional change to this file.
    - path: apps/wechat-miniapp/src/state/app-store.ts
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-06"
      reason: The V2 Demo application state and persisted hydration compatibility are centralized for baseline review; domain slice extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-002
      expiry_condition: Split persisted preferences, user content and session state behind the existing store facade before adding another state domain.
    - path: database/miniapp/migrations/001_demo_baseline.sql
      category: legacy_migration
      owner: miniapp-data-maintainers
      introduced_at: "2026-08-06"
      reason: The immutable initial Demo schema, constraints and policy setup intentionally remain one auditable migration; future schema work must use a new migration.
      tracking_issue: WECHAT-MINIAPP-MOD-003
      expiry_condition: Never append functional schema changes here after baseline acceptance; create a new focused migration for every subsequent schema change.
    - path: tools/miniapp/run-infrastructure-check.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: Infrastructure boot, migration and failure-semantics assertions share one baseline runner; adapter extraction is deferred without reducing current coverage.
      tracking_issue: WECHAT-MINIAPP-MOD-004
      expiry_condition: Extract database and worker lifecycle adapters before adding another infrastructure target or lifecycle phase.
    - path: tools/miniapp/run-wechat-devtools-session.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: One native DevTools authority runner currently owns deterministic setup, success and degradation evidence plus quiescent teardown; its verified protocol must be split without changing acceptance semantics.
      tracking_issue: WECHAT-MINIAPP-MOD-004
      expiry_condition: Extract session transport, setup, evidence-phase and teardown owners before adding another native journey or changing the evidence protocol.
    - path: tools/miniapp/workflow-conformance.test.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: Workflow anti-degradation assertions are co-located to review the complete authority protocol; fixture-family extraction remains bounded test debt.
      tracking_issue: WECHAT-MINIAPP-MOD-004
      expiry_condition: Split authority, population and native-runner conformance fixtures before adding another verifier mechanism family.
    - path: workers/miniapp-api/src/admin.controller.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: Admin allowlist, validation and explicit denial semantics are co-located for the gated Demo boundary; command extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Extract allowlist policy and admin commands before adding another privileged operation.
    - path: workers/miniapp-api/src/controller.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: The Demo BFF request router keeps endpoint validation and stable error mapping visible in one baseline owner; route-family extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Split route families behind the current controller contract before adding another public endpoint.
    - path: workers/miniapp-api/src/miniapp-infrastructure.test.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: End-to-end infrastructure setup and recovery assertions remain one baseline scenario test; fixture extraction is deferred without reducing coverage.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Extract infrastructure fixtures before adding another database or worker lifecycle scenario.
    - path: workers/miniapp-api/src/outbox-worker.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: Transactional outbox claiming, retry, idempotency and failure recovery are co-located so baseline lifecycle invariants remain auditable; internal owner extraction is bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Extract claim, delivery and retry-policy owners before enabling another outbox destination or delivery policy.
    - path: workers/miniapp-api/src/postgres-repository.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: The Demo PostgreSQL repository centralizes transactions, row mapping and stable persistence fallbacks behind one interface; aggregate-specific repository extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Split aggregate repositories behind the current interface before adding another persisted aggregate or materially changing transaction boundaries.
managed_files:
  - path: AGENTS.md
    strategy: merge-block
  - path: Makefile
    strategy: merge-block
  - path: .codex/skills
    strategy: managed
  - path: .codex/ty-context-managed/context_templates
    strategy: managed
  - path: .codex/ty-context-managed/make/ty-context.mk
    strategy: managed
  - path: tools
    strategy: managed
  - path: .github/workflows/harness.yml
    strategy: create-if-missing
never_overwrite:
  - project_context/**
  - DESIGN.md
  - src/**
  - tests/**
