core:
  package: project-tiny-context-harness
  schema_version: "4"
profiles:
  enabled:
    - core-portable
    - workflow-default
    - long-task
modularity:
  limit: 300
  policy: scoped_waivers
  waivers:
    - path: apps/wechat-miniapp/src/features/sky/spot-sky-page.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-23"
      reason: The current Spot Night surface keeps route-context validation, time selection, compass lifecycle and the selected presentation together while drift repair is verified; controller and presentation extraction remains explicit bounded debt and does not define another product version.
      tracking_issue: WECHAT-MINIAPP-MOD-006
      expiry_condition: Extract route-context and compass lifecycle owners before adding another Spot Night interaction or changing its observation-state model.
    - path: apps/wechat-miniapp/src/features/spot/spot-detail-page.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-23"
      reason: The current Spot Detail surface keeps context validation, section states and attributable actions visible in one reviewed owner while drift repair is verified; section extraction remains explicit bounded debt and does not retain a superseded product path.
      tracking_issue: WECHAT-MINIAPP-MOD-006
      expiry_condition: Extract Detail section presenters and action orchestration before adding another segment or materially changing context recovery.
    - path: apps/wechat-miniapp/src/pages/map/index.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-23"
      reason: The single current Map owner coordinates observation context, Finder, viewport, selection and source-lift recovery while their repaired cross-control invariants are verified; controller extraction remains explicit bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-006
      expiry_condition: Extract observation-context, Finder and viewport-selection controllers before adding another Map control family or state transition.
    - path: apps/wechat-miniapp/src/services/api-client.ts
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-23"
      reason: The one current BFF client co-locates request ownership, cancellation, cache policy, identity recovery and generated endpoint projection so failure semantics stay reviewable during drift repair; transport-family extraction remains explicit bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-006
      expiry_condition: Extract transport, response-cache and identity-recovery adapters before adding another endpoint family or transport policy.
    - path: packages/miniapp-contracts/src/catalog.ts
      category: legacy_migration
      owner: miniapp-contract-maintainers
      introduced_at: "2026-08-06"
      reason: Explicit deterministic test fixtures and their attributable source records remain co-located behind test-only builders; production composition cannot import them, and catalog partitioning remains bounded test-support debt.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Partition catalog data by domain before adding or materially changing catalog entries.
    - path: packages/miniapp-contracts/src/filters.ts
      category: legacy_migration
      owner: miniapp-contract-maintainers
      introduced_at: "2026-08-06"
      reason: The complete current filter vocabulary and predicates remain co-located so the exact 10+8 closure is reviewable; predicate extraction is deferred until a real filter evolution requires another stable owner.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Separate filter vocabulary from predicate evaluation before adding or changing a filter dimension.
    - path: packages/miniapp-contracts/src/types.ts
      category: legacy_migration
      owner: miniapp-contract-maintainers
      introduced_at: "2026-08-06"
      reason: The current public contract surface remains centralized for review across the single client and BFF; domain type modules behind a compatibility re-export facade remain bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Split domain types behind a compatibility re-export facade before adding another public contract family.
    - path: tools/miniapp/verify-miniapp-target.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: Current-candidate evidence collection is intentionally one executable authority entry; internal check adapters need a bounded post-baseline split without changing acceptance semantics.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract check adapters before adding a new evidence method or changing acceptance semantics.
    - path: workers/miniapp-api/src/astronomy-engine-adapter.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: Capability gating, validation and fail-closed astronomy fallback branches remain co-located so current production failure semantics stay explicit.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Extract provider validation and fallback policy before enabling a production astronomy provider.
    - path: workers/miniapp-api/src/miniapp-service.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: The current BFF use-case orchestration keeps cross-domain transaction and failure semantics visible behind one facade; domain-service extraction remains bounded follow-up work and does not preserve a superseded product implementation.
      tracking_issue: WECHAT-MINIAPP-MOD-001
      expiry_condition: Split catalog, observation, profile and import services before adding another BFF use case.
    - path: apps/wechat-miniapp/src/content/plan/detail/index.tsx
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-23"
      reason: The current Plan detail state machine keeps editing, import, validation and recovery branches together while their repaired semantics are verified; presenter and command extraction remains explicit bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-006
      expiry_condition: Extract Plan presentation and command orchestration before adding another Plan action or import state.
    - path: apps/wechat-miniapp/src/state/app-store.ts
      category: legacy_migration
      owner: wechat-miniapp-maintainers
      introduced_at: "2026-08-23"
      reason: The current application store centralizes persisted preferences, identity-scoped content and session-only observation context while repaired hydration/privacy invariants are verified; slice extraction remains explicit bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-006
      expiry_condition: Split persisted preferences, user content and session-only observation context behind the existing facade before adding another state domain or persistence rule.
    - path: database/miniapp/migrations/001_demo_baseline.sql
      category: legacy_migration
      owner: miniapp-data-maintainers
      introduced_at: "2026-08-06"
      reason: The immutable historical initial schema, constraints and policy setup remain one auditable migration identity; it is not a selectable product implementation and future schema work must use a new focused migration.
      tracking_issue: WECHAT-MINIAPP-MOD-003
      expiry_condition: Never append functional schema changes here after baseline acceptance; create a new focused migration for every subsequent schema change.
    - path: tools/miniapp/run-infrastructure-check.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: Infrastructure boot, migration and failure-semantics assertions share one baseline runner; adapter extraction is deferred without reducing current coverage.
      tracking_issue: WECHAT-MINIAPP-MOD-004
      expiry_condition: Extract database and worker lifecycle adapters before adding another infrastructure target or lifecycle phase.
    - path: tools/miniapp/run-wechat-devtools-session.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: One native DevTools authority runner currently owns deterministic setup, success and degradation evidence plus quiescent teardown; its verified protocol must be split without changing acceptance semantics.
      tracking_issue: WECHAT-MINIAPP-MOD-004
      expiry_condition: Extract session transport, setup, evidence-phase and teardown owners before adding another native journey or changing the evidence protocol.
    - path: tools/miniapp/workflow-conformance.test.mjs
      category: legacy_migration
      owner: miniapp-verification-maintainers
      introduced_at: "2026-08-06"
      reason: Workflow anti-degradation assertions are co-located to review the complete authority protocol; fixture-family extraction remains bounded test debt.
      tracking_issue: WECHAT-MINIAPP-MOD-004
      expiry_condition: Split authority, population and native-runner conformance fixtures before adding another verifier mechanism family.
    - path: workers/miniapp-api/src/admin.controller.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: Admin allowlist, validation and explicit denial semantics are co-located for the current gated operations boundary; command extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Extract allowlist policy and admin commands before adding another privileged operation.
    - path: workers/miniapp-api/src/controller.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: The current BFF request router keeps endpoint validation and stable error mapping visible in one owner; route-family extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Split route families behind the current controller contract before adding another public endpoint.
    - path: workers/miniapp-api/src/miniapp-infrastructure.test.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: End-to-end infrastructure setup and recovery assertions remain one baseline scenario test; fixture extraction is deferred without reducing coverage.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Extract infrastructure fixtures before adding another database or worker lifecycle scenario.
    - path: workers/miniapp-api/src/outbox-worker.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: Transactional outbox claiming, retry, idempotency and failure recovery are co-located so baseline lifecycle invariants remain auditable; internal owner extraction is bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Extract claim, delivery and retry-policy owners before enabling another outbox destination or delivery policy.
    - path: workers/miniapp-api/src/postgres-repository.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-06"
      reason: The current PostgreSQL repository centralizes transactions, row mapping and fail-closed persistence semantics behind one interface; aggregate-specific repository extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-005
      expiry_condition: Split aggregate repositories behind the current interface before adding another persisted aggregate or materially changing transaction boundaries.
    - path: data-pipelines/dark-sky/publish_eog_viirs.py
      category: legacy_migration
      owner: miniapp-data-maintainers
      introduced_at: "2026-08-23"
      reason: The current operator-run publisher keeps manifest validation, raster sampling, PostGIS publication and transactional rollback in one auditable command while the first real dataset lane is established; internal stage extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-007
      expiry_condition: Extract manifest/raster and database-publication stages before adding another night-light product, projection or publication mode.
    - path: packages/miniapp-contracts/src/api-shapes.ts
      category: legacy_migration
      owner: miniapp-contract-maintainers
      introduced_at: "2026-08-23"
      reason: The current API envelope and endpoint payload shapes remain in one reviewable contract carrier shared by the generated client and BFF; domain-family extraction behind the existing re-export surface remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-008
      expiry_condition: Split API shapes by stable endpoint family before adding another public endpoint family or changing envelope ownership.
    - path: workers/miniapp-api/src/astronomy-service.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The current astronomy service keeps observation-night projection, attributable event/target calculation and decision input assembly together while numerical and failure invariants are independently tested; computation-stage extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-009
      expiry_condition: Extract event-target projection and decision-input assembly before adding another astronomy dataset family or calculation stage.
    - path: workers/miniapp-api/src/meteor-event-catalog.ts
      category: third_party_reference
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The reviewed IAU and IMO occurrence population plus its attributable historical activity profile are kept together for atomic provenance review; data partitions remain immutable reference content rather than a selectable product version.
      tracking_issue: WECHAT-MINIAPP-MOD-009
      expiry_condition: Partition reviewed occurrence data from profile projection before adding another event catalog authority or materially revising the population.
    - path: workers/miniapp-api/src/observation-context-service.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The one current Observation Context owner co-locates creation, recovery, revision and observation-night validation so cross-surface invariants stay explicit; internal command/query extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-010
      expiry_condition: Extract context validation and persistence commands before adding another context kind, privacy class or revision transition.
    - path: workers/miniapp-api/src/route-provider.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The current AMap route adapter keeps request normalization, provider failure classification and attributable response mapping together; helper extraction remains bounded debt without creating another route owner.
      tracking_issue: WECHAT-MINIAPP-MOD-010
      expiry_condition: Extract provider request and response normalization before adding another travel mode, provider or route response family.
    - path: workers/miniapp-api/src/runtime-config.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: Startup configuration validation intentionally fails closed across identity, providers, persistence and development-fixture composition in one current owner; domain validator extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-010
      expiry_condition: Extract provider and persistence configuration validators before adding another startup mode, provider or secret family.
    - path: workers/miniapp-api/src/sky-opportunity-engine.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The current Sky Opportunity engine keeps normalization, scoring, confidence and continuous-window extraction together so one rule set and its invariants remain auditable; stage extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-009
      expiry_condition: Extract normalization and window segmentation before adding another scoring factor, confidence rule or window policy.
    - path: workers/miniapp-api/src/spot-completeness-policy.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The current publication policy keeps every attributable spot fact and blocker in one fail-closed review surface so no incomplete record can bypass publication; rule-family extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-010
      expiry_condition: Extract evidence-family validators before adding another publication fact, visibility policy or review transition.
    - path: workers/miniapp-api/src/trip-decision-engine.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The current Trip Decision engine keeps blocker precedence, confidence and explanations together so it cannot be conflated with Sky Opportunity; helper extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-009
      expiry_condition: Extract blocker evaluation before adding another decision factor, blocker class or explanation family.
    - path: workers/miniapp-api/src/weather-provider.ts
      category: legacy_migration
      owner: miniapp-api-maintainers
      introduced_at: "2026-08-23"
      reason: The current weather adapter keeps real-provider request, layered-cloud normalization, attribution and fail-closed error mapping together while provider parity is tested; request/normalization extraction remains bounded debt.
      tracking_issue: WECHAT-MINIAPP-MOD-010
      expiry_condition: Extract provider request and forecast normalization before adding another provider, forecast model or weather field family.
    - path: docs/design-resources/miniapp-design-system-2026-08-25-sky-canvas/generate-current-formal-handoff.mjs
      category: legacy_migration
      owner: design-system-maintainers
      introduced_at: "2026-08-25"
      reason: This transitional one-resource authoring carrier keeps selected-source copying, complete Fact-universe generation, feasibility binding and two constraint handoffs deterministic while the recovered Open Design project is formalized; it is not production runtime code, and its oversized generateTarget function remains explicit bounded tooling debt.
      tracking_issue: STARWARD-DRA-MOD-001
      expiry_condition: Split provider/source packaging, manifest construction, feasibility generation and handoff rendering into focused modules before adding another formal target set, provider or reusable authoring workflow.
    - path: docs/design-resources/miniapp-design-system-2026-08-25-sky-canvas/selected-source/assets/current-review.js
      category: fixture_snapshot
      owner: design-system-maintainers
      introduced_at: "2026-08-25"
      reason: This file is an immutable selected-source copy of the reviewed Open Design interaction fixture; rewriting its aggregate event wiring after selection would invalidate the canonical resource identity without improving production modularity, and production code is forbidden from importing it.
      tracking_issue: STARWARD-DRA-MOD-001
      expiry_condition: Remove this waiver when a newly selected immutable source replaces the fixture with modular provider output, or split the editable Open Design upstream before any future selection that materially changes this interaction script.
    - path: docs/design-resources/miniapp-design-system-2026-09-02-sky-canvas-field-signal/selected-source/preview/shared.js
      category: fixture_snapshot
      owner: design-system-maintainers
      introduced_at: "2026-09-02"
      reason: This file is an immutable selected-source copy of the reviewed Open Design preview runtime; splitting it after selection would invalidate the manifest-bound source identity, it is not production runtime code, and production packages are forbidden from importing it.
      tracking_issue: STARWARD-DRA-MOD-001
      expiry_condition: Remove this waiver when a newly selected immutable source replaces this preview with modular provider output, or split the editable Open Design upstream before selecting a future revision that materially changes the shared preview runtime.
    - path: docs/design-resources/miniapp-design-system-2026-09-02-sky-canvas-field-signal/selected-source/verify.mjs
      category: fixture_snapshot
      owner: design-system-maintainers
      introduced_at: "2026-09-02"
      reason: This file is the immutable reviewed source package's own integrity and design-contract checker; splitting it after selection would invalidate the manifest-bound source identity, and repository verification wraps rather than imports it as production code.
      tracking_issue: STARWARD-DRA-MOD-001
      expiry_condition: Remove this waiver when a newly selected immutable source ships a modular checker, or split the editable Open Design upstream before selecting a future revision that materially expands this checker.
    - path: docs/design-resources/miniapp-field-signal-i21-selected-2026-09-03/generate-formal-handoff.mjs
      category: legacy_migration
      owner: design-system-maintainers
      introduced_at: "2026-09-03"
      reason: This task-local deterministic carrier preserves the exact selected-source packaging, complete V1 Fact-universe generation, feasibility mapping and formal handoff rendering used for the I21 resource; it is not production runtime code, and splitting it after publication would add a second reconstruction path without changing the selected product contract.
      tracking_issue: STARWARD-DRA-MOD-001
      expiry_condition: Split source packaging, Fact generation, feasibility mapping and handoff rendering before reusing this generator for another selected target or materially changing the formal handoff schema.
    - path: docs/design-resources/miniapp-field-signal-i21-selected-2026-09-03/selected-source/assets/app.js
      category: fixture_snapshot
      owner: design-system-maintainers
      introduced_at: "2026-09-03"
      reason: This file is the immutable byte-exact copy of the independently reviewed Open Design interaction fixture; rewriting its aggregate prototype event wiring after selection would invalidate the canonical resource identity, and production packages are forbidden from importing it.
      tracking_issue: STARWARD-DRA-MOD-001
      expiry_condition: Remove this waiver when a newly selected immutable source replaces the fixture with modular provider output, or split the editable Open Design upstream before selecting a future revision that materially changes this interaction script.
    - path: docs/design-resources/miniapp-field-signal-i21-binding-2026-09-04-r4/selected-source/assets/app.js
      category: fixture_snapshot
      owner: design-system-maintainers
      introduced_at: "2026-09-04"
      reason: This file is the immutable byte-exact copy of the independently reviewed Open Design interaction fixture; rewriting its aggregate prototype event wiring after selection would invalidate the canonical resource identity, and production packages are forbidden from importing it.
      tracking_issue: STARWARD-DRA-MOD-001
      expiry_condition: Remove this waiver when a newly selected immutable source replaces the fixture with modular provider output, or split the editable Open Design upstream before selecting a future revision that materially changes this interaction script.
managed_files:
  - path: AGENTS.md
    strategy: merge-block
  - path: Makefile
    strategy: merge-block
  - path: .codex/skills
    strategy: managed
  - path: .codex/ty-context-managed/context_templates
    strategy: managed
  - path: .codex/ty-context-managed/make/ty-context.mk
    strategy: managed
  - path: tools
    strategy: managed
  - path: .github/workflows/harness.yml
    strategy: create-if-missing
never_overwrite:
  - project_context/**
  - DESIGN.md
  - src/**
  - tests/**
