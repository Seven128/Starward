<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>今晚去观星 · Demo 运营台</title>
    <style>
      :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #111; color: #f4eee7; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; }
      header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; position: sticky; top: 0; background: #111; padding-bottom: 16px; z-index: 2; }
      label { display: grid; gap: 4px; }
      input, button { min-height: 44px; border: 1px solid #615d58; border-radius: 10px; background: #242321; color: inherit; padding: 8px 12px; }
      button { cursor: pointer; }
      button.primary { background: #a84535; border-color: #c75b48; }
      .notice { color: #e8b09f; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
      section { border: 1px solid #45413c; border-radius: 14px; background: #1b1a19; padding: 16px; min-width: 0; }
      section.wide { grid-column: 1 / -1; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; background: #0c0c0c; padding: 12px; border-radius: 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid #383531; }
      .muted { color: #b9b1a9; }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Demo 运营台</h1><div class="notice">管理员 token 只保存在当前标签页；所有写操作进入审计。</div></div>
      <label>管理员 token<input id="token" type="password" autocomplete="off" /></label>
      <label>操作者<input id="actor" value="admin:local" /></label>
      <button id="load" class="primary">加载当前状态</button>
      <output id="status" aria-live="polite"></output>
    </header>
    <main>
      <section class="wide"><h2>观星点、坐标、场地与发布</h2><div id="spots"></div></section>
      <section><h2>图片与官方攻略</h2><pre id="articles"></pre></section>
      <section><h2>投稿 / 纠错 / 媒体审核</h2><div id="moderation"></div></section>
      <section><h2>数据源、许可与署名</h2><pre id="sources"></pre></section>
      <section><h2>供应商健康与调用量</h2><pre id="health"></pre></section>
      <section><h2>TonightDecision / 规则回放输入</h2><pre id="decisions"></pre></section>
      <section><h2>预算和告警</h2><pre id="costs"></pre></section>
      <section><h2>Worker / Outbox</h2><pre id="jobs"></pre></section>
      <section class="wide"><h2>管理员操作审计</h2><pre id="audits"></pre></section>
    </main>
    <script type="module" src="/admin/app.js"></script>
  </body>
</html>
