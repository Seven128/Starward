name: Backend bounded diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed check (imagery calls real BFF and records normal provider usage)
        type: choice
        options: [host, runtime, providers, imagery]
        default: host
        required: true

permissions:
  contents: read

concurrency:
  group: backend-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Run selected bounded check using existing Environment credentials
        env:
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
          SSH_CONNECTION: ${{ secrets.STARWARD_DIAGNOSTIC_CONNECTION }}
          SSH_PRIVATE_KEY: ${{ secrets.STARWARD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STARWARD_SSH_KNOWN_HOSTS }}
        run: node tools/deployment/run-host-diagnostics.mjs
