# Automated test suites retired for native migration; remaining steps do not claim automated product-test coverage.
name: Product CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
      - id: scope
        run: node tools/ci/affected-checks.mjs
      - name: Restore LFS object cache
        if: steps.scope.outputs.product == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs/objects
          key: ${{ runner.os }}-starward-lfs-${{ hashFiles('tools/resources/lfs-policy.json', 'workers/miniapp-api/assets/**', 'packages/astronomy-core/data/**', 'data-pipelines/runtime-data/current.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-starward-lfs-
      - name: Prepare current resource versions
        if: steps.scope.outputs.product == 'true'
        run: node tools/run-node.cjs tools/resources/assets.mjs prepare
      - name: Install locked dependencies
        if: steps.scope.outputs.product == 'true'
        run: |
          npm ci
          npm ci --ignore-scripts --prefix tools/deployment/oss-runtime
      - name: Verify commit-bound public backend data
        if: steps.scope.outputs.product == 'true'
        run: npm run backend:data:verify
      - name: Audit Mini Program API production dependencies
        if: steps.scope.outputs.product == 'true'
        run: npm audit --omit=dev --workspace @starward/miniapp-api --audit-level=high
      - name: Validate release transport shell
        if: steps.scope.outputs.product == 'true'
        run: sh -n infrastructure/deployment/run-remote-promotion.sh infrastructure/deployment/host-preflight.sh infrastructure/deployment/bootstrap-fresh-host.sh
      - name: Check release code
        if: steps.scope.outputs.product == 'true'
        run: npm run check:miniapp:release-code
      - name: Check native App API and admin consumers
        if: steps.scope.outputs.consumers == 'true'
        run: npm run check:product:consumers
      - name: Build backend release packages
        if: steps.scope.outputs.product == 'true'
        run: npm run build:miniapp:release
      - name: Build nondeployable WEAPP CI bundle
        if: steps.scope.outputs.product == 'true'
        run: npm run miniapp:bundle -- --lane ci --api-origin https://api.starward-ci.invalid --source-revision "$GITHUB_SHA"
      - name: Construct production OCI image
        if: steps.scope.outputs.product == 'true'
        run: docker build --file infrastructure/deployment/miniapp-api.Dockerfile --build-arg "STARWARD_RELEASE_REVISION=$GITHUB_SHA" --tag "starward-miniapp-api-ci:$GITHUB_SHA" .
