# Automated test suites retired for native migration; remaining steps do not claim automated product-test coverage.
name: Context structure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
      - id: scope
        run: node tools/ci/affected-checks.mjs
      - if: steps.scope.outputs.context == 'true'
        run: npm ci --ignore-scripts --workspace @starward/context-check --include-workspace-root=false
      - if: steps.scope.outputs.context == 'true'
        run: npm run context:validate
