<body>
  <main class="app" data-od-id="my-content-prototype">
    <span class="candidate" data-od-id="candidate-label">设计候选 · 示例数据 · 未选定</span>
    <header class="hero" data-od-id="artifact-heading">
      <div><h1>我的、主页链接与内容导入</h1><p>四等分“我的 / 收藏 / 计划 / 设置”页签无原生滚动条；My 首页聚焦收藏、主页链接与跨平台观星帖导入，计划与文章系统仍在各自页面保留。</p></div>
      <div class="controls" aria-label="显示审阅设置"><button class="control" id="largeToggle" aria-pressed="false">大字：关</button><button class="control" id="motionToggle" aria-pressed="false">减少动态：关</button></div>
    </header>
    <section class="workspace">

    function recoveryBanner(){const map={loading:['…','正在载入','稳定区域已保留，完成后原位更新。','等待'],empty:['○','这里还没有内容','可返回公开文章、创建草稿或查看收藏说明。','返回我的'],partial:['△','部分内容暂缺','保留可用资料并逐项标记；不会把缺失当作 0。','查看可用内容'],stale:['↻','正在使用陈旧缓存','显示更新时间；刷新不清空收藏、草稿或上传会话。','重新检查'],offline:['↓','离线 · 使用缓存','收藏、草稿和已缓存文章仍可用；联网后后台刷新。','保持离线'],error:['!','内容载入失败','本地收藏、草稿与设置未丢失，可以重试。','重试'],permission:['⌖','权限已拒绝','不会循环请求；可打开系统设置，或继续使用手动地点和本地选择。','查看替代'],provider:['◇','动态摘要来源暂时降级','收藏本身仍在；只隐藏不可用的今晚摘要。','再次检查'],rate:['⏱','操作过于频繁','草稿和上传会话已保留，请稍后重试。','返回草稿']};if(state.pageState==='ready')return'';const v=map[state.pageState];return `<div class="banner ${state.pageState==='error'?'danger':''}"><span>${v[0]}</span><span><strong>${v[1]}</strong>${v[2]} <button class="link-button" data-recover="${state.pageState}">${v[3]}</button></span></div>`}

    function importStatus(){return {idle:['i','尚未解析','自动解析属于能力依赖；也可直接手动导入。'],processing:['…','正在解析分享链接','保留链接、权利确认和已经编辑的草稿。'],success:['✓','解析成功 · 原型场景','已取得可编辑标题与正文样例；不代表平台 API 权限。'],partial:['△','部分成功','标题与正文可编辑；媒体未取得，仍可手动补充。'],unsupported:['!','平台或链接不支持','可切换手动导入，已编辑内容不会清空。'],expired:['!','分享链接已失效','请更新链接或手动导入；草稿保持。'],private:['◇','私密内容不可读','不会绕过权限；可确认权利后手动导入。'],rate:['⏱','平台限流','稍后重试或手动导入；不伪装成功。'],network:['↓','网络失败','链接与草稿已保留，可重试或手动继续。'],manual:['✎','手动导入','自动解析未使用；来源平台、原链接和导入时间仍保留。']}[state.importFlow.parse]}
    function importLineage(){const f=state.importFlow;return `<div class="lineage"><b>来源沿袭</b><span>原平台：${f.platform} · 原链接：${f.url||'未提供'}</span><span>导入时间：2026-08-06 20:30 · 解析：${importStatus()[1]}</span><span>编辑后的内容不会伪装成平台官方内容；来源持续可发现。</span></div>`}
    function importView(){const f=state.importFlow,status=importStatus();return `<div class="stack">${recoveryBanner()}<div class="import-steps" aria-label="导入步骤"><div class="import-step ${f.step===1?'current':''}">1 · 来源与权利</div><div class="import-step ${f.step===2?'current':''}">2 · 编辑草稿</div><div class="import-step ${f.step>=3?'current':''}">3 · 关联 / 新增点位</div></div>${f.step===1?`<article class="card" data-od-id="external-post-import-source"><h3>导入我的观星帖</h3><p>选择来源平台并粘贴自己的分享链接。自动解析取决于平台许可、URL allowlist 与运行时适配，本候选不声称已有 API 或抓取权限。</p><div class="platform-grid" style="margin-top:10px">${['小红书','微博','视频号','其他平台'].map(x=>`<button class="platform-option" data-import-platform="${x}" aria-pressed="${f.platform===x}">${x}</button>`).join('')}</div><div class="form-group"><label for="importUrl">分享链接 · 必填</label><input id="importUrl" value="${f.url}" inputmode="url" placeholder="https://..."><small>仅 http / https；服务端仍需 allowlist、重定向、大小、类型、超时与 SSRF 防护。</small><div id="importUrlError"></div></div><label class="check-row"><input type="checkbox" id="importRights" ${f.rights?'checked':''}><span>这是我有权导入和编辑的内容；我理解原平台、原链接、导入时间与来源说明会持续保留。</span></label><div class="parser-state banner ${['unsupported','expired','private','rate','network'].includes(f.parse)?'danger':f.parse==='success'?'success':''}"><span>${status[0]}</span><span><strong>${status[1]}</strong>${status[2]}</span></div><div class="action-row"><button class="button" id="manualImport">手动导入</button><button class="button" id="retryImport">${f.parse==='idle'?'解析链接':'重试解析'}</button>${['success','partial'].includes(f.parse)?'<button class="button primary" id="editImportedDraft">编辑导入草稿</button>':''}</div></article>`:f.step===2?`<article class="card" data-od-id="external-post-import-draft"><h3>编辑导入草稿</h3><p>解析失败或再次解析都不会清空这里的标题、正文和来源说明。</p>${importLineage()}<div class="form-group"><label for="importTitle">标题 · 必填</label><input id="importTitle" value="${f.title}" placeholder="我的观星记录"></div><div class="form-group"><label for="importBody">正文 · 必填</label><textarea id="importBody" placeholder="编辑导入后的正文">${f.body}</textarea></div><div class="form-group"><label for="importSourceNote">来源说明</label><input id="importSourceNote" value="${f.sourceNote}"></div><div class="form-group"><label for="importVisibility">可见范围</label><select id="importVisibility"><option value="public" ${f.visibility==='public'?'selected':''}>公开 · 审核后</option><option value="private" ${f.visibility==='private'?'selected':''}>仅自己</option></select></div><div class="banner"><span>图</span><span><strong>媒体状态</strong>${f.parse==='partial'?'解析未取得媒体；可在现有媒体上传流程手动补充。':'媒体仍需来源 / 权利确认、EXIF GPS 清理与审核。'}</span></div><div class="action-row"><button class="button" id="backImportSource">返回来源</button><button class="button" id="saveImportDraft">保存草稿</button><button class="button primary" id="toSpotAssociation">继续关联观星点</button></div></article>`:f.step===3?`<article class="card" data-od-id="external-post-spot-association"><h3>关联或新增观星地点</h3>${importLineage()}<div class="sheet-list" style="margin-top:10px"><label class="radio-option"><input type="radio" name="spotMode" value="existing" ${f.spotMode==='existing'?'checked':''}><span><b>关联已有观星点</b><br>选择正式 spot_id，不改变点位事实。</span></label><label class="radio-option"><input type="radio" name="spotMode" value="proposal" ${f.spotMode==='proposal'?'checked':''}><span><b>提出新增观星地点</b><br>创建独立点位提案并进入审核，不自动成为正式观星点。</span></label></div>${f.spotMode==='existing'?`<div class="form-group"><label for="existingSpot">已有观星点</label><select id="existingSpot"><option value="spot_demo_01">示例·海湾观星点 · spot_demo_01</option><option value="spot_demo_02">示例·北坡观星区 · spot_demo_02</option></select></div>`:`<div class="form-group"><label for="proposalName">地点名称 · 必填</label><input id="proposalName" value="${f.proposalName}" placeholder="待审核地点名称"></div><div class="form-group"><label for="proposalRegion">近似区域 · 必填</label><input id="proposalRegion" value="${f.proposalRegion}" placeholder="不提交敏感精确坐标"></div><div class="form-group"><label for="proposalNote">现场依据与不确定性</label><textarea id="proposalNote">${f.proposalNote}</textarea><small>新增点位提案将经过来源、位置敏感度、场地、安全和审核流程。</small></div>`}<div id="associationError"></div><div class="action-row"><button class="button" id="backImportDraft">返回编辑</button><button class="button" id="saveImportDraft">保存草稿</button><button class="button" id="previewImport">预览</button><button class="button primary" id="submitImport">${f.spotMode==='proposal'?'提交内容与点位提案审核':'提交导入内容审核'}</button></div></article>`:`<article class="card"><div class="banner success"><span>✓</span><span><strong>导入内容已提交审核</strong>${f.spotMode==='proposal'?'新增观星地点提案为“审核中”，未创建正式 spot_id。':'已关联 '+f.existingSpot+'；内容仍按审核状态处理。'}</span></div>${importLineage()}<div class="source-block" style="margin-top:10px"><div class="source-row"><span>内容状态</span><b>审核中 · 不自动发布</b></div><div class="source-row"><span>点位关联</span><b>${f.spotMode==='proposal'?'新增观星地点提案 · PENDING_REVIEW':f.existingSpot}</b></div><div class="source-row"><span>草稿恢复</span><b>${f.savedAt} · 原编辑内容保留</b></div></div><div class="action-row"><button class="button" id="editImportAgain">返回编辑</button><button class="button" data-route-go="submissions">查看审核记录</button></div></article>`}</div>`}
    function favorites(){const ids=[...state.mine.favorites];if(state.sort==='distance')ids.reverse();return `<div class="stack">${recoveryBanner()}<div class="sort-row"><select class="select-field" id="favoriteSort" aria-label="收藏排序"><option value="saved" ${state.sort==='saved'?'selected':''}>按收藏时间</option><option value="distance" ${state.sort==='distance'?'selected':''}>按距离</option><option value="condition" ${state.sort==='condition'?'selected':''}>按近期条件</option></select><span class="tag">中密度</span></div>${state.summaryFail||state.pageState==='provider'?'<div class="banner"><span>◇</span><span><strong>今晚动态摘要暂不可用</strong>收藏没有被删除；仍可打开详情、排序或取消收藏。</span></div>':''}<div class="favorite-list" data-od-id="favorites-list">${ids.length?ids.map(id=>favoriteCard(id)).join(''):'<article class="card flat"><h3>暂无收藏</h3><p>从地图或 Spot 收藏后会出现在这里；空状态不会制造示例数量。</p></article>'}</div></div>`}
    function favoriteCard(id){const s=spots[id];return `<article class="favorite" data-favorite="${id}"><div class="favorite-top"><span class="spot-symbol" aria-hidden="true">${s.symbol}</span><span><b>${s.name}</b><small>${s.relation} · ${s.saved}</small></span><button class="link-button remove-favorite" data-id="${id}" aria-label="取消收藏 ${s.name}">取消</button></div><div class="favorite-meta"><span class="mini-pill">${state.summaryFail?'今晚摘要不可用':s.decision}</span><span class="mini-pill">${s.facilities}</span><span class="mini-pill">${s.fresh}</span></div><button class="button" data-open-spot="${id}">打开详情并保留列表位置</button></article>`}
    function normalizeCommercialReminder(){if(state.edition==='commercial'&&state.mine.reminder==='unavailable')state.mine.reminder='not_requested'}
    function plan(){normalizeCommercialReminder();const r=state.edition==='demo'?'unavailable':state.mine.reminder;const reminder={unavailable:['Demo 不开放提醒','计划仍保存，可手动查看'],not_requested:['尚未请求提醒','本次计划可在明确动作点请求提醒'],accepted:['提醒已接受','仅针对本计划窗口的示例'],declined:['提醒已拒绝','不循环请求，计划仍保存'],expired:['提醒已过期','可在明确动作点重新申请']}[r];return `<div class="stack">${recoveryBanner()}${contextCard()}<article class="card" data-od-id="lightweight-plan"><div class="card-head"><div><h3>周四夜空准备</h3><p>轻量计划 · 非多人项目或行程优化</p></div><span class="tag">草稿已保存</span></div><div class="plan-path"><div class="plan-step"><span class="plan-no">1</span><div><b>${state.shared.place}</b><span>${state.shared.date} · ${state.shared.time} · ${state.shared.timezone}</span></div></div><div class="plan-step"><span class="plan-no">2</span><div><b>预计窗口 21:40–22:50</b><span>今晚结论“可考虑” · 示例数据 20:10 更新</span></div></div><div class="plan-step"><span class="plan-no">3</span><div><b>${state.shared.target}</b><span>西南区域示意 · 高度与方位不作精度证明</span></div></div><div class="plan-step"><span class="plan-no">4</span><div><b>末段约 1.2 km 窄路</b><span>停车估算 · 雨雪后状态未知 · 出发前复核</span></div></div></div></article><article class="card flat"><div class="card-head"><div><h3>提醒与订阅</h3><p>${reminder[1]}</p></div><span class="tag ${r==='declined'||r==='expired'?'warn':''}">${reminder[0]}</span></div><div class="action-row"><button class="button" id="reminderAction">${state.edition==='demo'?'查看商用门槛':'设置本次提醒'}</button><button class="button" data-sheet="reminder">审阅全部状态</button></div></article><article class="card"><h3>新鲜度</h3><p>计划保存于 2026-08-06 19:50 · 天气为示例数据 20:10 更新。离线时保留计划与缓存年龄，不继续声称新鲜。</p></article></div>`}
    const settingRows=[['mode','◐','显示模式','日 / 夜默认与手动观测红'],['units','≡','单位','温度、距离、风速与即时预览'],['location','⌖','位置与权限','权限状态、系统设置与手动地点'],['source','i','数据来源与更新','示例、估算、覆盖、署名与冲突'],['notifications','□','提醒与订阅','接受、拒绝、过期与商用门槛'],['privacy','◇','隐私、缓存、账户与数据','位置处理、导出、删除与注销'],['about','?','关于、协议与反馈','版本来源、协议、许可与反馈']];
    function settings(){return `<div class="stack">${recoveryBanner()}<article class="card flat"><h3>设置</h3><p>设置变化不丢失当前路线、共享 Night 上下文、草稿或上传会话。</p></article><div class="settings-list" data-od-id="settings-families">${settingRows.map(x=>`<button class="setting-row ${x[0]==='privacy'?'destructive':''}" data-setting="${x[0]}"><span class="setting-icon">${x[1]}</span><span><b>${x[2]}</b><small>${x[3]}</small></span><span class="chevron">›</span></button>`).join('')}</div></div>`}
    function article(){if(state.articleState==='loading')return `<div class="stack"><div class="banner"><span>…</span><span><strong>正在载入文章</strong>标题与来源区域保持稳定。</span></div><button class="button" id="articleReady">完成载入</button></div>`;if(state.articleState==='error')return `<div class="stack"><div class="banner danger"><span>!</span><span><strong>文章载入失败</strong>来源摘要和相关 Spot 仍保留；可以重试或返回。</span></div><button class="button primary" id="articleRetry">重新载入</button></div>`;return `<div class="stack">${state.articleState==='offline'||state.pageState==='offline'?'<div class="banner"><span>↓</span><span><strong>离线文章缓存</strong>缓存于 2026-08-05；外部链接暂不可用。</span></div>':''}<article class="article-copy" data-od-id="article-detail"><span class="tag">官方示例 · 未实地核验</span><h3 style="margin-top:10px">第一次到场：先确认末段道路与风口</h3><p>先在有照明的安全区域确认停车、退路、道路与关闭信息，再移动到观测位置。缓存路线、用户经验和示例天气都不能替代现场安全判断。</p><div class="article-hero"><div><i>文</i><b>示例视觉 · 非实景照片</b><br><small>没有获许可的真实地点媒体，不自动打开</small></div></div><p>观察前先把路线、场地与天气作为三组独立证据检查。若任何硬安全阻断出现，即使云量改善，也应改期或返回安全地点。</p></article><article class="card flat source-block"><div class="source-row"><span>作者 / 来源</span><b>示例编辑部 · 官方内容示例</b></div><div class="source-row"><span>发布 / 更新</span><b>2026-08-02 / 2026-08-05</b></div><div class="source-row"><span>核验</span><b>未实地核验 · 平台标注示例</b></div><div class="source-row"><span>相关 Spot</span><b>示例·海湾观星点 · spot_demo_01</b></div></article><div class="action-row"><button class="button" data-open-spot="spot_demo_01">打开相关 Spot</button><button class="button" id="articleFail">模拟载入失败</button></div></div>`}
    function moderationActions(){const m=state.moderation;if(m==='DRAFT')return '<button class="button primary" id="submitRecord">提交审核</button>';if(m==='PENDING_REVIEW')return '<button class="button" disabled>等待审核 · 不自动发布</button>';if(m==='APPROVED')return '<button class="button primary" id="publishRecord">确认发布</button>';if(m==='REJECTED')return '<button class="button" data-route-go="form">编辑修改</button><button class="button primary" id="resubmitRecord">重新提交</button>';if(m==='HIDDEN')return '<button class="button" id="appealRecord">在允许范围申诉</button>';if(m==='DISPUTED')return '<button class="button" disabled>申诉处理中 · 保留历史</button>';return '<button class="button" data-route-go="form">查看保存版本</button>'}
    function submissions(){const gated=state.edition==='demo'||state.auth==='guest';return `<div class="stack">${recoveryBanner()}${gated?`<div class="banner"><span>◇</span><span><strong>${state.edition==='demo'?'Demo · 官方 / 白名单主导':'登录后查看自己的记录'}</strong>${state.edition==='demo'?'普通建议可私下进入审核，不会自动发布。':'公开浏览不需要登录；投稿、申诉和个人记录需要身份。'}</span></div>`:''}<article class="card" data-od-id="submission-hub"><div class="card-head"><div><h3>提交中心与记录</h3><p>状态由用户语言完整呈现，不定义管理后台。</p></div><span class="tag ${gated?'warn':''}">${gated?'门槛可见':'商用已登录'}</span></div><div class="moderation-track" aria-label="完整审核状态">${modOrder.map(m=>`<div class="mod-step ${state.moderation===m?'current':''}"><b>${modLabels[m]}</b><span>${m}</span></div>`).join('')}</div><div class="record"><div class="record-top"><h4>${formTypeLabel()} · 示例草稿</h4><span class="tag">${modLabels[state.moderation]}</span></div><p>${moderationCopy()}</p><div class="action-row">${moderationActions()}</div></div><div class="action-row"><button class="button" data-gated-route="form">新建 / 纠正 / 现场报告</button><button class="button" data-gated-route="media">媒体上传</button></div></article><article class="card flat"><h3>提交类型</h3><p>Spot 投稿、Spot 纠正、现场报告与文章投稿共用草稿、来源、权利、坐标敏感度、媒体会话和审核语义。</p></article></div>`}
    function formTypeLabel(){return {spot:'新增 Spot',correction:'Spot 纠正',field:'现场报告',article:'文章投稿'}[state.formType]}
    function moderationCopy(){return {DRAFT:'尚未公开；草稿已在本机保存。',PENDING_REVIEW:'审核服务降级时仍保持“审核中”，不会自动发布。',APPROVED:'内容已通过，仍需用户可见的发布确认。',REJECTED:'示例原因：来源说明不完整。可编辑并重新提交。',PUBLISHED:'公开状态示例；来源与版本历史保持可见。',HIDDEN:'示例原因：场地状态待复核。若政策允许可申诉。',DISPUTED:'申诉已提交，原内容保持隐藏，历史不删除。',ARCHIVED:'已归档；只读版本与处理历史仍可查看。'}[state.moderation]}
    function formView(){return `<div class="stack">${recoveryBanner()}<article class="card" data-od-id="submission-form"><div class="form-tabs">${[['spot','新增 Spot'],['correction','Spot 纠正'],['field','现场报告'],['article','文章投稿']].map(x=>`<button class="chip form-type" data-form-type="${x[0]}" aria-pressed="${state.formType===x[0]}">${x[1]}</button>`).join('')}</div><h3>${formTypeLabel()}</h3><p>${state.formType==='article'?'文章需关联来源、权利与可选 Spot；被拒后保留修改点。':'位置、场地或现场事实只作为待审核提交，不自动成为公开事实。'}</p><div class="form-group"><label for="formTitle">${state.formType==='article'?'标题':'地点 / 事项名称'} · 必填</label><input id="formTitle" value="${state.form.title}" placeholder="输入持久示例内容">${state.formErrors.title?'<span class="field-error">请填写名称或标题</span>':''}</div><div class="form-group"><label for="formSummary">${state.formType==='field'?'当前道路、设施、季节或安全情况':'说明 / 正文摘要'} · 必填</label><textarea id="formSummary" placeholder="写明发生了什么、有效日期和仍不确定的部分">${state.form.summary}</textarea>${state.formErrors.summary?'<span class="field-error">请补充可审核的说明</span>':''}</div><div class="form-group"><label for="effectiveDate">事实有效日期</label><input id="effectiveDate" type="date" value="${state.form.effective}"></div><div class="form-group"><label for="sensitivity">坐标敏感度</label><select id="sensitivity"><option value="exact" ${state.form.sensitivity==='exact'?'selected':''}>精确 · 仅在允许时提交</option><option value="approximate" ${state.form.sensitivity==='approximate'?'selected':''}>近似区域 · 默认示例</option><option value="restricted" ${state.form.sensitivity==='restricted'?'selected':''}>受限 · 不对外显示</option><option value="hidden" ${state.form.sensitivity==='hidden'?'selected':''}>隐藏 · 不提供导航</option></select><small>坐标保护和公开范围由未来政策决定；本候选不暗示已获授权。</small></div><div class="form-group"><label for="formSource">来源 / 证据 · 必填</label><input id="formSource" value="${state.form.source}" placeholder="例如：本人现场观察 · 示例">${state.formErrors.source?'<span class="field-error">请说明来源或证据</span>':''}</div><label class="check-row" style="margin-top:10px"><input type="checkbox" id="rightsCheck" ${state.form.rights?'checked':''}><span>我有权提交这些文字和媒体，并理解 EXIF GPS 会在上传前移除。此处为原型同意，不是法律文本。</span></label>${state.formErrors.rights?'<span class="field-error">提交前需要确认来源与权利</span>':''}<div class="banner" style="margin-top:10px"><span>i</span><span><strong>审核提示</strong>保存草稿不公开；提交后进入“审核中”，不会自动发布。</span></div><div class="action-row"><button class="button" id="saveDraft">保存草稿</button><button class="button" data-route-go="media">管理媒体</button><button class="button primary" id="submitForm">提交审核</button></div></article></div>`}

    function closeSheet(restore=true,force=false){if(state.sheetKind==='linkEditor'&&state.sheetDirty&&!force){$('#unsavedLinkPrompt')?.remove();$('#sheetBody').insertAdjacentHTML('beforeend','<div class="banner danger" id="unsavedLinkPrompt" style="margin-top:10px"><span>!</span><span><strong>有未保存更改</strong>继续编辑，或明确放弃本次更改。<span class="action-row"><button class="button" id="continueLinkEdit">继续编辑</button><button class="button danger" id="discardLinkEdit">放弃更改</button></span></span></div>');$('#continueLinkEdit').addEventListener('click',()=>{$('#unsavedLinkPrompt').remove();$('#linkUrl')?.focus()});$('#discardLinkEdit').addEventListener('click',()=>{state.sheetDirty=false;closeSheet(true,true)});toast('有未保存更改');return state.lastFocusKey}$('#sheetOverlay').classList.remove('open');$('#sheetOverlay').setAttribute('aria-hidden','true');const key=state.lastFocusKey;state.lastFocusKey=null;state.sheetKind=null;state.sheetDirty=false;if(restore)restoreLogicalFocus(key);return key}
    function reset(){state.shared={...initialShared};state.mine={...initialMine,favorites:[...initialMine.favorites],profileLinks:initialMine.profileLinks.map(x=>({...x}))};state.route='home';state.history=[];state.tabScroll={home:0,favorites:0,plan:0,settings:0};state.edition='demo';state.auth='guest';state.mode='day';state.large=false;state.reduced=false;state.pageState='ready';state.favoriteFail=false;state.summaryFail=false;state.uploadFail=false;state.sort='saved';state.pendingAction=null;state.lastFocusKey=null;state.observationReturnKey=null;state.observationReturnRoute=null;state.articleState='ready';state.moderation='DRAFT';state.formType='spot';state.form={title:'',summary:'',source:'',sensitivity:'approximate',rights:false,effective:'2026-08-06'};state.formErrors={};state.importScenario='success';state.importFlow=initialImport();state.editingLinkId=null;state.sheetKind=null;state.sheetDirty=false;state.uploads=[{id:1,name:'设备摆放示例.jpg',progress:100,status:'done',caption:'设备位于安全硬地 · 示例',source:'本人拍摄声明 · 示例'},{id:2,name:'末段道路示例.jpg',progress:45,status:'uploading',caption:'末段道路状态 · 示例',source:'本人拍摄声明 · 示例'}];save();document.documentElement.dataset.scale='default';document.documentElement.dataset.motion='full';document.documentElement.style.setProperty('--phone-width','375px');$('#largeToggle').textContent='大字：关';$('#largeToggle').setAttribute('aria-pressed','false');$('#motionToggle').textContent='减少动态：关';$('#motionToggle').setAttribute('aria-pressed','false');$('#authToggle').textContent='访客';$('#authToggle').setAttribute('aria-pressed','false');$('#pageStateSelect').value='ready';$('#importScenarioSelect').value='success';$('#favoriteFail').textContent='下次移除失败：关';$('#favoriteFail').setAttribute('aria-pressed','false');$('#summaryFail').textContent='收藏摘要失败：关';$('#summaryFail').setAttribute('aria-pressed','false');$('#uploadFail').textContent='下次上传失败：关';$('#uploadFail').setAttribute('aria-pressed','false');$$('.edition-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.edition==='demo')));$$('.mode-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.modeChoice==='day')));$$('.width-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width==='375')));render();toast('已恢复 Demo · 访客 · 我的默认审阅状态')}
    $('#routeTabs').addEventListener('click',e=>{const b=e.target.closest('.route-btn');if(!b)return;if(b.dataset.route==='submissions')gatedNavigate('submissions',b);else navigate(b.dataset.route)});$('#backButton').addEventListener('click',()=>{const prev=state.history.pop()||'home';navigate(prev,false)});
    $$('.width-btn').forEach(b=>b.addEventListener('click',()=>{document.documentElement.style.setProperty('--phone-width',b.dataset.width+'px');$$('.width-btn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
    $$('.edition-btn').forEach(b=>b.addEventListener('click',()=>{state.edition=b.dataset.edition;normalizeCommercialReminder();$$('.edition-btn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
    $('#authToggle').addEventListener('click',e=>{state.auth=state.auth==='guest'?'signed':'guest';e.currentTarget.setAttribute('aria-pressed',String(state.auth==='signed'));e.currentTarget.textContent=state.auth==='signed'?'已登录':'访客';render()});
    $$('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.modeChoice)));
    $('#largeToggle').addEventListener('click',e=>{state.large=!state.large;document.documentElement.dataset.scale=state.large?'large':'default';e.currentTarget.setAttribute('aria-pressed',String(state.large));e.currentTarget.textContent=`大字：${state.large?'开':'关'}`});
    $('#motionToggle').addEventListener('click',e=>{state.reduced=!state.reduced;document.documentElement.dataset.motion=state.reduced?'reduced':'full';e.currentTarget.setAttribute('aria-pressed',String(state.reduced));e.currentTarget.textContent=`减少动态：${state.reduced?'开':'关'}`});
    $('#moderationSelect').addEventListener('change',e=>{state.moderation=e.target.value;if(state.route!=='submissions')state.route='submissions';render()});
    $('#pageStateSelect').addEventListener('change',e=>{state.pageState=e.target.value;render()});$('#importScenarioSelect').addEventListener('change',e=>{state.importScenario=e.target.value;if(state.route!=='import')toast(`下次导入解析场景：${e.target.options[e.target.selectedIndex].text}`)});$('#favoriteFail').addEventListener('click',e=>{state.favoriteFail=!state.favoriteFail;e.currentTarget.setAttribute('aria-pressed',String(state.favoriteFail));e.currentTarget.textContent=`下次移除失败：${state.favoriteFail?'开':'关'}`});$('#summaryFail').addEventListener('click',e=>{state.summaryFail=!state.summaryFail;e.currentTarget.setAttribute('aria-pressed',String(state.summaryFail));e.currentTarget.textContent=`收藏摘要失败：${state.summaryFail?'开':'关'}`;render()});$('#uploadFail').addEventListener('click',e=>{state.uploadFail=!state.uploadFail;e.currentTarget.setAttribute('aria-pressed',String(state.uploadFail));e.currentTarget.textContent=`下次上传失败：${state.uploadFail?'开':'关'}`});$('#resetReview').addEventListener('click',reset);
    $('#resetReview').addEventListener('click',()=>{$('#moderationSelect').value='DRAFT'});
    $('#phoneMain').addEventListener('scroll',()=>{if(TOP_TABS.includes(state.route))state.tabScroll[state.route]=$('#phoneMain').scrollTop},{passive:true});
    $('#closeSheet').addEventListener('click',closeSheet);$('#sheetOverlay').addEventListener('click',e=>{if(e.target===$('#sheetOverlay'))closeSheet()});$('#sheet').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=$$('#sheet button:not(:disabled),#sheet input:not(:disabled),#sheet select:not(:disabled),#sheet textarea:not(:disabled)');if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetOverlay').classList.contains('open'))closeSheet()});
    render();
  })();
