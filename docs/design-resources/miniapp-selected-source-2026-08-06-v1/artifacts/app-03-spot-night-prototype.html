<!doctype html>
<html lang="zh-CN" data-mode="night" data-scale="default" data-motion="full">

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>今晚去观星 · 观星点详情夜空原型</title>
  <style>

      --text-primary:#EEF5FF;--text-secondary:#A9BCD2;--text-tertiary:#7F96AF;--border:#29425F;
      --primary:#5AA7FF;--primary-pressed:#3389EA;--on-primary:#03101F;--accent-cyan:#67C4E9;
      --accent-violet:#8A8EF4;--accent-warm:#D8BE94;--success:#5CC99A;--warning:#F0B55B;

    html[data-mode="observation"]{

      --text-primary:#F4554E;--text-secondary:#E44A43;--text-tertiary:#D84A43;--border:#4D1716;
      --primary:#FF514A;--primary-pressed:#D83B36;--on-primary:#000000;--accent-cyan:#B83A35;
      --accent-violet:#C4403A;--accent-warm:#D94842;--success:#D84A43;--warning:#F05A52;

    html[data-mode="observation"] *{transition:none!important;animation:none!important;filter:none!important;text-shadow:none!important}
    *{box-sizing:border-box}html{background:var(--canvas);color:var(--text-primary);font-family:var(--font)}
    html[data-scale="large"]{font-size:118%}body{margin:0;min-width:0;background:var(--canvas);transition:background 240ms cubic-bezier(.2,.8,.2,1),color 240ms}
    html[data-motion="reduced"] *,html[data-motion="reduced"] *::before,html[data-motion="reduced"] *::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

rder-left:3px solid var(--primary);background:var(--surface-subtle);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.7rem;line-height:1.55}.sensor-status{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px}.sensor-status b{font-size:.72rem}.sensor-status span{font-size:.64rem;color:var(--text-secondary)}
    .observe-shell{grid-row:1/5;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--canvas);overflow:hidden}.observe-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}.observe-head h2{font-size:1rem;margin:0}.observe-main{overflow:auto;padding:16px;display:grid;align-content:start;gap:12px}.observe-time{font-size:clamp(2.2rem,12vw,3.4rem);font-variant-numeric:tabular-nums;line-height:1;font-weight:750}.observe-target{padding:16px;border:2px solid var(--primary);border-radius:var(--radius-md);background:var(--surface)}.observe-target small{display:block;color:var(--text-secondary)}.observe-target b{display:block;font-size:1.15rem;margin:5px 0}.observe-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--border);background:var(--surface)}
    .sheet-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--canvas) 72%,transparent);display:none;align-items:end;justify-content:center;z-index:30}.sheet-overlay.open{display:flex}.sheet{width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:18px;box-shadow:var(--shadow)}.sheet-head{display:flex;justify-content:space-between;gap:12px}.sheet h2{font-size:1.05rem;margin-bottom:4px}.sheet p{font-size:.72rem;line-height:1.55;color:var(--text-secondary)}.sheet-close{width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid label{display:grid;gap:5px;font-size:.7rem;color:var(--text-secondary)}.form-grid input,.form-grid select{width:100%;border:1px solid var(--border);background:var(--surface-subtle);border-radius:var(--radius-sm);padding:0 9px}.radio-list{display:grid;gap:8px}.radio-option{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;min-height:56px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-subtle)}.radio-option input[type="radio"]{width:20px;height:20px;min-height:20px;margin:0;appearance:none;-webkit-appearance:none;border:2px solid var(--border);border-radius:50%;background:var(--surface);display:grid;place-content:center}.radio-option input[type="radio"]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-primary);transform:scale(0)}.radio-option input[type="radio"]:checked{border-color:var(--primary);background:var(--primary)}.radio-option input[type="radio"]:checked::before{transform:scale(1)}

<body>
  <main class="app" data-od-id="night-sky-prototype">
    <span class="candidate" data-od-id="candidate-label">设计候选 · 示例数据 · 未选定</span>
    <header class="hero" data-od-id="artifact-heading">
      <div><h1>观星点详情 &gt; 夜空</h1><p>本资源保留稳定文件名，但不再代表独立一级页面：必须由观星点详情携带 spot_id 进入；日期、时间、目标、专业证据、天图和观测红都返回同一详情 SkyContext。</p></div>
      <div class="controls" aria-label="显示审阅设置"><button class="control" id="largeToggle" aria-pressed="false">大字：关</button><button class="control" id="motionToggle" aria-pressed="false">减少动态：关</button></div>
    </header>
    <section class="workspace">
      <aside class="review" data-od-id="review-controls">
        <h2>审阅状态台</h2><p>这些控件只切换候选场景；手机内控件承担真实任务交互。</p>
        <div class="review-section"><h3>宽度 · CSS px</h3><div class="review-grid"><button class="control width-btn" data-width="320" aria-pressed="false">320</button><button class="control width-btn" data-width="375" aria-pressed="true">375</button><button class="control width-btn" data-width="430" aria-pressed="false">430</button></div></div>
        <div class="review-section"><h3>今晚结论</h3><label>四态<select id="decisionSelect"><option value="recommend">推荐</option><option value="consider" selected>可考虑</option><option value="avoid">不建议</option><option value="insufficient">数据不足</option></select></label></div>
        <div class="review-section"><h3>专业数据</h3><label>矩阵与新鲜度<select id="dataSelect"><option value="ready">完整 · FRESH</option><option value="missing">单元缺失</option><option value="partial">部分时段</option><option value="stale">陈旧可用</option><option value="unavailable">不可用</option><option value="estimated">估算</option><option value="sample" selected>示例数据</option></select></label></div>
        <div class="review-section"><h3>页面恢复</h3><label>运行场景<select id="pageStateSelect"><option value="ready" selected>就绪</option><option value="loading">载入中</option><option value="empty">目标为空</option><option value="partial">部分数据</option><option value="stale">缓存陈旧</option><option value="offline">离线缓存</option><option value="error">数据载入失败</option><option value="provider">供应商降级</option><option value="spotmissing">缺少必需 spot_id</option><option value="compute">天文计算失败</option></select></label></div>
        <div class="review-section"><h3>传感器</h3><label>方向状态<select id="sensorSelect"><option value="calibrated">已校准</option><option value="low">精度较低</option><option value="unavailable">不可用</option><option value="manual">手动方向</option></select></label></div>
        <div class="review-section"><button class="control" id="resetReview">恢复默认审阅状态</button></div>
      </aside>
      <div class="phone-stage">
        <article class="phone" data-od-id="night-phone" aria-label="夜空手机原型">
          <div class="safe-top" aria-hidden="true"><div class="capsule"><i></i><i></i><i></i><span></span></div></div>
          <header class="phone-head" data-od-id="night-header"><div class="title-row"><button class="icon-button" id="backToSpot" aria-label="返回示例·海湾观星点详情的夜空分段">‹</button><div><div class="eyebrow" id="spotEyebrow">观星点详情 &gt; 夜空 · spot_demo_01</div><h2>本点位今晚夜空</h2></div><span class="status-clock" id="headerTime">20:30</span></div></header>
          <nav class="phone-tabs" role="tablist" aria-label="夜空页面"><button class="seg-btn" role="tab" data-view="home" aria-selected="true">今晚</button><button class="seg-btn" role="tab" data-view="pro" aria-selected="false">专业数据</button><button class="seg-btn" role="tab" data-view="targets" aria-selected="false">目标</button><button class="seg-btn" role="tab" data-view="sky" aria-selected="false">简化天图</button></nav>
          <div class="phone-main" id="phoneMain" tabindex="-1"></div>
          <section class="observe-shell" id="observeShell" hidden aria-label="观测红模式"></section>
        </article>
      </div>
    </section>
  </main>
  <div class="sheet-overlay" id="sheetOverlay" aria-hidden="true"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header class="sheet-head"><div><h2 id="sheetTitle"></h2><p id="sheetSubtitle"></p></div><button class="sheet-close" id="closeSheet" aria-label="关闭弹层">×</button></header><div id="sheetBody"></div></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (()=>{
    'use strict';
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const STORAGE='starward-shared-v1';
    const initialShared={place:'示例·海湾观星点',placeSource:'spot',spotId:'spot_demo_01',date:'2026-08-06',time:'20:30',timezone:'Asia/Shanghai',target:'银河中心'};
    function loadShared(){try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'{}');return {...initialShared,date:saved.date||initialShared.date,time:saved.time||initialShared.time,timezone:saved.timezone||initialShared.timezone,target:saved.target||initialShared.target,place:initialShared.place,placeSource:'spot',spotId:'spot_demo_01'}}catch(_){return {...initialShared}}}
    const state={shared:loadShared(),view:'home',decision:'consider',dataState:'sample',pageState:'ready',sensor:'calibrated',selectedHour:1,skyMinute:90,bearing:228,mode:'night',large:false,reduced:false,keepAwake:false,weatherAlert:false,lastFocusKey:null,observationReturnKey:null,targetFilter:'all',targetQuery:''};
    const decisions={
      recommend:{label:'推荐',symbol:'✓',window:'21:10–23:20',quality:'条件较稳',reasons:['预计 21:20 后低云减少','月光影响可能较低','阵风暂未触发安全阈值']},
      consider:{label:'可考虑',symbol:'≈',window:'21:40–22:50',quality:'有条件地准备',reasons:['云量存在间歇波动','22:50 后风力可能增强','建议到场前再次查看更新']},
      avoid:{label:'不建议',symbol:'!',window:'暂无安全窗口',quality:'优先改期',reasons:['预计阵风持续增强','低云覆盖可能增多','不确定性不足以支持出发']},
      insufficient:{label:'数据不足',symbol:'?',window:'暂不能判断',quality:'等待有效数据',reasons:['部分天气时段缺失','天文计算结果不可用','仍可手动查看目标与方向']}
    };
    const targets=[
      {name:'银河中心',icon:'✦',dir:'估算 · 西南',alt:'约 24°–31°',window:'21:35–22:55',difficulty:'进阶',profile:'camera',note:'区域示意；确切方位与高度待运行时计算'},
      {name:'夏季大三角',icon:'△',dir:'样例 · 东南至天顶',alt:'中高空',window:'20:40–次日 00:20',difficulty:'入门',profile:'naked',note:'三颗亮星构成的识别区域'},
      {name:'土星',icon:'○',dir:'估算 · 东南',alt:'低至中空',window:'22:10 后',difficulty:'双筒镜',profile:'binocular',note:'亮点示意；不承诺现场可见'},
      {name:'月面',icon:'◒',dir:'样例 · 西偏南',alt:'低空',window:'20:30–21:15',difficulty:'入门',profile:'naked',note:'月光影响与地平遮挡需同时判断'},
      {name:'猎户座',icon:'✦',dir:'估算 · 方向待计算',alt:'高度待计算',window:'时段待计算',difficulty:'入门',profile:'naked',note:'候选示例；需由当前 spot_id、当地日期时间与时区计算'},
      {name:'木星',icon:'○',dir:'计算示例 · 东南方向',alt:'高度为示例',window:'窗口为示例',difficulty:'双筒镜',profile:'binocular',note:'仅示意计算结果结构，不声称当前上下文可见'},
      {name:'金星',icon:'○',dir:'不可用 · 方向不可用',alt:'高度不可用',window:'窗口不可用',difficulty:'肉眼',profile:'naked',note:'当前上下文无有效结果，不显示替代数值'},
      {name:'流星雨',icon:'◇',dir:'数据不足 · 辐射点不可用',alt:'高度不可用',window:'事件窗口不可用',difficulty:'肉眼',profile:'naked',note:'事件资料不足；不生成虚假窗口或方向'},
      {name:'双星伴月',icon:'◒',dir:'估算 · 关系待计算',alt:'高度待计算',window:'日期匹配待计算',difficulty:'肉眼',profile:'naked',note:'候选天象示例；不声称当前日期发生'}
    ];
    const hours=['20:30','21:30','22:30','23:30','00:30'];
    const rows=[['总云量','%',['48','36','42','61','72']],['降水概率','%',['10','10','15','20','25']],['阵风','m/s',['5.2','4.6','5.8','7.1','8.0']],['气温','°C',['18','17','16','15','15']],['湿度','%',['68','71','74','78','81']],['能见度','km',['18','20','19','16','14']],['月球高度','°',['18','11','4','—','—']],['银河中心高度','°',['24','29','31','27','19']]];
    let toastTimer;
    function isLiveVisible(el){if(!el?.isConnected||el.hidden||el.getAttribute?.('aria-hidden')==='true')return false;const style=getComputedStyle(el);return style.display!=='none'&&style.visibility!=='hidden'&&el.getClientRects().length>0}
    function logicalFocusKey(el){if(!(el instanceof HTMLElement))return null;if(el.id)return `id:${el.id}`;for(const name of ['focusKey','sheet','go','recover','target','filter'])if(el.dataset?.[name]!=null)return `${name}:${el.dataset[name]||'true'}`;if(el.hasAttribute('data-enter-observe'))return 'enterObserve:true';return el.matches('button,input,select,[tabindex]')?`text:${el.textContent.trim().replace(/\s+/g,' ')}`:null}
    function restoreLogicalFocus(key){if(!key)return false;const el=$$('button,input,select,[tabindex],[data-focus-key]').find(x=>logicalFocusKey(x)===key&&isLiveVisible(x));if(!el)return false;requestAnimationFrame(()=>{if(isLiveVisible(el))el.focus()});return true}
    function saveShared(){try{localStorage.setItem(STORAGE,JSON.stringify(state.shared))}catch(_){}}
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),state.reduced?500:1700)}
    function target(){return targets.find(t=>t.name===state.shared.target)||targets[0]}
    function freshness(){return {ready:['数据新鲜','FRESH','示例模型 · 20:10 更新'],missing:['单元缺失','PARTIAL','风速 22:30 缺失'],partial:['部分时段','PARTIAL','00:30 后暂不可用'],stale:['陈旧可用','STALE_USABLE','缓存于 18:40 · 请刷新'],unavailable:['数据不可用','UNAVAILABLE','不显示替代数值'],estimated:['估算','ESTIMATED','估算方法尚未选定'],sample:['示例数据','SAMPLE_DATA','产品试算 · 20:10 更新']}[state.dataState]}
    function effectiveDecision(){return (state.dataState==='stale'||state.dataState==='unavailable'||state.pageState==='compute')&&state.decision==='recommend'?'insufficient':state.decision}
    function currentDateTime(){return `${state.shared.date} · ${state.shared.time}`}
    function contextCard(){return `<article class="card flat context-card" data-od-id="shared-sky-context"><div><b>${state.shared.place}</b><span>必需 spot_id：${state.shared.spotId||'缺失'}<br>${currentDateTime()} · ${state.shared.timezone} · ${Number(state.shared.time.slice(0,2))<4?'归属前一观测夜':'当地日期归属'}</span></div><button class="link-button" data-sheet="context">更改日期时间</button></article>`}
    function recoveryBanner(){const map={loading:['…','正在载入详情夜空数据','保持 spot_id、日期、时间和稳定布局；完成后原位更新。','等待或返回'],empty:['○','没有符合筛选的目标','专业数据仍可查看；清除目标筛选即可恢复。','清除筛选'],partial:['△','部分数据暂缺','保留可用时段并逐项标记“—”；缺失不是 0。','查看可用部分'],stale:['↻','正在使用陈旧缓存','显示最后更新时间；刷新不会清空点位和目标。','重新检查'],offline:['↓','离线 · 使用缓存','缓存于 18:40，待联网后后台刷新；不声称数据新鲜。','保持离线'],error:['!','详情夜空数据载入失败','spot_id、日期时间和手动目标仍在；可以重试。','重试'],provider:['◇','天气来源暂时降级','保留有效缓存与计算事实；不可用行不编造替代值。','再次检查'],spotmissing:['!','缺少必需 spot_id','本页不能脱离观星点详情运行；不会降级为当前位置或普通地点。','返回点位详情'],compute:['?','天文计算暂不可用','天气事实仍可查看；目标高度和方位显示不可用。','重算']};if(state.pageState==='ready')return'';const v=map[state.pageState];return `<div class="banner ${['error','compute','spotmissing'].includes(state.pageState)?'danger':''}"><span>${v[0]}</span><span><strong>${v[1]}</strong>${v[2]} <button class="link-button" data-recover="${state.pageState}">${v[3]}</button></span></div>`}
    function decisionCard(){const d=decisions[effectiveDecision()],f=freshness();return `<article class="card" data-od-id="tonight-decision"><div class="decision-top"><span class="decision-symbol" aria-hidden="true">${d.symbol}</span><div class="decision-copy"><strong>${d.label}</strong><span>${d.quality} · 置信表达为示例</span></div></div><div class="best-window"><span><small>预计较合适窗口</small><b>${d.window}</b></span><span class="tag ${effectiveDecision()==='avoid'?'danger':''}">${f[0]}</span></div><div class="reasons">${d.reasons.map((x,i)=>`<div class="reason"><i>${i+1}</i><span>${x}</span></div>`).join('')}</div><div class="source-line"><span>${f[2]} · ${f[1]}</span><button class="link-button" data-sheet="source">来源</button></div></article>`}
    function home(){const t=target();return `<div class="stack">${recoveryBanner()}${contextCard()}${decisionCard()}<article class="card"><div class="card-head"><div><h3>天气与暗夜</h3><p>第一层只保留当前点位的决策证据</p></div><span class="tag">持续示例</span></div><div class="summary-grid" style="margin-top:10px"><div class="metric"><small>21:30 云量</small><b>36 <small>%</small></b><span>预计 · 单点样例</span></div><div class="metric"><small>阵风</small><b>4.6 <small>m/s</small></b><span>22:50 后可能增强</span></div><div class="metric"><small>无月光影响</small><b>约 22:05 后</b><span>月球低至地平以下 · 示例</span></div><div class="metric"><small>暗夜窗口</small><b>20:46–次日 04:37</b><span>跨午夜归同一观测夜</span></div></div></article><article class="card"><div class="card-head"><div><h3>今晚推荐观测目标</h3><p>候选示例 · 由 ${state.shared.spotId} + 日期时间 + 时区派生</p></div><span class="tag">${t.difficulty}</span></div><div class="summary-grid" style="margin-top:10px"><div class="metric"><small>已选 ${t.name}</small><b>${t.dir}</b><span>${t.alt} · 不作为精度证明</span></div><div class="metric"><small>候选窗口</small><b>${t.window}</b><span>${t.note}</span></div></div><div class="action-row"><button class="button" data-go="targets">查看候选与不可用状态</button><button class="button primary" data-go="sky">打开简化天图</button></div></article><article class="card flat"><h3>详情夜空专业数据</h3><p>小时矩阵包含云、降水、风、温度、湿度、能见度、月球与目标高度；每个缺失与估算保持标注，所有下钻返回同一详情夜空分段。</p><div class="action-row"><button class="button" data-go="pro">查看完整矩阵</button><button class="button" data-enter-observe>手动进入观测红</button></div></article><p class="landscape-note" style="display:none;color:var(--text-secondary);font-size:.66rem">横屏/短屏采用左右分区；天图与矩阵拥有自己的滚动区域。</p></div>`}
    function matrixCell(rowIndex,colIndex,value){let cls=colIndex===state.selectedHour?'selected ':'';if((state.dataState==='missing'&&rowIndex===2&&colIndex===2)||(state.dataState==='partial'&&colIndex===4))return `<td class="${cls}missing">—</td>`;if(state.dataState==='unavailable')return `<td class="${cls}missing">—</td>`;if(state.dataState==='stale')cls+='stale';return `<td class="${cls}">${value}</td>`}
    function pro(){const f=freshness();if(state.pageState==='loading')return `<div class="stack">${recoveryBanner()}<article class="card"><h3>专业数据几何已保留</h3><p>矩阵加载时不闪白，也不清空 SkyContext。</p></article></div>`;return `<div class="stack">${recoveryBanner()}${contextCard()}<article class="card" data-od-id="professional-matrix"><div class="card-head"><div><h3>逐小时专业数据</h3><p>${f[2]} · ${f[1]}</p></div><span class="tag ${['stale','unavailable'].includes(state.dataState)?'warn':''}">${f[0]}</span></div><div class="matrix-wrap" tabindex="0" aria-label="可横向滚动的逐小时数据矩阵"><table class="matrix"><thead><tr><th>当地时间 / 单位</th>${hours.map((h,i)=>`<th class="${i===state.selectedHour?'selected':''}"><button class="link-button hour" data-hour="${i}" aria-label="选择 ${h}">${h}</button></th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr><th>${r[0]} <small>${r[1]}</small></th>${r[2].map((v,ci)=>matrixCell(ri,ci,v)).join('')}</tr>`).join('')}</tbody></table></div><div class="legend"><span><i class="mark"></i>云/天气 · 实线圆</span><span><i class="mark diamond"></i>天体 · 虚线菱形</span><span><i class="mark triangle"></i>月光 · 点线三角</span></div><div class="source-line"><span>所选 ${hours[state.selectedHour]} · 单位固定显示 · 缺失不为 0</span><button class="link-button" data-sheet="source">来源与事件</button></div></article><article class="card flat"><h3>天文事件 · 示例</h3><div class="summary-grid"><div class="metric"><small>日落 / 民用暮光结束</small><b>18:48 / 19:14</b><span>当地时间</span></div><div class="metric"><small>天文暮光结束</small><b>20:46</b><span>暗夜起点示例</span></div><div class="metric"><small>月落</small><b>22:05</b><span>月相与干扰为示例</span></div><div class="metric"><small>银河中心窗口</small><b>21:35–22:55</b><span>西南区域示意</span></div></div></article></div>`}
    function targetsView(){let list=targets.filter(t=>(state.targetFilter==='all'||t.profile===state.targetFilter)&&t.name.includes(state.targetQuery));return `<div class="stack">${recoveryBanner()}${contextCard()}<article class="card" data-od-id="target-list"><div class="target-tools"><input class="field" id="targetSearch" type="search" value="${state.targetQuery}" placeholder="搜索目标" aria-label="搜索目标"><button class="button" id="clearTargets">清除</button></div><div class="chips" aria-label="目标筛选">${[['all','全部'],['naked','肉眼'],['binocular','双筒镜'],['camera','相机']].map(x=>`<button class="chip target-filter" data-filter="${x[0]}" aria-pressed="${state.targetFilter===x[0]}">${x[1]}</button>`).join('')}</div><div class="target-list">${list.length?list.map(t=>`<button class="target" data-target="${t.name}" aria-selected="${state.shared.target===t.name}"><span class="target-icon" aria-hidden="true">${t.icon}</span><span><b>${t.name} · ${t.dir}</b><small>${t.alt} · ${t.window}<br>${t.note}</small></span><span class="difficulty">${t.difficulty}</span></button>`).join(''):'<div class="banner"><span>○</span><span><strong>没有匹配目标</strong>清除搜索或筛选；已选目标仍保留。</span></div>'}</div></article><article class="card flat"><p>Demo 只示意少量主要目标，不是完整星表；方向、高度和窗口均为持久样例，不代表实际观测精度。</p></article></div>`}
    function skySvg(){const t=target();return `<svg viewBox="0 0 300 300" role="img" aria-label="简化半球天图，${t.name}位于${t.dir}，${t.alt}"><circle class="ring" cx="150" cy="150" r="132"/><ellipse class="horizon" cx="150" cy="160" rx="120" ry="56"/><path class="galaxy" d="M62 235 Q126 170 242 63"/><path class="constellation" d="M72 106 L108 86 L137 112 L171 77 L209 98 L228 68"/><circle class="star" cx="72" cy="106" r="4"/><circle class="star" cx="108" cy="86" r="6"/><circle class="star" cx="137" cy="112" r="3"/><circle class="star" cx="171" cy="77" r="5"/><circle class="star" cx="209" cy="98" r="4"/><circle class="moon" cx="76" cy="190" r="10"/><circle class="planet" cx="218" cy="164" r="7"/><circle class="selected-target" cx="112" cy="205" r="9"/><text x="144" y="20">北</text><text x="274" y="154">东</text><text x="144" y="292">南</text><text x="10" y="154">西</text><text x="90" y="224">${t.name}</text><text x="226" y="163">土星</text><text x="50" y="210">月</text></svg>`}
    function sensorLabel(){return {calibrated:['已校准','示例精度 ±6° · 仍可手动'],low:['精度较低','附近磁性物体可能干扰'],unavailable:['传感器不可用','不阻断任务，改用手动方向'],manual:['手动方向','方位 '+state.bearing+'° · 西南示意']}[state.sensor]}
    function sky(){const t=target(),s=sensorLabel();return `<div class="stack">${recoveryBanner()}${contextCard()}<article class="card" data-od-id="simplified-sky-map"><div class="card-head"><div><h3>简化半球天图</h3><p>${state.shared.date} · ${hours[Math.min(4,Math.floor(state.skyMinute/60))]} · ${t.name}</p></div><span class="tag">Demo 2D</span></div><div class="sky-frame">${skySvg()}</div><div class="legend"><span><i class="mark"></i>亮星</span><span><i class="mark diamond"></i>行星 / 目标</span><span><i class="mark triangle"></i>银河区域 / 月</span></div><div class="time-row"><button class="icon-button" id="stepBack" aria-label="时间后退十分钟">−</button><input class="range" id="timeSlider" type="range" min="0" max="240" step="10" value="${state.skyMinute}" aria-label="天图当地时间"><button class="icon-button" id="stepForward" aria-label="时间前进十分钟">+</button></div><div class="action-row"><button class="button" id="currentTime">回到 20:30</button><button class="button" data-go="targets">查找目标</button></div><div class="sensor-status"><div><b>${s[0]}</b><span>${s[1]}</span></div><button class="link-button" data-sheet="sensor">方向设置</button></div></article><div class="text-summary" data-od-id="sky-text-summary"><strong>文字摘要：</strong>${t.name}预计在${t.dir}，高度${t.alt}；${t.window}。银河带为区域示意，传感器不参与今晚结论，手动方向始终可用。</div><article class="card flat"><div class="action-row"><button class="button primary" data-enter-observe>手动进入观测红</button><button class="button" data-sheet="vendor">外部导航边界</button></div></article></div>`}
    function render(restoreKey=logicalFocusKey(document.activeElement)){document.documentElement.dataset.mode=state.mode;$('#headerTime').textContent=state.shared.time;$('#spotEyebrow').textContent=`观星点详情 > 夜空 · ${state.shared.spotId||'缺少 spot_id'}`;if(state.mode==='observation'){renderObservation(restoreKey);return}$('#observeShell').hidden=true;$('.safe-top').hidden=false;$('.phone-head').hidden=false;$('.phone-tabs').hidden=false;$('#phoneMain').hidden=false;const view={home,pro,targets:targetsView,sky}[state.view];$('#phoneMain').innerHTML=view();$$('.seg-btn').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===state.view)));bindDynamic();restoreLogicalFocus(restoreKey)}
    function renderObservation(restoreKey=logicalFocusKey(document.activeElement)){const t=target();$('.safe-top').hidden=true;$('.phone-head').hidden=true;$('.phone-tabs').hidden=true;$('#phoneMain').hidden=true;const shell=$('#observeShell');shell.hidden=false;shell.innerHTML=`<header class="observe-head"><div><div class="eyebrow">观星点详情 &gt; 夜空 · 手动观测红</div><h2>${state.shared.spotId} · 现场观测</h2></div><button class="button" id="exitObserve">退出观测红</button></header><div class="observe-main"><time class="observe-time">${state.shared.time}</time><div class="observe-target"><small>所选目标 · ${state.shared.place}</small><b>${t.name}</b><span>${t.dir} · ${t.alt}<br>预计窗口 ${t.window}</span></div>${state.weatherAlert?'<div class="banner danger"><span>!</span><span><strong>天气变化提醒</strong>示例缓存显示阵风可能提前增强；请先保证退路与安全。</span></div>':''}<div class="banner"><span>↓</span><span><strong>离线缓存 · 1 小时 50 分钟前更新</strong>仅保留最后已知值；不声称新鲜，联网后再检查。</span></div><article class="card flat"><div class="summary-grid"><div class="metric"><small>下一窗口</small><b>${t.window}</b><span>示例</span></div><div class="metric"><small>方向方式</small><b>${sensorLabel()[0]}</b><span>${sensorLabel()[1]}</span></div></div></article><button class="button" id="weatherToggle">${state.weatherAlert?'清除演示天气提醒':'模拟天气变化提醒'}</button><button class="button" id="keepAwake" aria-pressed="${state.keepAwake}">保持屏幕常亮：${state.keepAwake?'开':'关'} · 仅会话内</button></div><div class="observe-actions"><button class="button" data-sheet="vendor">外部导航</button><button class="button primary" id="exitObserveBottom">安全退出详情夜空</button></div>`;bindDynamic();restoreLogicalFocus(restoreKey)}
    function go(view){state.view=view;render();$('#phoneMain').scrollTop=0;setTimeout(()=>$('#phoneMain').focus(),0)}
    function bindDynamic(){$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));$$('[data-sheet]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.sheet,b)));$$('[data-recover]').forEach(b=>b.addEventListener('click',()=>{const was=b.dataset.recover;if(was==='spotmissing'){toast('必须从观星点详情进入；正在返回同一详情夜空分段');return}if(was==='empty'){state.targetFilter='all';state.targetQuery='';state.pageState='ready';render(logicalFocusKey(b))}else{state.pageState='ready';$('#pageStateSelect').value='ready';render(logicalFocusKey(b))}toast('已保留 spot_id 与 SkyContext 并恢复就绪')}));$$('[data-enter-observe]').forEach(b=>b.addEventListener('click',()=>enterObservation(b)));$('#targetSearch')?.addEventListener('input',e=>{state.targetQuery=e.target.value;targetsViewRefresh()});$('#clearTargets')?.addEventListener('click',e=>{state.targetQuery='';state.targetFilter='all';render(logicalFocusKey(e.currentTarget))});$$('.target-filter').forEach(b=>b.addEventListener('click',()=>{state.targetFilter=b.dataset.filter;render(logicalFocusKey(b))}));$$('.target').forEach(b=>b.addEventListener('click',()=>{state.shared.target=b.dataset.target;saveShared();render(logicalFocusKey(b));toast(`已选择 ${state.shared.target}；详情 SkyContext 已同步`)}));$$('.hour').forEach(b=>b.addEventListener('click',()=>{state.selectedHour=Number(b.dataset.hour);render(logicalFocusKey(b))}));$('#timeSlider')?.addEventListener('input',e=>{state.skyMinute=Number(e.target.value);render(logicalFocusKey(e.target))});$('#stepBack')?.addEventListener('click',e=>{state.skyMinute=Math.max(0,state.skyMinute-10);render(logicalFocusKey(e.currentTarget))});$('#stepForward')?.addEventListener('click',e=>{state.skyMinute=Math.min(240,state.skyMinute+10);render(logicalFocusKey(e.currentTarget))});$('#currentTime')?.addEventListener('click',e=>{state.skyMinute=0;render(logicalFocusKey(e.currentTarget));toast('天图已回到共享时间 20:30')});$('#exitObserve')?.addEventListener('click',exitObservation);$('#exitObserveBottom')?.addEventListener('click',exitObservation);$('#weatherToggle')?.addEventListener('click',e=>{state.weatherAlert=!state.weatherAlert;renderObservation(logicalFocusKey(e.currentTarget))});$('#keepAwake')?.addEventListener('click',e=>{state.keepAwake=!state.keepAwake;renderObservation(logicalFocusKey(e.currentTarget));toast('常亮仅为原型会话状态，能力待设备验证')})}
    function targetsViewRefresh(){clearTimeout(targetsViewRefresh.t);targetsViewRefresh.t=setTimeout(()=>render(),80)}
    function enterObservation(trigger){state.observationReturnKey=logicalFocusKey(trigger)||logicalFocusKey(document.activeElement);state.mode='observation';render('id:exitObserve');toast('已手动进入观测红；地点、时间与目标保持')}
    function exitObservation(){const returnKey=state.observationReturnKey;state.observationReturnKey=null;state.mode='night';render(returnKey);toast('已安全退出；返回同一观星点详情夜空上下文')}
    function openSheet(type,trigger){state.lastFocusKey=logicalFocusKey(trigger||document.activeElement);const title=$('#sheetTitle'),sub=$('#sheetSubtitle'),body=$('#sheetBody');
      if(type==='context'){title.textContent='本点位的日期与当地时间';sub.textContent='地点锁定为当前详情 spot_id；更改后同步今晚、专业数据、目标与天图，取消不提交。';body.innerHTML=`<div class="banner"><span>⌖</span><span><strong>${state.shared.place}</strong>必需 spot_id：${state.shared.spotId} · 不可切换为当前位置、城市或普通 POI。</span></div><div class="form-grid" style="margin-top:12px"><label>当地日期<input id="dateInput" type="date" value="${state.shared.date}"></label><label>当地时间<input id="timeInput" type="time" value="${state.shared.time}"></label><label>时区<select id="timezoneInput"><option value="Asia/Shanghai" selected>Asia/Shanghai · UTC+8</option></select></label></div><div class="banner" style="margin-top:12px"><span>i</span><span><strong>跨午夜归属</strong>00:00–03:59 仍标为前一观测夜；所有详情夜空下钻使用同一规则。</span></div><div class="action-row"><button class="button primary" id="applyContext">应用到本点位 SkyContext</button></div>`}
      if(type==='source'){const f=freshness();title.textContent='来源、新鲜度与事件';sub.textContent='示例、估算、覆盖和缺失保持持久可见。';body.innerHTML=`<div class="summary-grid"><div class="metric"><small>当前状态</small><b>${f[0]}</b><span>${f[1]} · ${f[2]}</span></div><div class="metric"><small>覆盖</small><b>试行区域 · 示例</b><span>全国与实时权益未确认</span></div><div class="metric"><small>天气</small><b>产品归一化样例</b><span>供应商与许可未选定</span></div><div class="metric"><small>天文事件</small><b>候选计算样例</b><span>精度尚未验证</span></div></div><div class="banner" style="margin-top:12px"><span>!</span><span><strong>冲突规则</strong>硬安全阻断和更新较新的官方事实优先；缺失显示“—”，不会替换成 0。</span></div>`}
      if(type==='sensor'){const s=sensorLabel();title.textContent='天图方向';sub.textContent='传感器不是完成任务的前提，手动方向始终可达。';body.innerHTML=`<div class="radio-list">${[['calibrated','已校准 · 示例精度 ±6°'],['low','精度较低 · 建议移开磁性物体'],['unavailable','不可用 · 直接手动继续'],['manual','手动方向 · 不读取传感器']].map(x=>`<label class="radio-option"><input type="radio" name="sensorState" value="${x[0]}" ${state.sensor===x[0]?'checked':''}><span>${x[1]}</span></label>`).join('')}</div><label style="display:grid;gap:6px;margin-top:12px;font-size:.72rem">手动方位 ${state.bearing}°<input class="range" id="bearingInput" type="range" min="0" max="359" value="${state.bearing}"></label><div class="action-row"><button class="button primary" id="applySensor">应用方向方式</button></div><p>${s[0]}：${s[1]}。校准结果只作示例，不代表设备精度证明。</p>`}
      if(type==='vendor'){title.textContent=state.mode==='observation'?'即将离开观测红界面':'外部导航边界';sub.textContent='系统或第三方地图可能无法遵守当前调色板。';body.innerHTML=`<div class="banner danger"><span>!</span><span><strong>${state.mode==='observation'?'外部界面可能明亮且非红色':'目标交给外部地图前需确认'}</strong>本原型不会启动网络或真实地图，也不绘制逐向路线。</span></div><div class="action-row"><button class="button" id="vendorCancel">取消并留在当前页</button><button class="button primary" id="vendorDemo">继续演示（不启动）</button></div>`}
      $('#sheetOverlay').classList.add('open');$('#sheetOverlay').setAttribute('aria-hidden','false');$('#closeSheet').focus();bindSheet()}
    function bindSheet(){$('#applyContext')?.addEventListener('click',()=>{const date=$('#dateInput').value,time=$('#timeInput').value;if(!date||!time){toast('请补全当地日期和时间');return}state.shared={...state.shared,place:initialShared.place,placeSource:'spot',spotId:'spot_demo_01',date,time,timezone:$('#timezoneInput').value};saveShared();const returnKey=closeSheet(false);render(returnKey);toast('日期时间已同步；spot_id 与详情归属保持')});$('#applySensor')?.addEventListener('click',()=>{state.sensor=$('input[name="sensorState"]:checked').value;state.bearing=Number($('#bearingInput').value);$('#sensorSelect').value=state.sensor;const returnKey=closeSheet(false);render(returnKey);toast('方向方式已应用，点位、目标与时间未改变')});$('#vendorCancel')?.addEventListener('click',()=>closeSheet());$('#vendorDemo')?.addEventListener('click',()=>{closeSheet();toast('演示：未启动外部地图')})}
    function closeSheet(restore=true){$('#sheetOverlay').classList.remove('open');$('#sheetOverlay').setAttribute('aria-hidden','true');const returnKey=state.lastFocusKey;state.lastFocusKey=null;if(restore)restoreLogicalFocus(returnKey);return returnKey}
    function reset(){state.shared={...initialShared};state.view='home';state.decision='consider';state.dataState='sample';state.pageState='ready';state.sensor='calibrated';state.selectedHour=1;state.skyMinute=90;state.bearing=228;state.mode='night';state.large=false;state.reduced=false;state.keepAwake=false;state.weatherAlert=false;state.targetFilter='all';state.targetQuery='';state.lastFocusKey=null;state.observationReturnKey=null;saveShared();document.documentElement.dataset.scale='default';document.documentElement.dataset.motion='full';document.documentElement.style.setProperty('--phone-width','375px');$('#largeToggle').textContent='大字：关';$('#largeToggle').setAttribute('aria-pressed','false');$('#motionToggle').textContent='减少动态：关';$('#motionToggle').setAttribute('aria-pressed','false');$('#decisionSelect').value='consider';$('#dataSelect').value='sample';$('#pageStateSelect').value='ready';$('#sensorSelect').value='calibrated';$$('.width-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width==='375')));render();toast('已恢复观星点详情夜空默认审阅状态')}
    $$('.seg-btn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
    $('#backToSpot').addEventListener('click',()=>toast('返回示例·海湾观星点详情：恢复夜空分段、滚动、日期时间与目标'));
    $$('.width-btn').forEach(b=>b.addEventListener('click',()=>{document.documentElement.style.setProperty('--phone-width',b.dataset.width+'px');$$('.width-btn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
    $('#largeToggle').addEventListener('click',e=>{state.large=!state.large;document.documentElement.dataset.scale=state.large?'large':'default';e.currentTarget.setAttribute('aria-pressed',String(state.large));e.currentTarget.textContent=`大字：${state.large?'开':'关'}`});
    $('#motionToggle').addEventListener('click',e=>{state.reduced=!state.reduced;document.documentElement.dataset.motion=state.reduced?'reduced':'full';e.currentTarget.setAttribute('aria-pressed',String(state.reduced));e.currentTarget.textContent=`减少动态：${state.reduced?'开':'关'}`});
    $('#decisionSelect').addEventListener('change',e=>{state.decision=e.target.value;render()});$('#dataSelect').addEventListener('change',e=>{state.dataState=e.target.value;render()});$('#pageStateSelect').addEventListener('change',e=>{state.pageState=e.target.value;if(state.pageState==='spotmissing')state.shared.spotId='';else if(!state.shared.spotId)state.shared.spotId='spot_demo_01';render()});$('#sensorSelect').addEventListener('change',e=>{state.sensor=e.target.value;render()});$('#resetReview').addEventListener('click',reset);
    $('#closeSheet').addEventListener('click',closeSheet);$('#sheetOverlay').addEventListener('click',e=>{if(e.target===$('#sheetOverlay'))closeSheet()});$('#sheet').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=$$('#sheet button:not(:disabled),#sheet input:not(:disabled),#sheet select:not(:disabled)');if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetOverlay').classList.contains('open'))closeSheet()});
    render();
  })();
  </script>
