<html lang="zh-CN" data-mode="day" data-scale="default" data-motion="full">

  <meta name="color-scheme" content="light dark">

  <style>
    :root{

      --primary:#5AA7FF;--primary-pressed:#3389EA;--on-primary:#03101F;--accent-cyan:#67C4E9;

      --text-primary:#F4554E;--text-secondary:#E44A43;--text-tertiary:#D84A43;--border:#4D1716;
      --primary:#FF514A;--primary-pressed:#D83B36;--on-primary:#000000;--accent-cyan:#B83A35;
      --accent-violet:#C4403A;--accent-warm:#D94842;--success:#D84A43;--warning:#F05A52;

    html[data-mode="observation"] *{transition:none!important;animation:none!important;filter:none!important;text-shadow:none!important}
    *{box-sizing:border-box}

    html[data-scale="large"]{font-size:118%}
    body{margin:0;min-width:0;background:var(--canvas);transition:background 240ms cubic-bezier(.2,.8,.2,1),color 240ms}

    .review{max-width:1280px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) clamp(12px,3vw,28px) calc(env(safe-area-inset-bottom) + 24px)}

    h1,h2,h3,h4,p{margin-top:0}.artifact-head h1{font-size:clamp(1.6rem,3.6vw,2.7rem);line-height:1.12;margin:12px 0 8px}.artifact-head p{margin:0;color:var(--text-secondary);line-height:1.55;max-width:70ch}

    .nav-row{display:grid;grid-template-columns:44px minmax(0,1fr) 88px;align-items:center;gap:4px;min-height:50px}

    .head-actions{display:flex}.favorite.pressing{background:color-mix(in srgb,var(--primary) 12%,var(--surface));transform:scale(.985)}.favorite.selected svg{fill:var(--primary);stroke:var(--primary)}

    .segments{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--border);z-index:3;padding:0 8px}
    .segments::-webkit-scrollbar{display:none}.segment{flex:1 0 auto;min-width:72px;border:0;background:transparent;cursor:pointer;position:relative;color:var(--text-secondary);font-weight:600}
    .segment[aria-selected="true"]{color:var(--text-primary);font-weight:800}.segment[aria-selected="true"]::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
    .content-scroll{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:14px 14px 100px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
    #segmentContent,.stack,.card{min-width:0;max-width:100%}.stack{display:grid;gap:12px}.card{padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow)}
    .card.flat{box-shadow:none;background:var(--surface-subtle)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.card-head h3{font-size:.9rem;margin:0}.card-head p{font-size:.68rem;color:var(--text-secondary);margin:3px 0 0;line-height:1.4}
    .link-button{border:0;background:transparent;color:var(--primary);padding:8px 7px;min-height:var(--hit);min-width:var(--hit);cursor:pointer;font-weight:700;line-height:1.35}

    .decision-copy strong{display:block;font-size:1.35rem;line-height:1.2}.decision-copy span{display:block;color:var(--text-secondary);font-size:.72rem;margin-top:4px}.best-window{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:14px 0;padding:12px;border-radius:var(--radius-sm);background:var(--surface-subtle)}
    .best-window small{color:var(--text-secondary)}.best-window b{font-size:1.1rem;font-variant-numeric:tabular-nums}.best-window .quality{font-size:.68rem;padding:4px 7px;border:1px solid var(--primary);border-radius:99px}
    .reason-list{display:grid;gap:8px}.reason{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.76rem;line-height:1.5}.reason i{width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;font-style:normal;font-size:.68rem}
    .hard-block{margin-top:12px;padding:10px;border:2px solid var(--danger);border-radius:var(--radius-sm);background:var(--surface-subtle);font-size:.74rem;line-height:1.5}.hard-block b{display:block}
    .source-line{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:.68rem;color:var(--text-secondary)}
    .context-card{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.context-card b{display:block;font-size:.83rem}.context-card span{font-size:.68rem;color:var(--text-secondary)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.metric{min-width:0;padding:10px 8px;background:var(--surface-subtle);border-radius:var(--radius-sm)}.metric small{display:block;color:var(--text-secondary);font-size:.62rem;line-height:1.3}.metric b{display:block;font-size:.86rem;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.metric b span{font-size:.65rem;font-weight:500;margin-left:2px}
    .route-note{font-size:.74rem;line-height:1.55;color:var(--text-secondary);margin:12px 0 0}.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.button{flex:1 1 120px;min-height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:9px 12px;cursor:pointer;font-weight:650}.button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}.button.danger{border-color:var(--danger);color:var(--text-primary)}.button:disabled{background:var(--surface-subtle);color:var(--text-tertiary);box-shadow:none;cursor:not-allowed}
    .facility-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.facility{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-subtle)}.facility i{width:22px;height:22px;border-radius:7px;border:1px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:.68rem;font-weight:800}.facility b{display:block;font-size:.75rem}.facility span{display:block;color:var(--text-secondary);font-size:.64rem;line-height:1.35;margin-top:2px}
    .media{position:relative;min-height:150px;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-subtle);display:grid;place-items:center}.media img{width:100%;height:170px;display:block;object-fit:cover;filter:none!important}.media .media-label{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);padding:7px 9px;border-radius:var(--radius-xs);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-size:.67rem;font-weight:700}.media-empty{padding:28px;text-align:center;color:var(--text-secondary);font-size:.75rem;line-height:1.6}
    .representative-gallery{display:grid;width:100%;max-width:100%;min-width:0;grid-auto-flow:column;grid-auto-columns:minmax(236px,86%);gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 8px;margin-top:10px}.representative-gallery::-webkit-scrollbar{display:none}.photo-card{scroll-snap-align:start;min-width:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-subtle)}.photo-card button{width:100%;min-height:170px;padding:0;border:0;background:transparent;display:block;text-align:left}.photo-card img{width:100%;height:170px;display:block;object-fit:cover;filter:none!important}.photo-credit{padding:9px 10px;font-size:.65rem;line-height:1.5;color:var(--text-secondary)}.photo-credit b{display:block;color:var(--text-primary);font-size:.69rem;margin-bottom:2px}.media-boundary{margin-top:8px;padding:9px 10px;border:1px dashed var(--border);border-radius:var(--radius-sm);font-size:.66rem;line-height:1.5;color:var(--text-secondary)}
    .row-list{display:grid;margin-top:10px}.data-row{display:grid;grid-template-columns:minmax(104px,.7fr) minmax(0,1.3fr);gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:.75rem;line-height:1.5}.data-row:first-child{border-top:0}.data-row>span{color:var(--text-secondary)}.data-row b{font-weight:650}.data-row small{display:block;color:var(--text-tertiary)}
    .provenance{display:inline-flex;align-items:center;gap:5px;font-size:.64rem;padding:4px 7px;border:1px solid var(--border);border-radius:99px;background:var(--surface-subtle)}
    .guide{display:grid;gap:8px}.guide h4{font-size:.84rem;margin:0}.guide p{font-size:.72rem;color:var(--text-secondary);line-height:1.55;margin:0}.guide footer{display:flex;justify-content:space-between;gap:8px;align-items:center}.guide-media{min-height:112px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-subtle)}.guide-media img{width:100%;height:112px;object-fit:cover;display:block;filter:none!important}.guide-media .media-empty{min-height:112px;display:grid;place-items:center;padding:16px}.guide-media-credit{padding:7px 9px;border-top:1px solid var(--border);font-size:.61rem;line-height:1.4;color:var(--text-secondary)}
    .recommended-list{display:grid;gap:8px;margin-top:10px}.recommended-target{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:9px;align-items:center;min-height:64px;padding:9px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-subtle)}.recommended-target>span:first-child{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--primary);border-radius:11px;font-weight:850}.recommended-target b{display:block;font-size:.75rem}.recommended-target small{display:block;color:var(--text-secondary);font-size:.63rem;line-height:1.4;margin-top:2px}.recommended-target .link-button{white-space:nowrap}
    .bottom-action{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:var(--surface);border-top:1px solid var(--border)}
    .bottom-action .button{width:100%;min-height:48px}
    .loading-state,.error-state{min-height:280px;display:grid;place-items:center;text-align:center;padding:24px}.state-inner{max-width:260px}.state-inner h3{font-size:.95rem}.state-inner p{font-size:.75rem;line-height:1.6;color:var(--text-secondary)}
    .skeleton{height:14px;border-radius:7px;background:var(--surface-subtle);border:1px solid var(--border);margin:9px 0}.skeleton:nth-child(2){width:72%}.skeleton:nth-child(3){height:88px}
    .sheet-overlay{position:absolute;inset:0;z-index:20;display:none;background:color-mix(in srgb,var(--canvas) 76%,transparent);align-items:end}.sheet-overlay.open{display:flex}.sheet{width:100%;max-height:86%;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:8px 14px calc(env(safe-area-inset-bottom) + 16px);box-shadow:var(--shadow);animation:sheet-in 220ms cubic-bezier(.2,.8,.2,1)}
    .handle{width:42px;height:4px;background:var(--border);border-radius:4px;margin:2px auto 10px}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.sheet-head h3{font-size:1rem;margin:2px 0 4px}.sheet-head p{font-size:.68rem;line-height:1.45;color:var(--text-secondary);margin:0}.sheet-body{margin-top:12px}.sheet-warning{padding:11px;border:2px solid var(--warning);border-radius:var(--radius-sm);background:var(--surface-subtle);font-size:.72rem;line-height:1.5;margin-bottom:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid label{font-size:.68rem;color:var(--text-secondary)}.form-grid input{width:100%;min-height:44px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:0 9px;margin-top:4px}
    .gallery{display:grid;grid-template-columns:1fr;gap:10px}.gallery .media{min-height:150px}.gallery .media img{height:180px}
    .toast{position:absolute;z-index:30;left:50%;bottom:84px;max-width:calc(100% - 28px);transform:translateX(-50%) translateY(12px);padding:9px 12px;border-radius:var(--radius-sm);background:var(--text-primary);color:var(--surface);font-size:.7rem;line-height:1.4;opacity:0;pointer-events:none;transition:opacity 160ms,transform 160ms}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @keyframes sheet-in{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
    html[data-motion="reduced"] *,html[data-motion="reduced"] *::before,html[data-motion="reduced"] *::after{animation:none!important;transition-duration:.08s!important;transform:none!important}
    html[data-mode="observation"] .media,html[data-mode="observation"] .photo-card,html[data-mode="observation"] .guide-media{box-shadow:none}html[data-mode="observation"] .sheet-overlay{background:color-mix(in srgb,var(--canvas) 88%,transparent)}
    @media(max-width:860px){.workspace{grid-template-columns:1fr}.review-rail{position:static;max-height:none}.stage{padding:10px}.phone{height:780px;max-height:none}.artifact-head{display:block}.artifact-head p{margin-bottom:12px}}
    @media(max-width:430px){.review{padding-inline:8px}.workspace{gap:12px}.stage{padding:0;border:0;border-radius:0;background:transparent}.phone{border-radius:22px}.rail-grid{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}.metric{display:flex;justify-content:space-between;gap:10px;align-items:center}.metric b{margin:0}.data-row{grid-template-columns:1fr;gap:3px}.facility-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.artifact-head h1{font-size:1.55rem}.recommended-target{grid-template-columns:36px minmax(0,1fr)}.recommended-target .link-button{grid-column:2}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"><defs>

  <main class="review" data-od-id="spot-detail-prototype">
    <header class="artifact-head"><div><span class="candidate">设计候选 · 示例数据 · 未选定</span><h1>Spot 详情家族交互原型</h1><p>同一“示例·海湾观星点”贯穿概览、攻略、场地与夜空；概览先呈现有来源的 CC0 星空实拍代表媒体，所有夜空能力都由当前 spot_id 的详情上下文拥有。</p></div></header>

    <section class="workspace">
      <aside class="review-rail" data-od-id="prototype-review-controls" aria-label="原型审阅控制">
        <header class="rail-head"><h2>检查场景</h2><p>控件只属于审阅资源，不属于小程序产品界面。</p></header>

    function decisionCard(){const d=decisions[effectiveDecision()],f=currentFresh();return `<article class="card decision-card" data-od-id="tonight-decision"><div class="decision-top"><span class="decision-symbol" aria-hidden="true">${d.symbol}</span><div class="decision-copy"><strong>${d.label}</strong><span>${state.hardBlock?'硬安全阻断优先于任何评分':d.quality}</span></div></div><div class="best-window"><span><small>预计较合适窗口</small><b>${d.window}</b></span><span class="quality">${f[0]}</span></div><div class="reason-list">${d.reason.map((r,i)=>`<div class="reason"><i>${i+1}</i><span>${r}</span></div>`).join('')}</div>${state.hardBlock?`<div class="hard-block"><b>安全阻断 · 暂不建议出发</b>示例：进入山区道路的关闭信息尚未解除。即使云量改善，也不能覆盖这一阻断。</div>`:''}<div class="source-line"><span>${f[2]} · ${f[1]}</span><button class="link-button" data-sheet="source">查看来源</button></div></article>`}

    function routeCard(){const r=routeCases[state.route];const disabled=!r.nav||state.coordinate==='restricted'||state.coordinate==='hidden'||state.lifecycle!=='published';return `<article class="card" data-od-id="route-summary"><div class="card-head"><div><h3>${r.title}</h3><p>外部导航交接 · 不提供小程序内逐向导航</p></div><button class="link-button" data-sheet="route">详情</button></div><div class="metrics"><div class="metric"><small>驾车距离</small><b>${r.distance}<span>${r.unit}</span></b></div><div class="metric"><small>预计用时</small><b>${r.time}</b></div><div class="metric"><small>坐标</small><b>${coordinateLabel()}</b></div></div><p class="route-note">${r.note}</p><div class="action-row"><button class="button" data-sheet="external" ${disabled?'disabled':''}>选择外部地图</button></div></article>`}

    function facilities(){return `<article class="card" data-od-id="facility-summary"><div class="card-head"><div><h3>核心设施</h3><p>状态使用符号与文字，不只靠颜色</p></div><button class="link-button" data-sheet="route">全部</button></div><div class="facility-grid"><div class="facility"><i>✓</i><div><b>停车 · 有</b><span>示例：约 12 个车位，容量待核</span></div></div><div class="facility"><i>季</i><div><b>厕所 · 季节开放</b><span>冬季可能关闭，出发前确认</span></div></div><div class="facility"><i>?</i><div><b>充电 · 未知</b><span>未提供可靠资料，不能当作无</span></div></div><div class="facility"><i>×</i><div><b>露营 · 不可</b><span>候选示例规则，不代表真实政策</span></div></div></div></article>`}
    function mediaCard(){let body;if(state.media==='real')body=`<div class="representative-gallery" aria-label="三张可横向浏览的实拍代表媒体">${photos.map(photoCard).join('')}</div><div class="media-boundary"><b>照片像素边界：</b>三张照片保留真实摄影像素；日间、夜间与观测红只改变其周围受控 UI，不对照片应用整屏滤镜，也不把它们声明为该观星点现场。</div>`;if(state.media==='pending')body='<div class="media media-empty"><b>实拍待补 · 审核中</b><br>位置、作者与许可尚未核验；不使用生成图、渐变或占位冒充摄影像素。</div>';if(state.media==='error')body='<div class="media media-empty"><b>代表媒体不可用</b><br>下载或解码没有通过验证；场地事实与安全信息仍可查看，可在图库中重试。</div>';if(state.media==='empty')body='<div class="media media-empty"><b>暂无可核验实拍</b><br>不影响查看路线、设施与来源状态，也不会制造替代照片。</div>';return `<article class="card" data-od-id="representative-media"><div class="card-head"><div><h3>代表媒体图库</h3><p>概览首项 · 来源、摄影者、许可与“非本点位现场”持续可见</p></div><button class="link-button" data-sheet="photos">查看大图</button></div>${body}</article>`}
    function overview(){return `<div class="stack">${mediaCard()}${contextCard()}${decisionCard()}${routeCard()}${facilities()}<article class="card guide">${guideMedia(photos[0])}<span class="provenance">官方示例 · 未实地核验</span><h4>第一次到场：先看末段道路与风口</h4><p>摘要只给准备方向；完整文章持续显示来源、更新时间与相关 Spot。配图仅为 CC0 星空代表媒体，不是攻略现场图。</p><footer><span class="source-line" style="border:0;margin:0;padding:0">示例作者 · 08-05 更新</span><button class="link-button" data-sheet="article">阅读全文</button></footer></article></div>`}
    function field(){return `<div class="stack"><article class="card"><div class="card-head"><div><h3>到达与最后道路</h3><p>${state.staticFieldVersion} · 日期时间变化不会重载</p></div><span class="provenance">示例资料</span></div><div class="row-list"><div class="data-row"><span>到达方式</span><b>驾车至安全区域，末段步行约 8 分钟</b></div><div class="data-row"><span>最后道路</span><b>约 1.2 km 窄路<small>雨雪后状态未知；不把未知写成畅通</small></b></div><div class="data-row"><span>公共交通</span><b>资料不足<small>仍可从地图手动选择其他区域</small></b></div><div class="data-row"><span>坐标可见性</span><b>${coordinateLabel()}<small>${state.coordinate==='restricted'||state.coordinate==='hidden'?'不向外部地图发送精确目标':'目的地仍需出发前核对'}</small></b></div></div></article><article class="card"><div class="card-head"><div><h3>停车与停留</h3><p>容量、过夜与季节限制分开表达</p></div></div><div class="row-list"><div class="data-row"><span>停车位置</span><b>示例：距观测区步行约 8 分钟</b></div><div class="data-row"><span>容量</span><b>约 12 辆 · 估算<small>准确容量待现场核验</small></b></div><div class="data-row"><span>过夜 / 露营</span><b>露营不可；停留规则待确认</b></div></div></article>${facilities()}<article class="card"><div class="card-head"><div><h3>观测环境</h3><p>估算与算法待确认，不伪装精确</p></div></div><div class="row-list"><div class="data-row"><span>海拔</span><b>约 860 <small>m · 示例估算</small></b></div><div class="data-row"><span>遮挡</span><b>遮挡面积 30% 以下 · 候选标签<small>百分比算法与方向关系待确认</small></b></div><div class="data-row"><span>光害方向</span><b>西边无光害 · 候选标签<small>数据来源与方向参考系待确认</small></b></div><div class="data-row"><span>地面与风口</span><b>硬地为主 · 西北侧可能迎风</b></div></div></article><article class="card"><div class="card-head"><div><h3>安全与限制</h3><p>硬阻断位置稳定且不煽情</p></div></div><div class="row-list"><div class="data-row"><span>道路 / 天气</span><b>雨雪后末段状态未知；阵风增强时不建议停留</b></div><div class="data-row"><span>地形</span><b>远离临水和边坡区域，照明关闭前确认退路</b></div><div class="data-row"><span>开放状态</span><b>${lifecycleLabel()}<small>关闭/暂停时不提供导航</small></b></div></div></article></div>`}
    function recommendedTargets(){const items=[['猎户座','估算 · 入门识别','时段与方向仍需按当前 spot_id 计算','查看'],['木星','计算示例 · 行星','仅展示计算结果姿态，不声称今晚可见','查看'],['金星','不可用 · 行星','当前上下文无有效结果，不显示替代窗口','说明'],['流星雨','数据不足 · 事件型','事件目录与可见性结果暂不可用','说明'],['双星伴月','估算 · 天象','日期匹配仍待计算，不声称事件发生','查看']];return `<article class="card" data-od-id="tonight-recommended-targets"><div class="card-head"><div><h3>今晚推荐观测目标</h3><p>候选示例 · 由 spot_demo_01 + 当地日期 / 时间 + timezone 派生，不保证任意时地可见</p></div><span class="provenance">${currentFresh()[0]}</span></div><div class="recommended-list">${items.map((x,i)=>`<div class="recommended-target"><span>${i===2||i===3?'?':'✦'}</span><span><b>${x[0]} · ${x[1]}</b><small>${x[2]}</small></span><button class="link-button target-detail" data-target-name="${x[0]}">${x[3]}</button></div>`).join('')}</div></article>`}
    function sky(){const d=decisions[effectiveDecision()];return `<div class="stack">${contextCard()}${recommendedTargets()}<article class="card"><div class="card-head"><div><h3>这个观星点的夜空</h3><p>只由当前详情与必需的 spot_id 拥有</p></div><span class="provenance">${currentFresh()[0]}</span></div><div class="best-window"><span><small>今晚结论 · ${d.label}</small><b>${d.window}</b></span><span class="quality">示例</span></div><div class="row-list"><div class="data-row"><span>云与风</span><b>预计 21:20 后云量间歇下降<small>非实时预报，不保证可见</small></b></div><div class="data-row"><span>月光与暗夜</span><b>月光影响可能较低<small>具体时刻由共享上下文计算</small></b></div><div class="data-row"><span>目标方向</span><b>银河中心 · 西南方向示例<small>不提供未经验证的精确角度</small></b></div></div><div class="action-row"><button class="button" id="openNightFromSegment">打开夜空专业数据</button></div></article><article class="card flat"><b style="font-size:.78rem">详情夜空上下文保持</b><p class="route-note">spot_demo_01 · ${state.context.date} ${state.context.time} · ${state.context.timezone} · 银河中心。专业数据、目标、简化天图与观测红由 APP-03 的“观星点详情 &gt; 夜空”聚焦资源拥有；返回恢复本分段、滚动、日期时间与目标。</p></article></div>`}
    function guides(){return `<div class="stack"><article class="card guide">${guideMedia(photos[1])}<span class="provenance">官方示例 · 平台标注</span><h4>如何确认最后道路仍可安全通行</h4><p>出发前检查天气、关闭信息与最后更新时间；缓存路线不等于现场道路已核验。配图为非本点位的 CC0 代表媒体。</p><footer><span class="source-line" style="border:0;margin:0;padding:0">08-05 更新 · 未实地核验</span><button class="link-button" data-sheet="article">阅读全文</button></footer></article><article class="card guide">${guideMedia(photos[2])}<span class="provenance">认证作者示例 · 身份待核</span><h4>西北风下的设备与站位准备</h4><p>作者经验仅作攻略参考，不能覆盖实时天气、官方关闭或安全阻断。配图不是本文现场图。</p><footer><span class="source-line" style="border:0;margin:0;padding:0">08-04 更新 · 示例</span><button class="link-button" data-sheet="article">预览</button></footer></article><article class="card guide"><div class="guide-media"><div class="media-empty"><b>攻略图片不可用</b><br>没有通过来源与许可核验的图片；保留稳定图片区域，不用渐变或生成图替代。</div></div><span class="provenance">普通用户建议 · 审核中</span><h4>厕所季节开放情况待补充</h4><p>尚未发布为事实；Demo 仅展示私下建议进入审核，不自动公开。</p><footer><span class="source-line" style="border:0;margin:0;padding:0">提交时间 08-06 · 示例</span><button class="link-button" data-sheet="source">查看状态</button></footer></article><article class="card flat"><b style="font-size:.78rem">商业增强边界</b><p class="route-note">用户攻略、现场报告、照片和纠错需要身份、来源、权利、审核与下架/申诉状态；Demo 以官方或白名单内容为主。</p></article></div>`}
    function lifecycleLabel(){return {published:'已发布 · 可查看',suspended:'暂停开放 · 不提供导航',closed:'临时关闭 · 不提供导航'}[state.lifecycle]}
    function renderLifecycle(){let html='';if(state.lifecycle==='suspended')html='<div class="status-banner warning"><span>△</span><span><strong>暂停开放</strong>静态资料仍可查看；请等待状态复核，不提供外部导航。</span></div>';if(state.lifecycle==='closed')html='<div class="status-banner danger"><span>!</span><span><strong>临时关闭</strong>关闭信息优先于今晚结论；不发送目的地。</span></div>';if(state.coordinate==='restricted'&&state.lifecycle==='published')html='<div class="status-banner warning"><span>◇</span><span><strong>位置受限</strong>仅展示安全区域，不提供精确坐标。</span></div>';$('#lifecycleBanner').innerHTML=html;$('#addressLine').textContent=`${coordinateLabel()} · 试行区域 · 非真实地点`}

    function bindDynamic(){$$('#segmentContent [data-sheet]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.sheet,b)));$$('#segmentContent [data-photo]').forEach(b=>b.addEventListener('click',()=>openSheet('photos',b)));$$('#segmentContent .target-detail').forEach(b=>b.addEventListener('click',()=>{log(`查看候选目标：${b.dataset.targetName}；保持 spot_demo_01 与日期时间`);openNight()}));$('#openNightFromSegment')?.addEventListener('click',openNight)}
    function switchSegment(next){if(next===state.active)return;state.scroll[state.active]=$('#contentScroll').scrollTop;state.active=next;$$('.segment').forEach(b=>b.setAttribute('aria-selected',b.dataset.segment===next?'true':'false'));if(!state.loaded[next]){renderLoading();const delay=state.reduced?0:280;setTimeout(()=>{state.loaded[next]=true;if(state.failSegment===next)state.errors[next]=true;log(`${segmentName(next)}首次加载${state.errors[next]?'失败，可独立重试':'完成'}；其他分段未重置`);renderActive()},delay)}else{renderActive();log(`切换到${segmentName(next)}；恢复滚动 ${state.scroll[next]||0}px`)}}
    function renderLoading(){$('#segmentContent').innerHTML='<div class="loading-state"><div class="state-inner"><h3>正在载入本段</h3><p>只请求当前分段，兄弟内容和 Spot 头部保持稳定。</p><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>'}
    function openNight(){log(`打开观星点详情 > 夜空：spot_demo_01 · ${state.context.date} ${state.context.time} · 银河中心`);toast('已保持 spot_id、日期、时间与目标；返回仍在本详情夜空分段')}
    function openSheet(type,trigger){const alreadyOpen=$('#sheetOverlay').classList.contains('open');if(!alreadyOpen)state.lastFocus=trigger||document.activeElement;const title=$('#sheetTitle'),sub=$('#sheetSubtitle'),body=$('#sheetBody');
      if(type==='context'){title.textContent='选择日期与时间';sub.textContent='只刷新今晚与夜空动态内容；场地静态资料不重载。';body.innerHTML=`<div class="form-grid"><label>当地日期<input id="contextDate" type="date" value="${state.context.date}"></label><label>当地时间<input id="contextTime" type="time" value="${state.context.time}"></label></div><p class="route-note">时区：${state.context.timezone}。跨午夜归属由同一 SkyContext 负责。</p><div class="action-row"><button class="button primary" id="applyContext">应用到动态内容</button></div>`}

      if(type==='route'){const r=routeCases[state.route];title.textContent='路线与场地详情';sub.textContent='只做出发前证据与外部目的地检查。';body.innerHTML=`<div class="status-banner"><span>↗</span><span><strong>${r.title}</strong>${r.note}</span></div><div class="row-list"><div class="data-row"><span>最后道路</span><b>约 1.2 km 窄路 · 状态待出发前复核</b></div><div class="data-row"><span>停车</span><b>有停车 · 容量估算</b></div><div class="data-row"><span>设施</span><b>有厕所（季节） · 充电未知 · 不能露营</b></div><div class="data-row"><span>地图筛选上下文</span><b>光害等级 · 4级以下；遮挡面积 30% 以下；西边无光害；驾车时间 · 2小时内；驾车直达；不要登山；2000米以下；有停车；有厕所<small>算法、阈值边界与来源仍待确认</small></b></div></div><div class="action-row"><button class="button" data-next-sheet="external" ${!r.nav?'disabled':''}>选择外部地图</button></div>`}
      if(type==='photos'){title.textContent='实拍代表媒体图库';sub.textContent='真实摄影像素 · 非本点位现场；来源、摄影者与 CC0 许可持续可见。';body.innerHTML=`<div class="gallery">${photos.map(photoCard).join('')}</div><div class="media-boundary"><b>观测模式边界：</b>照片内容不属于可控调色板，因此保持原始摄影像素；其周围控件仍严格使用黑 / 暖红，不应用整屏滤镜伪改照片。</div><div class="media media-empty" style="margin-top:10px"><b>本点位现场照片仍不可用</b><br>这三张仅用于证明真实摄影媒体、署名和许可布局，不能称为该点位实景。</div>`}
      if(type==='article'){title.textContent='攻略文章预览';sub.textContent='完整内容由文章页拥有，返回时恢复攻略阅读位置。';body.innerHTML=`<span class="provenance">官方示例 · 未实地核验</span><h3 style="margin-top:12px">第一次到场：先确认末段道路与风口</h3><p class="route-note">先在有照明的安全区域确认停车、退路与关闭信息，再移动到观测位置。缓存路线与用户经验都不能替代现场安全判断。</p><div class="row-list"><div class="data-row"><span>作者 / 来源</span><b>示例编辑部 · 官方内容示例</b></div><div class="data-row"><span>更新 / 关联</span><b>2026-08-05 · 示例·海湾观星点</b></div><div class="data-row"><span>验证</span><b>未实地核验 · 不代表真实地点</b></div></div>`}
      if(type==='external'){const blocked=state.lifecycle!=='published'||state.coordinate==='restricted'||state.coordinate==='hidden'||!routeCases[state.route].nav;title.textContent='选择外部地图';sub.textContent=`目标：${coordinateLabel()} · 示例·海湾观星点`;body.innerHTML=`${state.mode==='observation'?'<div class="sheet-warning"><b>即将离开观测红界面</b><br>系统或第三方地图可能显示明亮、非红色界面。可以取消并留在当前页面。</div>':''}${blocked?`<div class="status-banner danger"><span>!</span><span><strong>当前不发送目的地</strong>${lifecycleLabel()}；坐标为${coordinateLabel()}；路线为${routeCases[state.route].title}。</span></div>`:`<div class="row-list"><button class="button vendor-button">腾讯地图 · 可用性待确认</button><button class="button vendor-button">高德地图 · 可用性待确认</button><button class="button vendor-button">系统地图 · 可用性待确认</button></div><p class="route-note">本原型不会启动网络或真实地图；供应商授权、可用性与目的地格式均待运行时确认。</p>`}`}
      $('#sheetOverlay').classList.add('open');$('#sheetOverlay').setAttribute('aria-hidden','false');$('#closeSheet').focus();bindSheet(type);log(`${alreadyOpen?'切换到':'打开'} ${title.textContent} Sheet；${alreadyOpen?'保留原返回焦点':'焦点进入弹层'}`)
    }
    function bindSheet(type){$('#applyContext')?.addEventListener('click',()=>{const date=$('#contextDate').value,time=$('#contextTime').value;if(!date||!time){toast('请选择完整的当地日期和时间');return}state.context={...state.context,date,time};$('#statusTime').textContent=time;closeSheet();renderActive();setTimeout(()=>$('#segmentContent [data-sheet="context"]')?.focus(),0);log(`SkyContext 更新为 ${date} ${time}；${state.staticFieldVersion} 保持`);toast('动态内容已刷新；场地静态资料未重载')});$$('[data-next-sheet]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.nextSheet,b)));$$('.vendor-button').forEach(b=>b.addEventListener('click',()=>{log(`${b.textContent}：仅演示交接，不发起网络请求`);toast('演示：未启动外部地图')}))}
    function closeSheet(){$('#sheetOverlay').classList.remove('open');$('#sheetOverlay').setAttribute('aria-hidden','true');log('关闭 Sheet；焦点返回触发器');state.lastFocus?.focus()}
    function commitFavorite(){const previous=state.favorite;state.favorite=!state.favorite;updateFavorite();log(`收藏乐观提交：${state.favorite?'已收藏':'未收藏'}`);toast(state.favorite?'已收藏 · 正在同步':'已取消收藏 · 正在同步');if(state.nextFavFail){state.nextFavFail=false;$('#favoriteFailure').setAttribute('aria-pressed','false');$('#favoriteFailure').textContent='下次收藏提交失败：关';setTimeout(()=>{state.favorite=previous;updateFavorite();log('收藏同步失败：已回滚到原状态');toast('同步失败，已恢复原收藏状态')},state.reduced?0:650)}}
    function updateFavorite(){const b=$('#favoriteButton');b.classList.toggle('selected',state.favorite);b.setAttribute('aria-pressed',String(state.favorite));b.setAttribute('aria-label',`${state.favorite?'取消收藏':'收藏'}示例·海湾观星点，当前${state.favorite?'已收藏':'未收藏'}`)}
    function syncControlsAndRender(){renderActive()}
    function init(){
      $$('.mode-btn').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.modeChoice;document.documentElement.dataset.mode=state.mode;$$('.mode-btn').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));log(`模式切换到${b.textContent}；Spot/SkyContext 保持`);renderActive()}));
      $$('.width-btn').forEach(b=>b.addEventListener('click',()=>{state.width=Number(b.dataset.width);document.documentElement.style.setProperty('--phone-width',`${state.width}px`);$$('.width-btn').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));log(`审阅宽度 ${state.width} CSS px`)}));
      $('#largeToggle').addEventListener('click',e=>{state.large=!state.large;document.documentElement.dataset.scale=state.large?'large':'default';e.currentTarget.setAttribute('aria-pressed',state.large);e.currentTarget.textContent=`大字：${state.large?'开':'关'}`;log(`大字${state.large?'开启':'关闭'}；标签与操作重排`)});
      $('#motionToggle').addEventListener('click',e=>{state.reduced=!state.reduced;document.documentElement.dataset.motion=state.reduced?'reduced':'full';e.currentTarget.setAttribute('aria-pressed',state.reduced);e.currentTarget.textContent=`减少动态：${state.reduced?'开':'关'}`;log(`减少动态${state.reduced?'开启：0–100ms 淡变':'关闭'}`)});
      $('#decisionSelect').addEventListener('change',e=>{state.decision=e.target.value;renderActive();log(`今晚结论场景：${decisions[state.decision].label}`)});
      $('#blockToggle').addEventListener('click',e=>{state.hardBlock=!state.hardBlock;e.currentTarget.setAttribute('aria-pressed',state.hardBlock);e.currentTarget.textContent=`硬安全阻断：${state.hardBlock?'开':'关'}`;renderActive();log(`硬安全阻断${state.hardBlock?'启用，覆盖评分':'关闭'}`)});
      $('#lifecycleSelect').addEventListener('change',e=>{state.lifecycle=e.target.value;renderActive();log(`点位状态：${lifecycleLabel()}`)});
      $('#coordinateSelect').addEventListener('change',e=>{state.coordinate=e.target.value;renderActive();log(`坐标可见性：${coordinateLabel()}`)});
      $('#freshnessSelect').addEventListener('change',e=>{state.freshness=e.target.value;renderActive();log(`新鲜度：${currentFresh()[0]}${state.freshness==='expired'?'；推荐自动失效':''}`)});
      $('#routeSelect').addEventListener('change',e=>{state.route=e.target.value;renderActive();log(`路线场景：${routeCases[state.route].title}`)});
      $('#mediaSelect').addEventListener('change',e=>{state.media=e.target.value;renderActive();log(`媒体场景：${e.target.options[e.target.selectedIndex].text}`)});
      $('#failSegmentSelect').addEventListener('change',e=>{state.failSegment=e.target.value;if(state.failSegment!=='none'){state.loaded[state.failSegment]=false;state.errors[state.failSegment]=false}log(`独立失败目标：${state.failSegment==='none'?'无':segmentName(state.failSegment)}`)});
      $('#resetLoads').addEventListener('click',()=>{state.loaded={overview:true,field:false,sky:false,guides:false};state.errors={};state.scroll={overview:0,field:0,sky:0,guides:0};if(state.active!=='overview'){state.active='overview';$$('.segment').forEach(b=>b.setAttribute('aria-selected',b.dataset.segment==='overview'?'true':'false'))}renderActive();log('分段首次加载与滚动已重置')});
      $('#favoriteFailure').addEventListener('click',e=>{state.nextFavFail=!state.nextFavFail;e.currentTarget.setAttribute('aria-pressed',state.nextFavFail);e.currentTarget.textContent=`下次收藏提交失败：${state.nextFavFail?'开':'关'}`});
      $$('.segment').forEach(b=>b.addEventListener('click',()=>switchSegment(b.dataset.segment)));
      const fav=$('#favoriteButton');fav.addEventListener('pointerdown',()=>{fav.classList.add('pressing');log('收藏 touch-down：仅反馈，尚未提交')});fav.addEventListener('pointerleave',()=>{if(fav.classList.contains('pressing')){fav.classList.remove('pressing');log('收藏 drag-away：取消，不提交')}});fav.addEventListener('pointercancel',()=>{fav.classList.remove('pressing');log('收藏 pointer-cancel：不提交')});fav.addEventListener('pointerup',()=>{if(!fav.classList.contains('pressing'))return;fav.classList.remove('pressing');state.pointerCommitted=true;commitFavorite()});fav.addEventListener('click',e=>{if(state.pointerCommitted){state.pointerCommitted=false;return}if(e.detail===0)commitFavorite()});
      $('#headerRoute').addEventListener('click',e=>openSheet('external',e.currentTarget));$('#nightAction').addEventListener('click',openNight);$('#backButton').addEventListener('click',()=>{log('返回地图：恢复中心、缩放、已提交筛选、图层与选点卡');toast('已描述返回恢复；本原型不复制地图页')});
      $('#closeSheet').addEventListener('click',closeSheet);$('#sheetOverlay').addEventListener('click',e=>{if(e.target===$('#sheetOverlay'))closeSheet()});
      $('#sheet').addEventListener('keydown',e=>{if(e.key==='Tab'){const f=$$('#sheet button:not(:disabled),#sheet input:not(:disabled)');if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
      addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetOverlay').classList.contains('open'))closeSheet()});
      $('#contentScroll').addEventListener('scroll',()=>{state.scroll[state.active]=$('#contentScroll').scrollTop},{passive:true});
      updateFavorite();renderActive();log('原型就绪 · 概览首屏已加载');
    }
    init();
  })();
  </script>
</body>
</html>
