<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观星计划 · 当前设计资源</title><style>body{background:#edf0f3;color:#405664;font:14px/1.7 system-ui;margin:0}main{display:flex;gap:24px;padding:24px;justify-content:center}aside{max-width:320px}iframe{width:390px;height:844px;border:0;flex:none}button,select{min-height:44px;font:inherit;margin:3px}h1{font-size:20px}@media(max-width:760px){main{flex-direction:column;align-items:center}iframe{max-width:100%}}</style><main><aside><h1>计划 · 到达与提醒</h1><p><strong>第二轮修订：</strong>清单改为固定方框与居中SVG勾，整行点击、长文字换行不挤压图标。</p><p>待审、未采用。路线耗时130分钟为交互样例；样例时钟2026-09-10 16:00，来源/更新时间无真实服务。本资源不发送通知。</p><label>宽度 <select id="width"><option >320</option><option >375</option><option selected>390</option><option >430</option></select></label><br><button data-src="?id=p1">详情</button><button data-src="?view=edit&id=p1">编辑</button><button data-src="?view=edit&id=future&scenario=unknown">远期无天气</button><button data-src="">全部计划</button><br><label>路线 <select id="quality"><option value="ready">可靠估计</option><option value="unknown">未获取</option><option value="stale">已过期</option></select></label><br><label>首组通知 <select id="delivery"><option value="ungranted">未授权</option><option value="scheduled">待发送</option><option value="unknown">结果待确认</option><option value="failed">明确失败</option><option value="expired">过时跳过</option></select></label><p>选择不同状态后，清单仍可独立勾选；未知结果不提供盲目重发。修改出发时间可查看迟到提示变化，保存不以天气或路线成功为前提。</p><p>候选待用户审查，未采用。<a href="README.md">来源与验证</a> · <a href="my-return.html">我的往返</a></p></aside><iframe title="计划候选" src="preview/index.html?id=p1"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>f.src='preview/index.html'+b.dataset.src);document.querySelector('#width').onchange=e=>f.style.width=e.target.value+'px';for(const [id,type]of [['quality','plan-review-route'],['delivery','plan-review-reminder']])document.querySelector('#'+id).onchange=e=>f.contentWindow.postMessage({type,value:e.target.value},location.origin);</script></html>
