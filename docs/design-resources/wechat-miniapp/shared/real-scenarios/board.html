<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Starward · 当前场景总览</title><style>*{box-sizing:border-box}body{margin:0;width:1040px;padding:28px 30px;background:#eef0f3;color:#2d2d2d;font:13px/1.6 "Microsoft YaHei",sans-serif}h1{font-size:24px;line-height:34px;margin:0 0 5px}p{margin:0;color:#626b77;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,220px);gap:24px 26px;margin-top:24px}.scene h2{font-size:12px;line-height:18px;font-weight:500;height:42px;margin:0 0 8px}.phone{width:219px;height:473px;background:#fff;overflow:hidden;box-shadow:0 4px 16px #2638490b;border:1px solid #dde1e6;border-radius:4px}iframe{width:390px;height:844px;display:block;transform:scale(.56);transform-origin:top left;border:0}.legend{margin-top:22px;font-size:12px;color:#66717e}</style></head><body><h1 id="title"></h1><p>原完整组件 + 已认可新增场景 · 云观星内部排除 · 生产未修改</p><p>单屏390×844；缩图不替代完整滚动源。数据、平台授权与终态均为设计示意。</p><div class="grid" id="grid"></div><p class="legend">唯一当前场景入口：real-scenarios/review.html。原照片/设施卡、筛选、玻璃计划卡、完整表单、清单、票面及操作直接复用现行宿主。</p><script type="module">
import {groups,scenes} from './catalogue.mjs';import {hostFor} from './host.mjs';const key=new URLSearchParams(location.search).get('group')||'09';document.querySelector('#title').textContent=key+' · '+groups.find(g=>g[0]===key)[1];
const entries=scenes.filter(s=>s[1]===key).map(s=>({id:s[0],label:s[2],section:['09B','09C'].includes(s[0])?'气象条件':s[0].startsWith('09E-')?'近期天气':''}));if(key==='09'){entries.splice(1,0,{id:'09A',label:'天气完整指标与来源',section:'气象条件'},{id:'09A',label:'空气质量分时与年度夜光',section:'空气质量'});entries.splice(entries.findIndex(s=>s.id==='09E')+1,0,{id:'09E',label:'原设施卡与近期天气',section:'近期天气'});}
const page=new URLSearchParams(location.search).get('page'),shown=page===null?entries:entries.slice(Number(page)*4,Number(page)*4+4);
for(const row of shown){const section=document.createElement('section');section.className='scene';const h=document.createElement('h2');h.textContent=row.id+' · '+row.label;const phone=document.createElement('div');phone.className='phone';const frame=document.createElement('iframe');frame.title=h.textContent;frame.src=hostFor(row.id,new URLSearchParams({capture:'1',...(row.section?{section:row.section}:{})}));phone.append(frame);section.append(h,phone);document.querySelector('#grid').append(section);}document.body.dataset.group=key;document.body.dataset.pages=String(Math.ceil(entries.length/4));document.body.dataset.boardFrames=String(entries.length);
</script></body></html>
