<svg xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 18"><title>加载中三点图形候选</title><style>.dot{fill:currentColor;animation:pulse 1s ease-in-out infinite}.second{animation-delay:.16s}.third{animation-delay:.32s}@keyframes pulse{0%,65%,100%{opacity:.22;transform:translateY(0)}32%{opacity:1;transform:translateY(-2px)}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}</style><circle class="dot" cx="5" cy="9" r="2"/><circle class="dot second" cx="12" cy="9" r="2"/><circle class="dot third" cx="19" cy="9" r="2"/></svg>
