<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starward · 当前完整场景资源</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#2d2d2d;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;height:100vh;overflow:hidden}aside{width:284px;background:#fff;padding:22px;overflow:auto;flex-shrink:0}h1{font-size:20px;margin:0 0 10px}aside h2{font-size:14px;color:#687b8a;margin:20px 0 8px}aside p{font-size:12px;color:#6c7d89}aside button{border:0;background:none;display:block;text-align:left;width:100%;padding:10px 8px;border-radius:10px;font:inherit;font-size:13px;color:#374758;cursor:pointer}aside button[aria-current=true]{background:#eaf0f6;font-weight:600}main{padding:24px;flex:1;overflow:auto;text-align:center}main header{display:flex;align-items:center;gap:20px;text-align:left;margin-bottom:10px}main header h2{flex:1;font-size:19px;margin:0}main header a{background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;color:#506778;text-decoration:none}main p{font-size:12px;color:#6b7e8d;margin:6px 0 16px}iframe{width:390px;height:844px;border:0;background:#fff;box-shadow:0 8px 25px #2638480e;display:block;margin:0 auto}#caption{max-width:620px;margin:16px auto}footer{max-width:620px;margin:20px auto;font-size:12px;color:#7a8897}@media(max-width:750px){aside{width:230px}main{padding:16px}}</style></head><body><aside><h1>非云观星完整设计</h1><p>当前资源 · 原组件完整保留<br>新增场景接入相同宿主 · 生产未修改</p><nav id="scenes"></nav><h2>现行完整页面</h2><nav id="references"></nav></aside><main><header><h2 id="title"></h2><a id="open" target="_blank">单独打开</a></header><p>同一组件直接复用现行完整源。数据与操作终态为设计示意。</p><iframe id="screen" title="完整设计预览"></iframe><p id="caption"></p><footer>云观星内部排除。Web设计资源与静态总览不证明微信登录、定位、通知、文件、好友或真实数据功能。原Goal全部未完成义务保留。</footer></main><script type="module">
import {groups,scenes} from './catalogue.mjs';
const references=(await fetch('./normal-references.json',{cache:'no-store'}).then(r=>r.json())).items,frame=document.querySelector('#screen');
function show(row,normal=false){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===row[0])));document.querySelector('#title').textContent=row[2];const url=normal?row[3]:'index.html?scene='+encodeURIComponent(row[0]);frame.src=url;document.querySelector('#open').href=url;document.querySelector('#caption').textContent=normal?row[4]:'完整页面沿原组件渲染；本轮新增状态只出现在相应内容槽。';history.replaceState(null,'','#'+row[0]);}
for(const [group,label] of groups){const h=document.createElement('h2');h.textContent=group+' · '+label;document.querySelector('#scenes').append(h);for(const row of scenes.filter(s=>s[1]===group)){const b=document.createElement('button');b.textContent=row[0]+' '+row[2];b.dataset.id=row[0];b.onclick=()=>show(row);document.querySelector('#scenes').append(b);}}
for(const item of references){const b=document.createElement('button');b.textContent=item.label;b.dataset.id=item.id;b.onclick=()=>show([item.id,item.group,item.label,item.url,item.caption],true);document.querySelector('#references').append(b);}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;if(e.data?.type==='design-scene-current'){const row=scenes.find(s=>s[0]===e.data.id);if(row){document.querySelector('#title').textContent=row[2];document.querySelector('#open').href='index.html?scene='+encodeURIComponent(row[0]);}}});const start=scenes.find(s=>s[0]===location.hash.slice(1))||scenes.find(s=>s[0]==='09E');show(start);
</script></body></html>
