<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公共液态玻璃 · 材质测试</title><link rel="stylesheet" href="material.css"><style>body{margin:0;background:#e9edf0;color:#273846;font:14px/1.7 system-ui}main{max-width:1000px;margin:24px auto;padding:0 20px}h1{font-size:20px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{min-height:44px;padding:0 14px;border:1px solid #c9d3dc;border-radius:6px;background:white;color:#345}.samples{display:flex;gap:20px;flex-wrap:wrap}.stage{position:relative;width:360px;height:420px;overflow:hidden;border-radius:10px}.background{position:absolute;inset:-80px;background:repeating-linear-gradient(90deg,transparent 0 27px,#417c984d 27px 29px),repeating-linear-gradient(0deg,transparent 0 27px,#417c984d 27px 29px),linear-gradient(115deg,#c7e5f1 10%,#f5cece 45%,#f5e8aa 75%);transition:transform .7s}.dark .background{background:repeating-linear-gradient(90deg,transparent 0 27px,#93b7d88c 27px 29px),repeating-linear-gradient(0deg,transparent 0 27px,#93b7d88c 27px 29px),linear-gradient(115deg,#123853,#5d3152,#173d3b)}.background p{position:absolute;top:240px;left:105px;font-size:24px;font-weight:600;color:#335a6e}.dark .background p{color:#aad4df}.pane{position:absolute;left:34px;top:75px;width:292px;height:260px;border-radius:24px;box-sizing:border-box;padding:20px}.pane h2{font-size:16px}.dark .pane{color:#e3edf7}.pane p{font-size:12px;max-width:200px;margin-top:100px}.stage[data-moved=true] .background{transform:translate(47px,23px)}@media(max-width:400px){.stage{width:100%}.pane{left:24px;width:calc(100% - 48px)}}@media(prefers-reduced-motion:reduce){.background{transition:none}}</style><main><h1>公共液态玻璃 · 曲面候选</h1><p><a href="../../../sky/candidates/context-audit-2026-09-09/review.html?v=6">云观星实际页面</a> · <a href="../../../my/candidates/context-audit-2026-09-09/review.html?v=6">我的实际页面</a> · <a href="../before-feedback-06/review.html">上一版材质对照</a></p><p>第六轮：中心透光，曲面边缘折射，定向细高光。移动背后的网格，观察线条在边缘的弯折；“仅透光”关闭位移，便于对照。真实星空稀疏、My背景柔和时，效果自然更轻。测试图形仅用于材质核验，不属于星空数据或产品背景。</p><div class="controls"><button id="move">移动背景</button><button data-mode="refractive">透光＋折射</button><button data-mode="translucent">仅透光（对照）</button><button data-mode="solid">不透明降级</button></div><div class="samples"><div class="stage"><div class="background"><p>背景光线</p></div><section class="pane" id="light"><h2>我的 · 计划卡材质</h2><p>内容保持清晰，背景透过主体，边缘产生折射。</p></section></div><div class="stage dark"><div class="background"><p>背景光线</p></div><section class="pane" id="dark"><h2>云观星 · 弹窗材质</h2><p>共用同一材质，只切换明暗主题。</p></section></div></div><p><a href="README.md">实现边界与调研来源</a></p></main><script type="module">import{mountLiquidGlass}from'./material.mjs';const surfaces=[mountLiquidGlass(document.querySelector('#light')),mountLiquidGlass(document.querySelector('#dark'),{theme:'dark'})];document.querySelector('#move').onclick=()=>document.querySelectorAll('.stage').forEach(e=>e.dataset.moved=String(e.dataset.moved!=='true'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>surfaces.forEach(s=>s.setMode(b.dataset.mode)));addEventListener('pagehide',()=>surfaces.forEach(s=>s.destroy()),{once:true});</script></html>
