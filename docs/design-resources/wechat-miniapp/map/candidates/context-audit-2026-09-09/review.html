<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图身份与返回 · 当前设计资源</title><style>body{margin:0;background:#eef1f3;color:#425767;font:14px/1.7 system-ui}main{display:flex;justify-content:center;gap:24px;padding:24px}aside{max-width:320px}iframe{width:390px;height:844px;border:0;flex:none}button,select{font:inherit;min-height:44px;margin:3px}output{display:block;white-space:pre-wrap;font-size:12px}h1{font-size:20px}@media(max-width:760px){main{flex-direction:column;align-items:center}iframe{max-width:100%}}</style><main><aside><h1>地图 · 身份与恢复</h1><p><strong>第三轮修订：</strong>无顶部图片时大尺寸也保留顶部两角；圆角外像素不再穿透为地图关闭。保留此前无闪烁替换与小档下拖不关闭。此项是当前采用几何在用户明确范围内的本地候选修正，沿用既有 Stitch 构图。</p><p><strong>第二轮修订：</strong>小档下拖不动不关闭，上拖展开；中档可滚动；首次打开与切换待内容准备后显示；大档顶部消除可误触地图缝隙。</p><p>设计演示，未采用。内存样例不连接远端草稿/审核服务；发布按钮仅模拟服务回执。天空采用固定演示坐标，非真实地图定位。</p><label>宽度 <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select></label><p><button data-action="draft">我的草稿</button><button data-action="pending">审核中提案</button><button data-action="formal">正式点与我的反馈</button><button data-action="new">新建</button><button data-action="layer">打开图层</button><button data-action="layer-close">关闭图层</button><button data-action="switch">尝试切换地点</button><button data-action="approve">模拟审核通过</button><button data-action="fail">下一次写入失败</button><button data-action="publish">模拟发布新点</button><button data-action="merge">模拟合并正式点</button></p><button onclick="location.reload()">重置演示</button><p>切换目标前确认未保存修改；继续编辑应保留表单、照片、候选点和地图状态。发布/合并后重复回执不产生重复标记。</p><output id="state"></output><p><a href="README.md">来源与审查范围</a> · <a href="verification.md">验证记录</a></p></aside><iframe id="map" title="地图候选" src="preview/index.html?map=1"></iframe></main><script>const f=document.querySelector('#map');document.querySelector('#width').onchange=e=>f.style.width=e.target.value+'px';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>f.contentWindow.postMessage({mapReview:b.dataset.action},location.origin));addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==f.contentWindow)return;document.querySelector('#state').textContent=JSON.stringify(e.data,null,2);if(e.data?.type==='map-review-layer'){document.querySelector('#state').textContent+='\n图层采用资源在独立预览，关闭恢复地图。';}});</script></html>
