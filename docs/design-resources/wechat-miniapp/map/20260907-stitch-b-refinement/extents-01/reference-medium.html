<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=390, height=844, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>地图页 · 原 B 尺度与纯图标导航 · 技术整理预览</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
    body { width: 390px; height: 844px; margin: 0; padding: 0; overflow: hidden; background: #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .status-bar-time { font-feature-settings: "tnum"; }
  /* Codex: transparent hit extensions; visible geometry stays unchanged. */
button[aria-label="导航"] {position:relative;}
button[aria-label="导航"]::after {content:"";position:absolute;width:44px;height:44px;left:50%;top:50%;transform:translate(-50%,-50%);}
.map-tool {position:relative;pointer-events:auto;}
.map-tool::after {content:"";position:absolute;width:44px;height:44px;left:50%;top:50%;transform:translate(-50%,-50%);}
.search-entry {position:relative;cursor:pointer;}
.search-entry::after {content:"";position:absolute;width:100%;height:44px;left:0;top:50%;transform:translateY(-50%);}
</style>
</head>
<body class="relative w-[390px] h-[844px] overflow-hidden select-none bg-slate-200 flex flex-col justify-between text-slate-900">
<!-- 1. 底层高保真OSM地图背景（复用原始素材IMAGE_1） -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<img alt="地图背景" class="w-[390px] h-auto object-cover object-top -translate-y-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlqn7EIqJCkTpAEXS1LuST1RNCY69sGZ_uM4PwbZ5ndOe5W7ckv65nCSdf--9Cq-dQ6k-IDpr9OD2cD9qLqI1Q5oQ-Cj-cHJwBRtcU3ulVGoMT5PpBThl32xqbBR43mDamm1YlesQRBT4Yy4JVA3GBy0t3f5_yIyH6ZnvC72Sh5G2bw-DGIJlAMTmKmd98Q_mbSOEX1vvVoBZPCYUAMhFAJ1NwyHfZCBBn8csqlzjB_3F256qG1VyUKPu5_u5wxWbN"/>
<!-- 静态地图参考点标；地理准确性未验证 -->
<div class="absolute left-[184px] top-[328px] -translate-x-1/2 -translate-y-full flex flex-col items-center">
<div class="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center ring-2 ring-white shadow-md">
<svg class="w-3.5 h-3.5 text-amber-300" fill="currentColor" viewbox="0 0 24 24"><path d="M12 2l2.4 7.4h7.6l-6.1 4.5 2.3 7.1-6.2-4.6-6.2 4.6 2.3-7.1-6.1-4.5h7.6z"></path></svg>
</div>
<div class="w-1.5 h-1.5 bg-slate-900 rotate-45 -mt-0.5 ring-1 ring-white"></div>
</div>
<!-- OSM版权说明 -->
<div class="absolute left-3 top-[374px] z-10 bg-white/90 backdrop-blur-xs px-2 py-0.5 rounded text-[10px] text-slate-500 border border-slate-200/50">
      © OpenStreetMap 贡献者
    </div>
<!-- 极简圆圈式地图工具组 -->
<div class="absolute right-3 top-[268px] flex flex-col gap-2 z-10">
<button aria-label="定位" class="map-tool w-9 h-9 bg-white/95 rounded-full shadow-sm border border-slate-200 flex items-center justify-center text-slate-700">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414M16.95 16.95l1.414 1.414M7.05 7.05L5.636 5.636M12 8a4 4 0 100 8 4 4 0 000-8z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button aria-label="图层" class="map-tool w-9 h-9 bg-white/95 rounded-full shadow-sm border border-slate-200 flex items-center justify-center text-slate-700">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M12 2l9 4.9-9 4.9-9-4.9L12 2z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 11.9l9 4.9 9-4.9" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 16.9l9 4.9 9-4.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>
<!-- 2. 顶部原生状态栏与小程序导航栏 -->
<header class="relative z-20 w-full pt-3 pb-2 px-4 bg-gradient-to-b from-white/95 via-white/80 to-transparent">
<!-- iOS 状态栏 -->
<div class="flex items-center justify-between text-[14px] font-semibold text-slate-900 h-6 px-1">
<span class="status-bar-time">9:41</span>
<div class="flex items-center space-x-1.5">
<svg class="w-4 h-3.5" fill="currentColor" viewbox="0 0 17 11"><rect height="4" rx="0.5" width="2.5" x="0" y="7"></rect><rect height="6" rx="0.5" width="2.5" x="4" y="5"></rect><rect height="8.5" rx="0.5" width="2.5" x="8" y="2.5"></rect><rect height="11" rx="0.5" width="2.5" x="12" y="0"></rect></svg>
<svg class="w-3.5 h-3.5" fill="currentColor" viewbox="0 0 16 12"><path d="M8 3.6C5.5 3.6 3.2 4.6 1.6 6.3l1.4 1.4C4.2 6.5 6 5.8 8 5.8s3.8.7 5 1.9l1.4-1.4C12.8 4.6 10.5 3.6 8 3.6zM8 0C4.3 0 1 1.6 0 4.1l1.4 1.4C2.3 3.4 5 2.1 8 2.1s5.7 1.3 6.6 3.4L16 4.1C15 1.6 11.7 0 8 0zm0 7.3a2.7 2.7 0 0 0-2.7 2.7c0 1.5 1.2 2.7 2.7 2.7 1.5 0 2.7-1.2 2.7-2.7A2.7 2.7 0 0 0 8 7.3z"></path></svg>
<div class="w-5 h-2.5 rounded-[3px] border border-slate-900 p-0.5 flex items-center">
<div class="h-full w-3 bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- 小程序标题与微信胶囊 -->
<div class="flex items-center justify-between mt-1 h-10">
<h1 class="text-[17px] font-semibold tracking-tight text-slate-900">今晚去观星</h1>
<!-- 胶囊外壳 -->
<div class="flex items-center h-8 px-2.5 bg-white/90 rounded-full border border-slate-200/90 shadow-sm space-x-2.5">
<button class="w-4 h-4 flex items-center justify-center text-slate-800">
<span class="w-1 h-1 rounded-full bg-current mx-0.5"></span>
<span class="w-1 h-1 rounded-full bg-current mx-0.5"></span>
<span class="w-1 h-1 rounded-full bg-current mx-0.5"></span>
</button>
<div class="w-px h-3.5 bg-slate-200"></div>
<button class="w-4 h-4 flex items-center justify-center text-slate-800">
<div class="w-3.5 h-3.5 rounded-full border-2 border-current"></div>
</button>
</div>
</div>
<!-- 极简轻边框搜索框 -->
<div class="mt-2.5">
<div role="button" tabindex="0" aria-label="搜索观星点" class="search-entry h-9 px-3 bg-white/90 rounded-full border border-slate-200 shadow-xs flex items-center text-slate-400 space-x-2">
<svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span class="text-[13px] text-slate-400 font-normal">搜索观星点</span>
</div>
</div>
</header>
<!-- 3. 方向B：连通式底页抽屉（结构化标头、平铺信息律动、清晰段落感） -->
<main class="relative z-20 w-full bg-white rounded-t-[24px] shadow-[0_-10px_25px_rgba(0,0,0,0.06)] border-t border-slate-100 flex flex-col pt-2.5 pb-2 px-4 mt-auto">
<!-- 拖动手柄 (纯拖动语义) -->
<div class="w-full flex justify-center pb-2">
<div class="w-8 h-1 rounded-full bg-slate-300"></div>
</div>
<!-- 顶部点位基础信息 + 章节微导航 -->
<div class="pb-2.5 border-b border-slate-100">
<div class="flex items-baseline justify-between">
<h2 class="text-[18px] font-bold text-slate-900 tracking-tight">深圳市天文台</h2>
<span class="text-[12px] text-slate-500">深圳 · 大鹏</span>
</div>
<!-- 章节微导航：概览 / 天文 (靠左、轻量短下划线) -->
<div class="flex items-center space-x-5 mt-2">
<div class="relative pb-1 cursor-pointer">
<span class="text-[13px] font-semibold text-slate-900">概览</span>
<span class="absolute bottom-0 left-0 right-0 h-[2px] bg-slate-900 rounded-full"></span>
</div>
<div class="relative pb-1 cursor-pointer">
<span class="text-[13px] font-normal text-slate-400">天文</span>
</div>
</div>
</div>
<!-- 路线与到达 行式排布 -->
<div class="py-2.5 flex items-center justify-between border-b border-slate-100/80">
<div class="space-y-0.5">
<div class="text-[13px] font-semibold text-slate-800">路线与到达</div>
<div class="text-[12px] text-slate-400">距离、预计到达暂无数据</div>
</div>
<!-- 安静的右侧纯文本/微轮廓导航按钮 -->
<button aria-label="导航" class="w-8 h-8 rounded border border-slate-300 hover:bg-slate-50 active:bg-slate-100 text-slate-700 flex items-center justify-center transition-all shrink-0"><svg class="w-3.5 h-3.5 text-slate-600 -rotate-45" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24"><path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<!-- 现场保障状态列表（开放时间、停车、厕所）采用清晰的列表式排布 -->
<div class="py-2.5 space-y-2 border-b border-slate-100/80 text-[12px]"><div class="flex items-center justify-between text-slate-600"><div class="flex items-center space-x-2"><svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2" stroke-linecap="round"></path></svg><span class="text-slate-800 font-medium">开放时间</span></div><span class="text-slate-400">暂无数据</span></div><div class="flex items-center justify-between text-slate-600"><div class="flex items-center space-x-2"><svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 3C2.1 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg><span class="text-slate-800 font-medium">停车设施</span></div><span class="text-slate-400">暂无数据</span></div><div class="flex items-center justify-between text-slate-600"><div class="flex items-center space-x-2"><svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M7 4h10v10a5 5 0 01-10 0V4z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 19v2m4-2v2M5 21h14" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="text-slate-800 font-medium">洗手间</span></div><span class="text-slate-400">暂无数据</span></div></div>
<!-- 底部辅助文本链接（场地资料、数据来源、反馈纠错） -->
<div class="flex items-center justify-start space-x-4 py-2 text-[12px] text-slate-400">
<a class="hover:text-slate-700 transition-colors" href="#">场地资料</a>
<span class="w-1 h-1 rounded-full bg-slate-200"></span>
<a class="hover:text-slate-700 transition-colors" href="#">数据来源</a>
<span class="w-1 h-1 rounded-full bg-slate-200"></span>
<a class="hover:text-slate-700 transition-colors" href="#">反馈纠错</a>
</div>
<!-- 核心操作按键行（想去、分享、云观星），等高紧凑、层级鲜明 -->
<div class="grid grid-cols-3 gap-2.5 pt-1.5 pb-1">
<button class="h-10 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-800 text-[13px] font-medium flex items-center justify-center space-x-1.5 transition-colors">
<svg class="w-3.5 h-3.5 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
<span>想去</span>
</button>
<button class="h-10 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-800 text-[13px] font-medium flex items-center justify-center space-x-1.5 transition-colors">
<svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>分享</span>
</button>
<button class="h-10 rounded-lg bg-slate-900 hover:bg-slate-800 active:bg-black text-white text-[13px] font-medium flex items-center justify-center space-x-1.5 transition-colors">
<svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>云观星</span>
</button>
</div>
</main>
<!-- 4. 底部主导航（仅“地图”与“我的”，极简微交互）与 Home Indicator -->
<footer class="relative z-30 w-full bg-white border-t border-slate-100 flex flex-col items-center">
<div class="w-full h-12 flex items-center justify-around px-12">
<!-- 地图 (激活态，深色加粗无过重底色) -->
<button class="flex items-center space-x-1.5 text-slate-900 py-1 font-semibold text-[13px]">
<svg class="w-4 h-4 text-slate-900" fill="currentColor" viewbox="0 0 24 24"><path d="M15 5.1L9 3 3.3 4.9C2.5 5.2 2 5.9 2 6.8V19c0 1.3 1.2 2.3 2.5 1.9L9 19l6 2.1 5.7-1.9c.8-.3 1.3-1 1.3-1.9V6c0-1.3-1.2-2.3-2.5-1.9L15 5.1zM9 5.2l6 2.1v11.5l-6-2.1V5.2z"></path></svg>
<span>地图</span>
</button>
<!-- 我的 -->
<button class="flex items-center space-x-1.5 text-slate-400 hover:text-slate-700 py-1 font-normal text-[13px]">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
<span>我的</span>
</button>
</div>
<!-- iPhone 底部安全手势条 -->
<div class="w-full h-5 flex justify-center items-start pt-1">
<div class="w-32 h-1 bg-slate-900/70 rounded-full"></div>
</div>
</footer>
</body>
</html>
