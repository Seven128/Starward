<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地图 · 小档（沿用已采用B尺度）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body class="relative w-[390px] h-[844px] mx-auto bg-slate-100 overflow-hidden select-none flex flex-col justify-between">

  <!-- Map Background Layer (Exact OSM Image) -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <img 
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeFB9PEHQ-tqviv-C5voYrR8Bs-mDhkxGzASsmzjgmC1k1lYcyYDRQ0kLzoUIT2cQ478pWayaDclqfY--H4ajoK-eVMAoqjmjBOrzHEiPkdp5vi62kr6r7I4bI_cmcImx5c_paYnROqgNvsjUXu9JuHW_TG8I8fapW4dLcm9d_8q_bTWrZ8uYYfLnH9JwxtJ0BSrb0ix0N4Y1EO6_d1y7CLyoLefp1i-ghaUHP9ygKy5gcBUOJHzK78F5xYb2cFtOM" 
      alt="OpenStreetMap" 
      class="w-[390px] h-[480px] object-cover object-center absolute top-0 left-0"
    />
    <div class="w-[390px] h-[364px] absolute bottom-0 left-0 bg-[#b5d0d0]/40"></div>

    <!-- OSM Pin Point (Identical to adopted Screen 1) -->
    <div class="absolute top-[340px] left-[170px] -translate-x-1/2 -translate-y-1/2 z-10">
      <div class="relative flex items-center justify-center">
        <svg width="30" height="38" viewBox="0 0 30 38" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-md">
          <path d="M15 0C6.71573 0 0 6.71573 0 15C0 24.5 15 38 15 38C15 38 30 24.5 30 15C30 6.71573 23.2843 0 15 0Z" fill="#111827"/>
          <circle cx="15" cy="14" r="10" fill="#1F2937"/>
          <path d="M15 8.5L16.6 12.2L20.6 12.6L17.5 15.3L18.4 19.2L15 17.1L11.6 19.2L12.5 15.3L9.4 12.6L13.4 12.2L15 8.5Z" fill="#FBBF24"/>
        </svg>
      </div>
    </div>

    <!-- OSM Attribution (Single Line, bottom-left above drawer) -->
    <div class="absolute top-[516px] left-[12px] z-10">
      <span class="inline-block bg-white/80 backdrop-blur-[2px] px-2 py-0.5 rounded text-[10px] text-slate-500 tracking-tight border border-slate-200/50">
        © OpenStreetMap 贡献者
      </span>
    </div>
  </div>

  <!-- Top System Header + WeChat Capsule + Search Entrance -->
  <header class="relative z-20 w-full pt-[14px] px-4 pointer-events-auto">
    <!-- Status Bar -->
    <div class="flex justify-between items-center text-[14px] font-semibold text-slate-900 tracking-tight mb-2 px-1">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <svg class="w-4 h-3.5" viewBox="0 0 17 12" fill="currentColor">
          <path d="M1 9.5C0.447715 9.5 0 9.94772 0 10.5C0 11.0523 0.447715 11.5 1 11.5H2.5C3.05228 11.5 3.5 11.0523 3.5 10.5C3.5 9.94772 3.05228 9.5 2.5 9.5H1ZM5.5 7C4.94772 7 4.5 7.44772 4.5 8C4.5 8.55228 4.94772 9 5.5 9H7C7.55228 9 8 8.55228 8 8C8 7.44772 7.55228 7 7 7H5.5ZM10 4.5C9.44772 4.5 9 4.94772 9 5.5C9 6.05228 9.44772 6.5 10 6.5H11.5C12.0523 6.5 12.5 6.05228 12.5 5.5C12.5 4.94772 12.0523 4.5 11.5 4.5H10ZM14.5 2C13.9477 2 13.5 2.44772 13.5 3C13.5 3.55228 13.9477 4 14.5 4H16C16.5523 4 17 3.55228 17 3C17 2.44772 16.5523 2 16 2H14.5Z"/>
        </svg>
        <svg class="w-4 h-3.5" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 2.5C5.2 2.5 2.7 3.6 0.8 5.5L8 12L15.2 5.5C13.3 3.6 10.8 2.5 8 2.5Z"/>
        </svg>
        <svg class="w-6 h-3" viewBox="0 0 24 12" fill="currentColor">
          <rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2.5" y="2.5" width="13" height="7" rx="1.5" fill="currentColor"/>
          <path d="M22 4.5C22.6 4.8 23 5.3 23 6C23 6.7 22.6 7.2 22 7.5V4.5Z"/>
        </svg>
      </div>
    </div>

    <!-- Brand Title + WeChat Capsule Row -->
    <div class="flex justify-between items-center h-8 mb-2">
      <h1 class="text-[17px] font-bold text-slate-900 tracking-tight">今晚去观星</h1>
      
      <!-- WeChat Capsule (Exact 87x32 Pill) -->
      <div class="h-8 w-[87px] bg-white/85 backdrop-blur-md rounded-full border border-slate-300/60 flex items-center justify-evenly px-1 shadow-sm">
        <button class="w-6 h-6 flex items-center justify-center text-slate-800" aria-label="小程序更多">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="2"/>
            <circle cx="12" cy="12" r="2"/>
            <circle cx="19" cy="12" r="2"/>
          </svg>
        </button>
        <div class="w-[1px] h-3.5 bg-slate-300"></div>
        <button class="w-6 h-6 flex items-center justify-center text-slate-800" aria-label="关闭">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Input (Exact 36px visible height, 13px text, no clear X) -->
    <div class="relative flex items-center py-1">
      <div class="w-full h-9 bg-white/95 backdrop-blur-md rounded-full border border-slate-200/80 shadow-sm flex items-center px-3.5 gap-2">
        <svg class="w-4 h-4 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21L16.65 16.65"/>
        </svg>
        <span class="text-[13px] text-slate-400 font-normal">搜索观星点</span>
      </div>
    </div>
  </header>

  <!-- Right Floating Map Tools (Exact 36px White Circle, 16px fine line SVG, 44px hit-target) -->
  <div class="absolute top-[302px] right-3 z-20 flex flex-col gap-3 pointer-events-auto">
    <!-- Center / Crosshair Location Tool -->
    <div class="w-11 h-11 flex items-center justify-center">
      <button class="w-9 h-9 bg-white rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-slate-100 flex items-center justify-center text-slate-700 active:bg-slate-50 transition-colors" aria-label="当前定位">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
    </div>

    <!-- Layers Tool -->
    <div class="w-11 h-11 flex items-center justify-center">
      <button class="w-9 h-9 bg-white rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-slate-100 flex items-center justify-center text-slate-700 active:bg-slate-50 transition-colors" aria-label="切换图层">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Drawer: Small Stage (小档，连贯贴底抽屉，压缩文档视口，露出地点身份与章节定位，不被切半文字，保留底部操作与主导航) -->
  <div class="relative z-30 w-full bg-white rounded-t-[24px] shadow-[0_-4px_24px_rgba(0,0,0,0.06)] border-t border-slate-100/80 flex flex-col justify-between overflow-hidden">
    
    <!-- Drag Handle Area (Drag only, 44px touch area) -->
    <div class="w-full h-5 flex items-center justify-center cursor-grab active:cursor-grabbing">
      <div class="w-10 h-1 bg-slate-300/80 rounded-full"></div>
    </div>

    <!-- Document Content Viewport (Small Stage: Cleanly exposes identity and chapter links, avoids half-cut text) -->
    <div class="px-5 pt-0.5 pb-2">
      <!-- Title & Region -->
      <div class="flex items-baseline justify-between mb-2.5">
        <h2 class="text-[18px] font-bold text-slate-900 tracking-tight">深圳市天文台</h2>
        <span class="text-[12px] text-slate-500 tracking-normal">深圳 · 大鹏</span>
      </div>

      <!-- Chapter Navigation Links (Same Document Positioning: 概览 / 天文, 13px text with active underline) -->
      <div class="flex items-center gap-5">
        <div class="relative pb-1.5 cursor-pointer">
          <span class="text-[13px] font-bold text-slate-900">概览</span>
          <div class="absolute bottom-0 left-0 w-6 h-[2px] bg-slate-900 rounded-full"></div>
        </div>
        <div class="relative pb-1.5 cursor-pointer">
          <span class="text-[13px] font-normal text-slate-400">天文</span>
        </div>
      </div>
    </div>

    <!-- Action Bar (想去 / 分享 / 云观星: Exact 40px height, 13px text, identical to adopted Screen 1) -->
    <div class="px-4 py-2 border-t border-slate-100/70 grid grid-cols-3 gap-2.5 bg-white">
      <!-- 想去 -->
      <button class="h-10 rounded-xl border border-slate-200/90 bg-white flex items-center justify-center gap-1.5 text-slate-700 active:bg-slate-50 transition-colors" aria-label="想去">
        <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span class="text-[13px] font-medium tracking-tight">想去</span>
      </button>

      <!-- 分享 -->
      <button class="h-10 rounded-xl border border-slate-200/90 bg-white flex items-center justify-center gap-1.5 text-slate-700 active:bg-slate-50 transition-colors" aria-label="分享">
        <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span class="text-[13px] font-medium tracking-tight">分享</span>
      </button>

      <!-- 云观星 -->
      <button class="h-10 rounded-xl bg-[#0f172a] flex items-center justify-center gap-1.5 text-white shadow-sm active:bg-slate-800 transition-colors" aria-label="云观星">
        <svg class="w-4 h-4 text-slate-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="12" r="3"/>
          <path d="M2 12C2 12 5 5 12 5C19 5 22 12 22 12C22 12 19 19 12 19C5 19 2 12 2 12Z"/>
        </svg>
        <span class="text-[13px] font-medium tracking-tight">云观星</span>
      </button>
    </div>

    <!-- Main Navigation Bar (地图 / 我的: Preserved at very bottom, 12px text) -->
    <nav class="w-full h-[52px] bg-white border-t border-slate-100 flex items-center justify-around px-8 shrink-0">
      <!-- 地图 (Active) -->
      <button class="flex items-center gap-2 text-slate-900 font-medium py-1 px-3" aria-label="地图主页">
        <svg class="w-[18px] h-[18px] text-slate-900" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <span class="text-[13px] tracking-tight">地图</span>
      </button>

      <!-- 我的 (Inactive) -->
      <button class="flex items-center gap-2 text-slate-400 font-normal py-1 px-3" aria-label="我的">
        <svg class="w-[18px] h-[18px] text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="text-[13px] tracking-tight">我的</span>
      </button>
    </nav>

    <!-- iOS Bottom Home Indicator Bar -->
    <div class="w-full h-[18px] bg-white flex items-center justify-center pb-1">
      <div class="w-[134px] h-[5px] bg-slate-900/90 rounded-full"></div>
    </div>
  </div>

</body>
</html>
