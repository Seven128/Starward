<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地图 · 大档（沿用已采用B尺度）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    /* Hide scrollbars while keeping smooth scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="relative w-[390px] h-[844px] mx-auto bg-white overflow-hidden select-none flex flex-col justify-between">

  <!-- Top System Header + WeChat Capsule Row (Page-like Top with straight edges, avoiding native capsule) -->
  <header class="relative z-40 w-full pt-[14px] px-4 bg-white border-b border-slate-100/80 shrink-0">
    <!-- Status Bar -->
    <div class="flex justify-between items-center text-[14px] font-semibold text-slate-900 tracking-tight mb-2 px-1">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <svg class="w-4 h-3.5" viewBox="0 0 17 12" fill="currentColor">
          <path d="M1 9.5C0.447715 9.5 0 9.94772 0 10.5C0 11.0523 0.447715 11.5 1 11.5H2.5C3.05228 11.5 3.5 11.0523 3.5 10.5C3.5 9.94772 3.05228 9.5 2.5 9.5H1ZM5.5 7C4.94772 7 4.5 7.44772 4.5 8C4.5 8.55228 4.94772 9 5.5 9H7C7.55228 9 8 8.55228 8 8C8 7.44772 7.55228 7 7 7H5.5ZM10 4.5C9.44772 4.5 9 4.94772 9 5.5C9 6.05228 9.44772 6.5 10 6.5H11.5C12.0523 6.5 12.5 6.05228 12.5 5.5C12.5 4.94772 12.0523 4.5 11.5 4.5H10ZM14.5 2C13.9477 2 13.5 2.44772 13.5 3C13.5 3.55228 13.9477 4 14.5 4H16C16.5523 4 17 3.55228 17 3C17 2.44772 16.5523 2 16 2H14.5Z"/>
        </svg>
        <svg class="w-4 h-3.5" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 2.5C5.2 2.5 2.7 3.6 0.8 5.5L8 12L15.2 5.5C13.3 3.6 10.8 2.5 8 2.5Z"/>
        </svg>
        <svg class="w-6 h-3" viewBox="0 0 24 12" fill="currentColor">
          <rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2.5" y="2.5" width="13" height="7" rx="1.5" fill="currentColor"/>
          <path d="M22 4.5C22.6 4.8 23 5.3 23 6C23 6.7 22.6 7.2 22 7.5V4.5Z"/>
        </svg>
      </div>
    </div>

    <!-- Brand / Return Bar + WeChat Capsule -->
    <div class="flex justify-between items-center h-8 mb-2">
      <!-- Title & Return Semantic Indicator -->
      <div class="flex items-center gap-1.5">
        <h1 class="text-[17px] font-bold text-slate-900 tracking-tight">今晚去观星</h1>
      </div>
      
      <!-- WeChat Capsule (Exact 87x32 Pill) -->
      <div class="h-8 w-[87px] bg-white rounded-full border border-slate-300/80 flex items-center justify-evenly px-1 shadow-sm">
        <button class="w-6 h-6 flex items-center justify-center text-slate-800" aria-label="小程序更多">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="2"/>
            <circle cx="12" cy="12" r="2"/>
            <circle cx="19" cy="12" r="2"/>
          </svg>
        </button>
        <div class="w-[1px] h-3.5 bg-slate-300"></div>
        <button class="w-6 h-6 flex items-center justify-center text-slate-800" aria-label="关闭">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Drag Handle Area (Page-like straight top with persistent drag handle, drag-only) -->
    <div class="w-full h-4 flex items-center justify-center cursor-grab pb-1">
      <div class="w-10 h-1 bg-slate-300/80 rounded-full"></div>
    </div>
  </header>

  <!-- Complete Scrollable Document Body (Large Stage: Scroll Owner with Sticky Chapter Anchor) -->
  <main class="relative z-20 flex-1 overflow-y-auto no-scrollbar bg-white">
    
    <!-- Section 1: Location Identity (18px title, 12px region) -->
    <div class="px-5 pt-3 pb-2">
      <div class="flex items-baseline justify-between mb-1">
        <h2 class="text-[18px] font-bold text-slate-900 tracking-tight">深圳市天文台</h2>
        <span class="text-[12px] text-slate-500 tracking-normal">深圳 · 大鹏</span>
      </div>
    </div>

    <!-- Sticky Chapter Navigation in Scroll Container (Sticky Top 0 in Main) -->
    <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm px-5 border-b border-slate-100 flex items-center gap-6 py-2">
      <div class="relative pb-1 cursor-pointer">
        <span class="text-[13px] font-bold text-slate-900">概览</span>
        <div class="absolute bottom-0 left-0 w-6 h-[2px] bg-slate-900 rounded-full"></div>
      </div>
      <div class="relative pb-1 cursor-pointer">
        <span class="text-[13px] font-normal text-slate-400">天文</span>
      </div>
    </div>

    <!-- Document Body Content: Preserved Order and Scale -->
    <div class="px-5 py-3 space-y-4">
      
      <!-- Route and Quiet Arrow Navigation (Exact row structure from B) -->
      <div class="flex items-center justify-between py-1 border-b border-slate-50">
        <div>
          <div class="text-[13px] font-bold text-slate-900 leading-tight">路线与到达</div>
          <div class="text-[12px] text-slate-400 mt-1">距离、预计到达暂无数据</div>
        </div>
        <div class="w-11 h-11 flex items-center justify-center shrink-0">
          <button class="w-8 h-8 rounded-lg border border-slate-200/90 flex items-center justify-center text-slate-700 active:bg-slate-50 transition-colors" aria-label="导航">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Objective Ground Facts (Exact identical 3-row layout, 12px, 暂无数据) -->
      <div class="space-y-2.5 py-1 text-[12px]">
        <div class="flex items-center justify-between text-slate-600">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            开放时间
          </span>
          <span class="text-slate-400">暂无数据</span>
        </div>
        <div class="flex items-center justify-between text-slate-600">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            停车设施
          </span>
          <span class="text-slate-400">暂无数据</span>
        </div>
        <div class="flex items-center justify-between text-slate-600">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M12 2a4 4 0 0 0-4 4v12a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"/>
              <path d="M6 10h12"/>
            </svg>
            洗手间
          </span>
          <span class="text-slate-400">暂无数据</span>
        </div>
      </div>

      <!-- Secondary Data Links (场地资料 / 数据来源 / 反馈纠错, Exact row from B) -->
      <div class="flex items-center justify-between text-[11px] text-slate-400 py-1.5 border-t border-b border-slate-100">
        <span class="cursor-pointer hover:text-slate-600">场地资料</span>
        <span class="text-slate-200">·</span>
        <span class="cursor-pointer hover:text-slate-600">数据来源</span>
        <span class="text-slate-200">·</span>
        <span class="cursor-pointer hover:text-slate-600">反馈纠错</span>
      </div>

      <!-- Section 2: Astronomical Information (天文章节内容，同一文档垂直衔接，无卡片墙，严格事实呈现) -->
      <div class="pt-2 pb-6 space-y-4">
        
        <!-- Astronomical Section Header -->
        <div class="flex items-center justify-between">
          <h3 class="text-[13px] font-bold text-slate-900 tracking-tight flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
            天文与气象条件
          </h3>
          <span class="text-[11px] text-slate-400 font-normal">基于测站与客观模型</span>
        </div>

        <!-- Arc Time Ruler (No cards, no left/right arrows, arc time track, disabled/no-data state) -->
        <div class="relative py-2 px-1">
          <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1.5">
            <span>今晚时间轴</span>
            <span>切片暂无数据</span>
          </div>
          <!-- Arc Track Indicator -->
          <div class="relative w-full h-8 flex items-center justify-center">
            <svg class="w-full h-7" viewBox="0 0 350 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 24C80 8 270 8 345 24" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
              <!-- Disabled Time Nodes -->
              <circle cx="25" cy="21" r="3" fill="#cbd5e1"/>
              <circle cx="105" cy="13" r="3" fill="#cbd5e1"/>
              <circle cx="175" cy="11" r="3.5" fill="#94a3b8"/>
              <circle cx="245" cy="13" r="3" fill="#cbd5e1"/>
              <circle cx="325" cy="21" r="3" fill="#cbd5e1"/>
            </svg>
          </div>
          <div class="flex justify-between text-[10px] text-slate-400 px-2 mt-0.5">
            <span>19:00</span>
            <span>21:00</span>
            <span>00:00</span>
            <span>03:00</span>
            <span>05:30</span>
          </div>
        </div>

        <!-- Objective Weather & Astronomical Facts (Shared row / aligned columns, no fabricated numbers) -->
        <div class="space-y-2 text-[12px] pt-1">
          <div class="flex items-center justify-between text-slate-600 border-b border-slate-50 pb-2">
            <span class="text-slate-500">总云量</span>
            <span class="text-slate-400">暂无数据</span>
          </div>
          <div class="flex items-center justify-between text-slate-600 border-b border-slate-50 pb-2">
            <span class="text-slate-500">大气透明度</span>
            <span class="text-slate-400">暂无数据</span>
          </div>
          <div class="flex items-center justify-between text-slate-600 border-b border-slate-50 pb-2">
            <span class="text-slate-500">大气视宁度</span>
            <span class="text-slate-400">暂无数据</span>
          </div>
          <div class="flex items-center justify-between text-slate-600 border-b border-slate-50 pb-2">
            <span class="text-slate-500">光污染等级 (Bortle)</span>
            <span class="text-slate-400">暂无数据</span>
          </div>
          <div class="flex items-center justify-between text-slate-600 pb-1">
            <span class="text-slate-500">月升月落与月相</span>
            <span class="text-slate-400">暂无数据</span>
          </div>
        </div>

        <!-- Observable Targets & Data Sources (No fake windows/dates, strict truth) -->
        <div class="pt-2 border-t border-slate-100/80 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-medium text-slate-700">推荐可观测天体</span>
            <span class="text-[11px] text-slate-400">暂无数据</span>
          </div>
          <p class="text-[11px] text-slate-400 leading-relaxed">
            实时星空与气象数值需依托气象站与天文模型回传，未获取真实切片前不提供推算建议。
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Persistent Bottom Action Bar (想去 / 分享 / 云观星: Fixed above main nav, identical to Screen 1) -->
  <div class="relative z-30 w-full px-4 py-2 border-t border-slate-100 bg-white/98 backdrop-blur-md shrink-0">
    <div class="grid grid-cols-3 gap-2.5">
      <!-- 想去 -->
      <button class="h-10 rounded-xl border border-slate-200/90 bg-white flex items-center justify-center gap-1.5 text-slate-700 active:bg-slate-50 transition-colors" aria-label="想去">
        <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span class="text-[13px] font-medium tracking-tight">想去</span>
      </button>

      <!-- 分享 -->
      <button class="h-10 rounded-xl border border-slate-200/90 bg-white flex items-center justify-center gap-1.5 text-slate-700 active:bg-slate-50 transition-colors" aria-label="分享">
        <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span class="text-[13px] font-medium tracking-tight">分享</span>
      </button>

      <!-- 云观星 -->
      <button class="h-10 rounded-xl bg-[#0f172a] flex items-center justify-center gap-1.5 text-white shadow-sm active:bg-slate-800 transition-colors" aria-label="云观星">
        <svg class="w-4 h-4 text-slate-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="3" r="1"/>
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="text-[13px] font-medium tracking-tight">云观星</span>
      </button>
    </div>
  </div>

  <!-- Persistent Main Navigation (地图 / 我的: Always visible at bottom, never occluded) -->
  <nav class="relative z-30 w-full h-[52px] bg-white border-t border-slate-100 flex items-center justify-around px-8 shrink-0">
    <!-- 地图 (Active) -->
    <button class="flex items-center gap-2 text-slate-900 font-medium py-1 px-3" aria-label="地图主页">
      <svg class="w-[18px] h-[18px] text-slate-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      <span class="text-[13px] tracking-tight">地图</span>
    </button>

    <!-- 我的 (Inactive) -->
    <button class="flex items-center gap-2 text-slate-400 font-normal py-1 px-3" aria-label="我的">
      <svg class="w-[18px] h-[18px] text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="text-[13px] tracking-tight">我的</span>
    </button>
  </nav>

  <!-- iOS Bottom Home Indicator Bar -->
  <div class="relative z-30 w-full h-[18px] bg-white flex items-center justify-center pb-1 shrink-0">
    <div class="w-[134px] h-[5px] bg-slate-900/90 rounded-full"></div>
  </div>

</body>
</html>
