<!-- Interactive JavaScript for "想去" Button Animation & State Toggle -->
<script data-purpose="interaction-want-to-go">
    const wantBtn = document.getElementById('wantToGoBtn');
    const starCluster = document.getElementById('starCluster');
    const btnText = document.getElementById('wantToGoText');
    let isActive = true;

    wantBtn.addEventListener('click', () => {
      // Trigger smooth 720deg rotation animation
      starCluster.classList.remove('star-animate-spin');
      void starCluster.offsetWidth; // Trigger DOM reflow
      starCluster.classList.add('star-animate-spin');

      // Toggle state
      isActive = !isActive;
      if (isActive) {
        wantBtn.className = 'h-10 rounded-full border border-amber-300 bg-amber-50/70 active:scale-95 flex items-center justify-center space-x-1.5 transition select-none';
        btnText.textContent = '已想去';
        btnText.className = 'text-[13px] font-semibold text-amber-800';
        starCluster.innerHTML = `
