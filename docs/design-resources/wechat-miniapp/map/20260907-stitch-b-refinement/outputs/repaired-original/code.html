<!DOCTYPE html>

<html class="h-full" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>今晚去观星 - 深圳市天文台</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      width: 390px;
      height: 844px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }
    .touch-target-44 {
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="bg-[#F7F8FA] w-[390px] h-[844px] select-none flex flex-col">
<!-- ==================== 地图底层背景 ==================== -->
<div class="absolute inset-x-0 top-0 h-[480px] z-0 bg-[#A6C9D8] overflow-hidden">
<img alt="OpenStreetMap 底图" class="w-[390px] h-[480px] object-cover object-top select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtYNcFDPADatz7G8KpzNBnBHyMYwudNz-K_bd17qwfL7-p8-niX6n78D1emMuv0S4Mm0aUGFuIlyxAIXNoayJ2SiQEHZoIkbpmuI_OW7l3uJwP5HYgDPSIwvTy1L-30pJdTckvdlklsMt08XtbbuZfG0e691AdNbMh4PuIOZ4c6OoSh3-SnySLcswB653x9na9Fi0hEUPEAaVn_7tTzoAjq2RMqJW3Uzthyy7-Xm7pQMTwcIC5eh5r9wLauvM4sHB9"/>
<!-- 选中的观星点标注 Marker (崖头顶上方山脊) -->
<div class="absolute top-[320px] left-[196px] z-10 -translate-x-1/2 -translate-y-full flex flex-col items-center pointer-events-auto">
<div class="w-8 h-8 rounded-full bg-blue-600/20 flex items-center justify-center animate-pulse">
<div class="w-6 h-6 rounded-full bg-blue-600 border-2 border-white flex items-center justify-center shadow-md">
<i class="fa-solid fa-location-dot text-white text-[12px]"></i>
</div>
</div>
<div class="w-1.5 h-0.5 bg-slate-800/40 rounded-full blur-[0.5px]"></div>
</div>
<!-- OSM 版权归属单行标注（完整露出在抽屉上方） -->
<div class="absolute top-[382px] left-3 z-10 px-2 py-0.5 bg-white/90 backdrop-blur-sm rounded text-[10px] text-slate-500 tracking-tight whitespace-nowrap shadow-sm border border-slate-200/50">
      © OpenStreetMap 贡献者
    </div>
</div>
<!-- ==================== 顶部状态栏与导航栏 (小程序原生胶囊与搜索) ==================== -->
<div class="relative z-20 w-full pt-12 pb-2 px-4 flex flex-col gap-2.5 pointer-events-none">
<!-- 状态栏标题与胶囊 -->
<div class="flex items-center justify-between w-full h-8">
<span class="text-[17px] font-semibold text-slate-900 tracking-tight drop-shadow-[0_1px_2px_rgba(255,255,255,0.8)]">今晚去观星</span>
<!-- 微信原生胶囊模拟 (87px x 32px) -->
<div class="w-[87px] h-[32px] bg-white/90 backdrop-blur-md rounded-full border border-black/10 flex items-center justify-around px-2 shadow-sm pointer-events-auto">
<button class="w-6 h-6 flex items-center justify-center text-slate-800 active:opacity-60">
<i class="fa-solid fa-ellipsis text-xs"></i>
</button>
<div class="w-[1px] h-3.5 bg-slate-300"></div>
<button class="w-6 h-6 flex items-center justify-center text-slate-800 active:opacity-60">
<i class="fa-regular fa-circle-dot text-xs"></i>
</button>
</div>
</div>
<!-- 搜索栏 -->
<div class="w-full h-10 bg-white/95 backdrop-blur-md rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.06)] border border-slate-200/80 flex items-center px-3 gap-2.5 pointer-events-auto">
<i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
<input class="w-full bg-transparent text-slate-800 text-[14px] placeholder-slate-400 outline-none cursor-pointer select-none" placeholder="搜索观星点" readonly="" type="text"/>
</div>
</div>
<!-- ==================== 地图右侧浮动工具（十字准星 + 图层） ==================== -->
<div class="absolute right-3.5 top-[270px] z-20 flex flex-col gap-2.5 pointer-events-auto">
<!-- 十字准星定位按钮（44x44热区） -->
<button class="touch-target-44 w-10 h-10 bg-white/95 backdrop-blur-md rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-slate-200/80 text-slate-700 active:bg-slate-100 transition-colors" title="定位">
<i class="fa-solid fa-crosshairs text-[17px]"></i>
</button>
<!-- 图层切换按钮（44x44热区） -->
<button class="touch-target-44 w-10 h-10 bg-white/95 backdrop-blur-md rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-slate-200/80 text-slate-700 active:bg-slate-100 transition-colors" title="图层">
<i class="fa-solid fa-layer-group text-[15px]"></i>
</button>
</div>
<!-- 弹性空白填充区：推动下方抽屉与主导航整体沉底紧密相连 -->
<div class="flex-1 pointer-events-none"></div>
<!-- ==================== 连贯贴底内容抽屉（紧凑自然流式无断层） ==================== -->
<div class="relative z-30 w-full bg-white rounded-t-[20px] shadow-[0_-4px_16px_rgba(15,23,42,0.06)] border-t border-slate-100/80 flex flex-col pt-2 pb-3 px-5">
<!-- 顶部拖动手柄 -->
<div class="w-full flex justify-center py-1">
<div class="w-9 h-1 bg-slate-300 rounded-full"></div>
</div>
<!-- 1. 地点身份标题栏 -->
<div class="mt-1 flex items-baseline justify-between">
<h1 class="text-[19px] font-bold text-slate-900 tracking-tight">深圳市天文台</h1>
<span class="text-[13px] font-medium text-slate-500">深圳 · 大鹏</span>
</div>
<!-- 2. 章节轻量导航锚点（左对齐，短下划线标识，44px可触控区） -->
<div class="flex items-center gap-6 mt-1 border-b border-slate-100">
<div class="touch-target-44 relative flex-col cursor-pointer">
<span class="text-[14px] font-semibold text-slate-900">概览</span>
<div class="absolute bottom-1.5 w-5 h-[2px] bg-slate-900 rounded-full"></div>
</div>
<div class="touch-target-44 relative flex-col cursor-pointer">
<span class="text-[14px] font-normal text-slate-400 hover:text-slate-600 transition-colors">天文</span>
</div>
</div>
<!-- 3. 路线与到达微底色卡片 -->
<div class="mt-2.5 p-2.5 px-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between">
<div class="flex flex-col gap-0.5">
<div class="text-[13px] font-medium text-slate-800">路线与到达</div>
<div class="text-[12px] text-slate-400 font-normal">距离、预计到达暂无数据</div>
</div>
<button class="touch-target-44 px-3 py-1.5 bg-white border border-slate-200/90 shadow-sm rounded-lg flex items-center gap-1 text-slate-700 text-[13px] font-medium active:bg-slate-100 transition-colors">
<i class="fa-solid fa-location-arrow text-[12px] text-blue-600 -rotate-45"></i>
<span class="whitespace-nowrap">导航</span>
</button>
</div>
<!-- 4. 场地事实紧凑列表（紧凑静态事实节奏） -->
<div class="mt-2 flex flex-col gap-1.5 divide-y divide-slate-50 text-[13px]">
<div class="flex items-center justify-between pt-1 text-slate-700">
<div class="flex items-center gap-2">
<i class="fa-regular fa-clock text-[13px] text-slate-400 w-4 text-center"></i>
<span>开放时间</span>
</div>
<span class="text-slate-400 font-normal">暂无数据</span>
</div>
<div class="flex items-center justify-between pt-1.5 text-slate-700">
<div class="flex items-center gap-2">
<i class="fa-solid fa-square-parking text-[13px] text-slate-400 w-4 text-center"></i>
<span>停车设施</span>
</div>
<span class="text-slate-400 font-normal">暂无数据</span>
</div>
<div class="flex items-center justify-between pt-1.5 text-slate-700">
<div class="flex items-center gap-2">
<i class="fa-solid fa-restroom text-[13px] text-slate-400 w-4 text-center"></i>
<span>洗手间</span>
</div>
<span class="text-slate-400 font-normal">暂无数据</span>
</div>
</div>
<!-- 5. 辅助元数据行 -->
<div class="flex items-center justify-around mt-2.5 pt-1.5 border-t border-slate-100 text-[12px]">
<button class="text-slate-500 hover:text-slate-700 py-1">场地资料</button>
<span class="text-slate-200">|</span>
<button class="text-slate-500 hover:text-slate-700 py-1">数据来源</button>
<span class="text-slate-200">|</span>
<button class="text-slate-500 hover:text-slate-700 py-1">反馈纠错</button>
</div>
<!-- 6. 独立动作栏三按钮（44px高度，云观星深色强调，紧贴下方无空白带） -->
<div class="grid grid-cols-3 gap-2.5 mt-2.5">
<!-- 想去 -->
<button class="h-11 bg-slate-50 border border-slate-200/80 rounded-xl flex items-center justify-center gap-1.5 text-slate-700 text-[13px] font-medium active:bg-slate-100 transition-colors">
<i class="fa-regular fa-star text-[14px] text-amber-500"></i>
<span>想去</span>
</button>
<!-- 分享 -->
<button class="h-11 bg-slate-50 border border-slate-200/80 rounded-xl flex items-center justify-center gap-1.5 text-slate-700 text-[13px] font-medium active:bg-slate-100 transition-colors">
<i class="fa-solid fa-arrow-up-from-bracket text-[13px] text-slate-600"></i>
<span>分享</span>
</button>
<!-- 云观星 -->
<button class="h-11 bg-slate-900 border border-slate-900 rounded-xl flex items-center justify-center gap-1.5 text-white text-[13px] font-medium shadow-sm active:bg-slate-800 transition-colors">
<i class="fa-solid fa-binoculars text-[13px] text-sky-300"></i>
<span>云观星</span>
</button>
</div>
</div>
<!-- ==================== 底部原生主导航栏 (贴底常驻，50px + safe area 34px) ==================== -->
<div class="relative z-40 w-full bg-white border-t border-slate-200/60 pb-8 pt-1.5 px-12 flex items-center justify-between select-none">
<!-- 地图 (高亮) -->
<div class="touch-target-44 flex flex-col items-center gap-0.5 cursor-pointer">
<div class="w-5 h-5 flex items-center justify-center text-blue-600">
<i class="fa-solid fa-map-location-dot text-[17px]"></i>
</div>
<span class="text-[11px] font-medium text-blue-600">地图</span>
</div>
<!-- 我的 -->
<div class="touch-target-44 flex flex-col items-center gap-0.5 cursor-pointer opacity-60 hover:opacity-100 transition-opacity">
<div class="w-5 h-5 flex items-center justify-center text-slate-500">
<i class="fa-regular fa-user text-[17px]"></i>
</div>
<span class="text-[11px] font-normal text-slate-600">我的</span>
</div>
</div>
<!-- iOS Home Indicator 指示条 -->
<div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900/30 rounded-full z-50 pointer-events-none"></div>
</body></html>
