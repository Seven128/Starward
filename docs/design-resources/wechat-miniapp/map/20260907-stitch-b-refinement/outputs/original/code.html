<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>今晚去观星 - 深圳市天文台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    /* 确保交互热区至少 44px 但视觉外观保持小巧 */
    .touch-target-44 {
      position: relative;
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .touch-target-row {
      min-height: 44px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen m-0 p-0 select-none overflow-hidden">

  <!-- 390x844 微信小程序标准逻辑尺寸容器 -->
  <div class="relative w-[390px] h-[844px] bg-[#F7F8FA] overflow-hidden flex flex-col justify-between shadow-2xl">

    <!-- ==================== 地图底层背景 ==================== -->
    <div class="absolute inset-0 z-0 bg-[#D4E6EC] overflow-hidden">
      <!-- 采用项目指定 OSM 地图原素材，390 宽对齐 -->
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAYUKkL52cJ6hQ778lThxR4R6x2iSS2AuTWQp2YkghBFz54IRwjw7tAyqUOA_4pl9DTo2cxjZ4qImK0iw-zdAP2L5AwF6KOVk2M8KYF1c065MDd8935gMwY414ISgcSsCpWE1scDss19RVzLxJNffyb4BLOlNCjXpJlxZnit81ypchWbv-uVCsOmQzjXTFYQMq3ZwOHazpOsgfB3MhpTQUI5xvwG3gLJvps4QCeLzAheFJ8cB2MzTvDNTlzMEh-PHc" alt="OpenStreetMap 底图" class="w-[390px] h-[480px] object-cover object-top select-none pointer-events-none" />
      
      <!-- OSM 版权归属单行标注（不折行，规范字号） -->
      <div class="absolute top-[448px] left-3 z-10 px-2 py-0.5 bg-white/85 backdrop-blur-sm rounded text-[10px] text-slate-500 tracking-tight whitespace-nowrap shadow-sm border border-slate-200/50">
        © OpenStreetMap 贡献者
      </div>

      <!-- 选中的观星点标注 Marker（深圳市天文台：坐落于大鹏半岛南部山脊崖头顶/西涌海岸高处，修正原图落在深海的偏差） -->
      <div class="absolute top-[326px] left-[184px] z-10 -translate-x-1/2 -translate-y-full flex flex-col items-center cursor-pointer pointer-events-auto group">
        <!-- 气泡 Pin 图标 -->
        <div class="relative flex items-center justify-center">
          <svg class="w-8 h-9 drop-shadow-[0_3px_5px_rgba(15,23,42,0.35)]" viewBox="0 0 32 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 0C7.16344 0 0 7.16344 0 16C0 26.5 16 36 16 36C16 36 32 26.5 32 16C32 7.16344 24.8366 0 16 0Z" fill="#1E293B"/>
            <circle cx="16" cy="15" r="11" fill="#0F172A"/>
            <circle cx="16" cy="15" r="9" fill="#2563EB"/>
          </svg>
          <i class="fa-solid fa-star text-[9px] text-amber-300 absolute top-[11px]"></i>
        </div>
        <!-- 脉冲光环 (点位精准指示针脚) -->
        <div class="w-2 h-1 bg-slate-800/40 rounded-full blur-[0.5px] mt-0.5"></div>
      </div>
    </div>

    <!-- ==================== 顶部导航栏 (小程序原生胶囊与搜索) ==================== -->
    <div class="relative z-20 w-full pt-12 pb-2 px-4 flex flex-col gap-2.5 pointer-events-none">
      <!-- 微信状态栏占位与标题/胶囊行 -->
      <div class="flex items-center justify-between w-full h-8">
        <span class="text-[17px] font-semibold text-slate-900 tracking-tight drop-shadow-[0_1px_2px_rgba(255,255,255,0.8)]">今晚去观星</span>
        
        <!-- 微信原生胶囊模拟 (87px x 32px) -->
        <div class="w-[87px] h-[32px] bg-white/90 backdrop-blur-md rounded-full border border-black/10 flex items-center justify-around px-2 shadow-sm pointer-events-auto">
          <button class="w-6 h-6 flex items-center justify-center text-slate-800 active:opacity-60">
            <i class="fa-solid fa-ellipsis text-xs"></i>
          </button>
          <div class="w-[1px] h-3.5 bg-slate-300"></div>
          <button class="w-6 h-6 flex items-center justify-center text-slate-800 active:opacity-60">
            <i class="fa-regular fa-circle-dot text-xs"></i>
          </button>
        </div>
      </div>

      <!-- 搜索栏（无尾部×号，轻巧白底微阴影） -->
      <div class="w-full h-10 bg-white/95 backdrop-blur-md rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.06)] border border-slate-200/80 flex items-center px-3 gap-2.5 pointer-events-auto">
        <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
        <input type="text" placeholder="搜索观星点" readonly class="w-full bg-transparent text-slate-800 text-[14px] placeholder-slate-400 outline-none cursor-pointer select-none">
      </div>
    </div>

    <!-- ==================== 地图浮动工具按钮（右侧垂直排列） ==================== -->
    <div class="absolute right-3 top-[170px] z-20 flex flex-col gap-2.5 pointer-events-auto">
      <!-- 定位按钮：修正为明确的瞄准定位十字标图标，保证 44x44 热区 -->
      <button class="w-10 h-10 bg-white/95 backdrop-blur-md rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-slate-200/80 flex items-center justify-center text-slate-700 active:bg-slate-100 transition-colors touch-target-44" title="定位到当前位置">
        <i class="fa-solid fa-crosshairs text-[17px]"></i>
      </button>

      <!-- 图层按钮：与地点面板互斥，保证 44x44 热区 -->
      <button class="w-10 h-10 bg-white/95 backdrop-blur-md rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-slate-200/80 flex items-center justify-center text-slate-700 active:bg-slate-100 transition-colors touch-target-44" title="切换图层">
        <i class="fa-solid fa-layer-group text-[15px]"></i>
      </button>
    </div>

    <!-- ==================== 连贯贴底信息抽屉 (Medium 状态) ==================== -->
    <!-- 连贯贴底，平铺而有层级的地点事实，白色阅读表面，轻柔上圆角与阴影 -->
    <div class="relative z-30 w-full bg-white rounded-t-[22px] shadow-[0_-6px_24px_rgba(15,23,42,0.08)] border-t border-slate-100 flex flex-col pt-2 pb-2 px-5">
      
      <!-- 顶部拖动把手 (仅用于手势拖动，非点击按钮) -->
      <div class="w-full flex justify-center py-1 select-none pointer-events-none">
        <div class="w-9 h-1 bg-slate-300 rounded-full"></div>
      </div>

      <!-- 1. 地点身份标题与区域（视觉阅读焦点） -->
      <div class="mt-1.5 flex items-baseline justify-between">
        <h1 class="text-[19px] font-bold text-slate-900 tracking-tight">深圳市天文台</h1>
        <span class="text-[13px] font-medium text-slate-500">深圳 · 大鹏</span>
      </div>

      <!-- 2. 章节轻量导航锚点（靠左对齐，短下划线标识，点击展开大档对齐定位语义） -->
      <div class="flex items-center gap-6 mt-2 pb-2 border-b border-slate-100">
        <div class="relative flex flex-col items-center cursor-pointer py-1">
          <span class="text-[14px] font-semibold text-slate-900">概览</span>
          <div class="absolute bottom-0 w-5 h-[2px] bg-slate-900 rounded-full"></div>
        </div>
        <div class="relative flex flex-col items-center cursor-pointer py-1">
          <span class="text-[14px] font-normal text-slate-400 hover:text-slate-600 transition-colors">天文</span>
        </div>
      </div>

      <!-- 3. 路线与到达（卡片底色微调，导航单行完整可读，杜绝文字挤折，满足44px热区） -->
      <div class="mt-2.5 p-3 bg-slate-50/90 rounded-xl border border-slate-100 flex items-center justify-between">
        <div class="flex flex-col gap-0.5">
          <div class="text-[14px] font-medium text-slate-800 tracking-tight">路线与到达</div>
          <div class="text-[12px] text-slate-400 font-normal">距离、预计到达暂无数据</div>
        </div>
        <!-- 导航操作：安静但清晰的高对比度微按钮，确保至少 44px 独立命中区且单行展示 -->
        <button class="touch-target-44 px-3 py-1.5 bg-white border border-slate-200/90 shadow-sm rounded-lg flex items-center gap-1.5 text-slate-700 text-[13px] font-medium active:bg-slate-100 transition-colors">
          <i class="fa-solid fa-location-arrow text-[12px] text-blue-600 -rotate-45"></i>
          <span class="whitespace-nowrap">导航</span>
        </button>
      </div>

      <!-- 4. 场地事实列表（两端对齐，行高满足 44px 命中可读，文案不赘余，字号阶梯清晰） -->
      <div class="mt-1 divide-y divide-slate-100">
        <!-- 开放时间 -->
        <div class="touch-target-row justify-between text-[13px]">
          <div class="flex items-center gap-2.5 text-slate-600">
            <i class="fa-regular fa-clock text-[14px] text-slate-400 w-4 text-center"></i>
            <span>开放时间</span>
          </div>
          <span class="text-slate-400 font-normal">暂无数据</span>
        </div>

        <!-- 停车设施 -->
        <div class="touch-target-row justify-between text-[13px]">
          <div class="flex items-center gap-2.5 text-slate-600">
            <i class="fa-solid fa-square-parking text-[14px] text-slate-400 w-4 text-center"></i>
            <span>停车设施</span>
          </div>
          <span class="text-slate-400 font-normal">暂无数据</span>
        </div>

        <!-- 洗手间 -->
        <div class="touch-target-row justify-between text-[13px]">
          <div class="flex items-center gap-2.5 text-slate-600">
            <i class="fa-solid fa-restroom text-[14px] text-slate-400 w-4 text-center"></i>
            <span>洗手间</span>
          </div>
          <span class="text-slate-400 font-normal">暂无数据</span>
        </div>
      </div>

      <!-- 5. 辅助元数据与纠错反馈入口（精致小巧、字色可读，点击热区充裕） -->
      <div class="flex items-center justify-between pt-2 pb-1 border-t border-slate-100 text-[12px] text-slate-400">
        <button class="touch-target-44 text-slate-500 hover:text-slate-700 transition-colors">场地资料</button>
        <span class="text-slate-200">|</span>
        <button class="touch-target-44 text-slate-500 hover:text-slate-700 transition-colors">数据来源</button>
        <span class="text-slate-200">|</span>
        <button class="touch-target-44 text-slate-500 hover:text-slate-700 transition-colors">反馈纠错</button>
      </div>

      <!-- 6. 独立动作栏 (想去 / 分享 / 云观星) -->
      <!-- 统一保证 44px 高度独立命中区，云观星做适度深色强调，其余精致线框 -->
      <div class="grid grid-cols-3 gap-2.5 mt-1.5 mb-1">
        <!-- 想去 -->
        <button class="h-11 bg-slate-50 border border-slate-200/80 rounded-xl flex items-center justify-center gap-1.5 text-slate-700 text-[14px] font-medium active:bg-slate-100 transition-colors">
          <i class="fa-regular fa-star text-[14px] text-amber-500"></i>
          <span>想去</span>
        </button>

        <!-- 分享 -->
        <button class="h-11 bg-slate-50 border border-slate-200/80 rounded-xl flex items-center justify-center gap-1.5 text-slate-700 text-[14px] font-medium active:bg-slate-100 transition-colors">
          <i class="fa-solid fa-arrow-up-from-bracket text-[13px] text-slate-600"></i>
          <span>分享</span>
        </button>

        <!-- 云观星（适度强调：夜空石板深灰，突显观星心智） -->
        <button class="h-11 bg-slate-900 border border-slate-900 rounded-xl flex items-center justify-center gap-1.5 text-white text-[14px] font-medium shadow-[0_2px_8px_rgba(15,23,42,0.18)] active:bg-slate-800 transition-colors">
          <i class="fa-solid fa-binoculars text-[13px] text-sky-300"></i>
          <span>云观星</span>
        </button>
      </div>

    </div>

    <!-- ==================== 底部原生主导航栏 (固定置底，仅“地图”与“我的”) ==================== -->
    <!-- 确保主导航不被面板遮挡，高 52px + 底部安全区，地图高亮 -->
    <div class="relative z-40 w-full bg-white border-t border-slate-200/70 pb-5 pt-1.5 px-12 flex items-center justify-between select-none">
      <!-- 地图 (已选中) -->
      <div class="flex flex-col items-center gap-1 cursor-pointer touch-target-44 group">
        <div class="w-5 h-5 flex items-center justify-center text-blue-600">
          <i class="fa-solid fa-map-location-dot text-[17px]"></i>
        </div>
        <span class="text-[11px] font-medium text-blue-600">地图</span>
      </div>

      <!-- 我的 -->
      <div class="flex flex-col items-center gap-1 cursor-pointer touch-target-44 group opacity-60 hover:opacity-100 transition-opacity">
        <div class="w-5 h-5 flex items-center justify-center text-slate-500">
          <i class="fa-regular fa-user text-[17px]"></i>
        </div>
        <span class="text-[11px] font-normal text-slate-600">我的</span>
      </div>
    </div>

    <!-- iOS Home Indicator 指示条 -->
    <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900/40 rounded-full z-50 pointer-events-none"></div>

  </div>

</body>
</html>
