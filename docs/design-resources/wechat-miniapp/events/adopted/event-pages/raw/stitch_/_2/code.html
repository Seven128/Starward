<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>观星计划 - Starward</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F8F9FA',
              surface: '#FFFFFF',
              subtle: '#F1F3F5',
              border: '#E9ECEF',
              text: '#212529',
              muted: '#6C757D',
              secondary: '#495057',
              accent: '#3E5C76',
              accentHover: '#2F4858',
              pill: '#EBF1F6'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      width: 390px;
      height: 844px;
      margin: 0 auto;
      background-color: #F8F9FA;
      color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    /* 隐藏滚动条但保留滚动功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-brand-bg relative select-none">
  <!-- 微信小程序顶栏 (iOS 状态栏 + 导航栏 + 胶囊按钮) -->
  <header class="sticky top-0 z-50 bg-brand-bg/95 backdrop-blur-sm border-b border-brand-border/60">
    <!-- 状态栏高度 (44px) -->
    <div class="h-11 w-full flex items-center justify-between px-6 text-xs text-brand-secondary font-medium tracking-tight">
      <span>9:41</span>
      <div class="flex items-center space-x-1.5 text-brand-secondary">
        <!-- 信号、Wifi、电池图标 -->
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" fill="none"/><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.66-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M2 17h20v2H2zm1.15-4.05L4 11.97A9.97 9.97 0 0 1 12 8c3.28 0 6.2 1.58 8 4l.85.98-1.52 1.3A7.98 7.98 0 0 0 12 10a7.96 7.96 0 0 0-7.33 4.27l-1.52-1.32z"/></svg>
        <div class="w-5 h-2.5 border border-brand-secondary/80 rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3 bg-brand-secondary rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- 微信小程序导航栏 (44px) -->
    <div class="h-11 px-4 flex items-center justify-between">
      <!-- 左侧返回及标题 -->
      <div class="flex items-center space-x-2">
        <button class="p-1 -ml-1 text-brand-secondary hover:text-brand-text active:opacity-60 transition-opacity" aria-label="返回">
          <svg class="w-5 h-5 stroke-[1.8] stroke-current fill-none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>
        <h1 class="text-base font-semibold text-brand-text tracking-tight">观星计划</h1>
      </div>

      <!-- 右侧标准微信小程序胶囊控件 -->
      <div class="flex items-center h-8 bg-white/80 border border-brand-border/80 rounded-full px-2.5 shadow-2xs space-x-2.5">
        <button class="text-brand-secondary hover:text-brand-text active:opacity-60">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <circle cx="6" cy="12" r="1.5"/>
            <circle cx="12" cy="12" r="1.5"/>
            <circle cx="18" cy="12" r="1.5"/>
          </svg>
        </button>
        <div class="w-px h-3.5 bg-brand-border"></div>
        <button class="text-brand-secondary hover:text-brand-text active:opacity-60">
          <svg class="w-4 h-4 fill-none stroke-current stroke-[1.75]" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="7"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体列表容器 -->
  <main class="flex-1 overflow-y-auto no-scrollbar px-4 pt-3 pb-8">
    <!-- 顶部分组控制：安静的“接下来 / 过往”筛选 与 “＋ 新建” -->
    <section class="flex items-center justify-between mb-4 mt-0.5">
      <!-- 极简无侵入式 Tab 切换 -->
      <div class="inline-flex items-center bg-brand-subtle rounded-lg p-0.5 border border-brand-border/50">
        <button class="px-3 py-1 text-xs font-medium text-brand-text bg-brand-surface rounded-md shadow-2xs transition-all">
          接下来
        </button>
        <button class="px-3 py-1 text-xs font-normal text-brand-muted hover:text-brand-secondary transition-colors">
          过往
        </button>
      </div>

      <!-- 新建计划动作按键 -->
      <button class="inline-flex items-center space-x-1 px-2.5 py-1 rounded-md text-xs font-medium text-brand-accent bg-brand-pill/70 hover:bg-brand-pill active:opacity-75 transition-colors">
        <svg class="w-3.5 h-3.5 stroke-[2] stroke-current fill-none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>新建</span>
      </button>
    </section>

    <!-- 计划列表（按日期分组展示） -->
    <div class="space-y-4">
      
      <!-- 日期分组 1: 今天 9月8日 -->
      <section>
        <div class="flex items-baseline justify-between px-1 mb-2">
          <div class="flex items-center space-x-1.5">
            <span class="text-xs font-medium text-brand-secondary">今天 · 9月8日</span>
            <span class="text-[10px] text-brand-muted font-normal">周二</span>
          </div>
          <span class="text-[11px] text-brand-muted">2 项计划</span>
        </div>

        <div class="space-y-2">
          <!-- 计划项 1: 星湾观星点 -->
          <article class="bg-brand-surface rounded-xl p-3.5 border border-brand-border/70 hover:border-brand-border active:bg-[#FAFAFA] transition-all cursor-pointer">
            <div class="flex items-start justify-between">
              <!-- 左侧主信息与备注 -->
              <div class="flex-1 pr-3">
                <div class="flex items-center space-x-2">
                  <h2 class="text-[15px] font-semibold text-brand-text tracking-tight">星湾观星点</h2>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-brand-subtle text-brand-secondary">
                    20:30
                  </span>
                </div>
                
                <p class="mt-1.5 text-xs text-brand-secondary line-clamp-1 leading-relaxed">
                  沿海平台拍银河，带三脚架
                </p>

                <!-- 出发前清单与地点标识 -->
                <div class="mt-2.5 flex items-center space-x-3 text-[11px] text-brand-muted">
                  <div class="flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5 stroke-[1.75] stroke-current fill-none" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>准备清单 2/5</span>
                  </div>
                  <span class="text-brand-border">|</span>
                  <div class="flex items-center space-x-0.5">
                    <svg class="w-3 h-3 stroke-[1.6] stroke-current fill-none" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                    </svg>
                    <span>正式观测台</span>
                  </div>
                </div>
              </div>

              <!-- 右侧箭头指示 -->
              <div class="pt-1 text-brand-border">
                <svg class="w-4 h-4 stroke-[1.75] stroke-current fill-none" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
              </div>
            </div>
          </article>

          <!-- 计划项 2: 山顶观星点 -->
          <article class="bg-brand-surface rounded-xl p-3.5 border border-brand-border/70 hover:border-brand-border active:bg-[#FAFAFA] transition-all cursor-pointer">
            <div class="flex items-start justify-between">
              <div class="flex-1 pr-3">
                <div class="flex items-center space-x-2">
                  <h2 class="text-[15px] font-semibold text-brand-text tracking-tight">山顶观星点</h2>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-brand-subtle text-brand-secondary">
                    23:00
                  </span>
                </div>
                
                <p class="mt-1.5 text-xs text-brand-secondary line-clamp-1 leading-relaxed">
                  先确认夜间步道是否开放
                </p>

                <div class="mt-2.5 flex items-center space-x-3 text-[11px] text-brand-muted">
                  <div class="flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5 stroke-[1.75] stroke-current fill-none" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>准备清单 1/5</span>
                  </div>
                  <span class="text-brand-border">|</span>
                  <div class="flex items-center space-x-0.5">
                    <svg class="w-3 h-3 stroke-[1.6] stroke-current fill-none" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                    </svg>
                    <span>星空保护区</span>
                  </div>
                </div>
              </div>

              <div class="pt-1 text-brand-border">
                <svg class="w-4 h-4 stroke-[1.75] stroke-current fill-none" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
              </div>
            </div>
          </article>
        </div>
      </section>

      <!-- 日期分组 2: 明天 9月9日 -->
      <section>
        <div class="flex items-baseline justify-between px-1 mb-2">
          <div class="flex items-center space-x-1.5">
            <span class="text-xs font-medium text-brand-secondary">明天 · 9月9日</span>
            <span class="text-[10px] text-brand-muted font-normal">周三</span>
          </div>
          <span class="text-[11px] text-brand-muted">1 项计划</span>
        </div>

        <article class="bg-brand-surface rounded-xl p-3.5 border border-brand-border/70 hover:border-brand-border active:bg-[#FAFAFA] transition-all cursor-pointer">
          <div class="flex items-start justify-between">
            <div class="flex-1 pr-3">
              <div class="flex items-center space-x-2">
                <h2 class="text-[15px] font-semibold text-brand-text tracking-tight">海岸观星点</h2>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-brand-subtle text-brand-secondary">
                  05:00
                </span>
              </div>

              <p class="mt-1.5 text-xs text-brand-muted italic">
                未添加备注
              </p>

              <div class="mt-2.5 flex items-center space-x-3 text-[11px] text-brand-muted">
                <div class="flex items-center space-x-1">
                  <svg class="w-3.5 h-3.5 stroke-[1.75] stroke-current fill-none text-brand-muted" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                  </svg>
                  <span>准备清单 0/5</span>
                </div>
                <span class="text-brand-border">|</span>
                <div class="flex items-center space-x-0.5">
                  <svg class="w-3 h-3 stroke-[1.6] stroke-current fill-none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                  </svg>
                  <span>暗空观测站</span>
                </div>
              </div>
            </div>

            <div class="pt-1 text-brand-border">
              <svg class="w-4 h-4 stroke-[1.75] stroke-current fill-none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </div>
          </div>
        </article>
      </section>

      <!-- 日期分组 3: 9月12日 周六 -->
      <section>
        <div class="flex items-baseline justify-between px-1 mb-2">
          <div class="flex items-center space-x-1.5">
            <span class="text-xs font-medium text-brand-secondary">9月12日</span>
            <span class="text-[10px] text-brand-muted font-normal">周六</span>
          </div>
          <span class="text-[11px] text-brand-muted">1 项计划</span>
        </div>

        <article class="bg-brand-surface rounded-xl p-3.5 border border-brand-border/70 hover:border-brand-border active:bg-[#FAFAFA] transition-all cursor-pointer">
          <div class="flex items-start justify-between">
            <div class="flex-1 pr-3">
              <div class="flex items-center space-x-2">
                <h2 class="text-[15px] font-semibold text-brand-text tracking-tight">草甸观星点</h2>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-brand-subtle text-brand-secondary">
                  21:00
                </span>
              </div>

              <p class="mt-1.5 text-xs text-brand-secondary line-clamp-1 leading-relaxed">
                预计观测夏季大三角与英仙座流星余辉
              </p>

              <div class="mt-2.5 flex items-center space-x-3 text-[11px] text-brand-muted">
                <div class="flex items-center space-x-1">
                  <svg class="w-3.5 h-3.5 stroke-[1.75] stroke-current fill-none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span>准备清单 0/4</span>
                </div>
                <span class="text-brand-border">|</span>
                <div class="flex items-center space-x-0.5">
                  <svg class="w-3 h-3 stroke-[1.6] stroke-current fill-none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                  </svg>
                  <span>高山牧场点</span>
                </div>
              </div>
            </div>

            <div class="pt-1 text-brand-border">
              <svg class="w-4 h-4 stroke-[1.75] stroke-current fill-none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </div>
          </div>
        </article>
      </section>

    </div>

    <!-- 底部轻提示，保持界面克制 -->
    <div class="text-center py-6 text-[11px] text-brand-muted/70">
      已显示全部计划
    </div>
  </main>
</body>
</html>
