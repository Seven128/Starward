<button class="flex-1 py-1.5 rounded-[6px] text-center transition-all text-brand-muted hover:text-brand-text tap-active" id="tabLive" onclick="switchMode('live')">

<!-- 涉及内容多选胶囊（轻量浅灰、选中浅蓝灰，紧凑自适应栅格） -->

<label class="text-[13px] font-medium text-brand-text flex items-center">
<span>涉及内容</span>

</label>

<!-- 9 个核心业务项胶囊（默认选中“开放情况”） -->

</button>
<!-- 2. 进入规则 -->
<button class="tag-item px-3 py-1.5 rounded-full text-[12px] font-medium border border-brand-tagBorder bg-brand-tagBg text-[#4B5563] transition-colors flex items-center space-x-1" data-selected="false" onclick="toggleTag(this)" type="button">

</button>
<!-- 3. 末段道路 -->
<button class="tag-item px-3 py-1.5 rounded-full text-[12px] font-medium border border-brand-tagBorder bg-brand-tagBg text-[#4B5563] transition-colors flex items-center space-x-1" data-selected="false" onclick="toggleTag(this)" type="button">
<span>末段道路</span>
</button>
<!-- 4. 停车信息 -->
<button class="tag-item px-3 py-1.5 rounded-full text-[12px] font-medium border border-brand-tagBorder bg-brand-tagBg text-[#4B5563] transition-colors flex items-center space-x-1" data-selected="false" onclick="toggleTag(this)" type="button">

</label>

</div>
<div class="mt-2 flex items-center justify-between bg-white border border-brand-border rounded-lg px-3 py-2 text-xs text-brand-text">

</div>

<div class="flex items-center space-x-2.5 pt-0.5">
<!-- 示例已上传缩略图 (模拟1张拍摄的路口告示) -->

<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>

</button>

<div class="mt-2.5 pt-2 border-t border-brand-divider flex items-center space-x-1 text-[11px] text-brand-muted">
<svg class="w-3.5 h-3.5 text-[#8E97A4] shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>上传即确认拥有该照片权利，并授权用于观星点指南更正展示</span>
</div>
</div>

<div class="flex items-start space-x-1.5">

<!-- 3. 底部操作栏 (适配 iPhone 安全区，双动作：次动作存草稿、主动作提交，带行内细环loading) -->

<svg class="w-3.5 h-3.5 text-[#6D7785]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>存草稿</span>
</button>
<!-- 主动作：提交反馈 (低饱和蓝灰主色，行内细环 loading 动效，无打扰) -->
<button class="flex-1 py-2.5 rounded-lg bg-brand-accent hover:bg-brand-accentHover text-white text-[13.5px] font-medium transition-all shadow-[0_1px_2px_rgba(62,92,118,0.18)] tap-active flex items-center justify-center space-x-2" id="submitBtn" onclick="submitFeedback()" type="button">
<!-- 正常文字 -->
<span id="submitBtnText">提交反馈</span>
<!-- 按钮内细环 Loading (默认隐藏) -->
<svg class="hidden w-4 h-4 text-white animate-spin" fill="none" id="submitSpinner" viewbox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-90" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>
</div>
</footer>
<!-- 页面交互小逻辑：模式切换、多选胶囊高亮、安静保存草稿与提交按钮内loading -->
<script>
    // 切换反馈类型 (资料纠错 vs 现场反馈)
    function switchMode(mode) {
      const tabCorrection = document.getElementById('tabCorrection');
      const tabLive = document.getElementById('tabLive');
      const liveTimeSection = document.getElementById('liveTimeSection');
      const textarea = document.getElementById('feedbackTextarea');

      if (mode === 'correction') {
        tabCorrection.className = 'flex-1 py-1.5 rounded-[6px] text-center transition-all bg-white text-[#1F242D] shadow-[0_1px_2px_rgba(0,0,0,0.06)] tap-active';
        tabLive.className = 'flex-1 py-1.5 rounded-[6px] text-center transition-all text-brand-muted hover:text-brand-text tap-active';
        liveTimeSection.classList.add('hidden');
        textarea.placeholder = "哪些信息有变化？请说明正确情况或提供依据，如：门闸开放时间改至21:00、南向林木增高遮挡天蝎座尾部、末段施工封闭等...";
      } else {
        tabLive.className = 'flex-1 py-1.5 rounded-[6px] text-center transition-all bg-white text-[#1F242D] shadow-[0_1px_2px_rgba(0,0,0,0.06)] tap-active';
        tabCorrection.className = 'flex-1 py-1.5 rounded-[6px] text-center transition-all text-brand-muted hover:text-brand-text tap-active';
        liveTimeSection.classList.remove('hidden');
        textarea.placeholder = "描述当前现场实际状况：如当前夜间照明是否开启、道路积雪通行受阻、实际停车是否已满等...";
      }
    }

    // 胶囊多选切换
    function toggleTag(btn) {
      const isSelected = btn.getAttribute('data-selected') === 'true';
      if (isSelected) {
        btn.setAttribute('data-selected', 'false');
        btn.className = 'tag-item px-3 py-1.5 rounded-full text-[12px] font-medium border border-brand-tagBorder bg-brand-tagBg text-[#4B5563] transition-colors flex items-center space-x-1';
        // 移除勾选图标
        const checkIcon = btn.querySelector('svg');
        if (checkIcon) checkIcon.remove();
      } else {
        btn.setAttribute('data-selected', 'true');
        btn.className = 'tag-item px-3 py-1.5 rounded-full text-[12px] font-medium border border-brand-tagSelectedBorder bg-brand-tagSelectedBg text-brand-tagSelectedText transition-colors flex items-center space-x-1';
        // 添加细勾选
        if (!btn.querySelector('svg')) {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('class', 'w-3 h-3 stroke-[2.5] text-brand-tagSelectedText');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>';
          btn.appendChild(svg);
        }
      }
    }

    // 安静保存草稿：不弹Toast，仅更新顶部时间
    function saveDraftSilently() {
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      const draftEl = document.getElementById('draftSaveTime');
      draftEl.textContent = `草稿已存 ${timeStr}`;
      draftEl.classList.add('text-brand-accent');
      setTimeout(() => {
        draftEl.classList.remove('text-brand-accent');
      }, 1000);
    }

    // 提交：按钮内微型细环 Loading 动效，不大弹窗
    function submitFeedback() {
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('submitBtnText');
      const spinner = document.getElementById('submitSpinner');

      btn.disabled = true;
      text.textContent = "提交中...";
      spinner.classList.remove('hidden');

      setTimeout(() => {
        spinner.classList.add('hidden');
        text.textContent = "已提交核实";
        btn.classList.remove('bg-brand-accent', 'hover:bg-brand-accentHover');
        btn.classList.add('bg-[#5A738E]');
      }, 1200);
    }
  </script>
</body>
</html>
