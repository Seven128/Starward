<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>今晚去观星 · 全系统移动端交互原型 v2</title>
  <style>
    :root {
      --bg:#ffffff;
      --surface:#f7f8fa;
      --fg:#111111;
      --muted:#6b7280;
      --border:#d9dee7;
      --accent:#1677ff;
      --accent-secondary:#111111;
      --font-display:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
      --font-body:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
      --font-mono:SFMono-Regular,Consolas,"Liberation Mono",Menlo,Courier,monospace;
      --shadow:0 20px 52px color-mix(in oklch,var(--fg) 18%,transparent);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--surface);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 42%,transparent);outline-offset:2px}
    button:active:not(.map-marker):not(.danger){transform:scale(.98);opacity:.88;transition:transform 80ms,color 80ms,background 80ms}
    .review-shell{height:100vh;display:grid;grid-template-columns:296px minmax(460px,1fr) 320px;overflow:hidden}
    .review-panel{background:var(--bg);border-color:var(--border);overflow:auto}
    .review-left{border-right:1px solid var(--border);padding:24px 20px;display:flex;flex-direction:column;gap:18px}
    .review-right{border-left:1px solid var(--border);padding:24px 20px;display:flex;flex-direction:column;gap:18px}
    .brand-lockup{display:flex;align-items:center;gap:12px}
    .brand-lockup h1{font-size:17px;line-height:1.2;margin:0}
    .brand-lockup p,.panel-copy{color:var(--muted);font-size:12px;line-height:1.5;margin:3px 0 0}
    .coverage-summary{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .coverage-summary div{padding:12px;background:var(--surface)}
    .coverage-summary div+div{border-left:1px solid var(--border)}
    .coverage-summary strong{display:block;font:700 24px/1 var(--font-mono);margin-bottom:5px}
    .coverage-summary span{font-size:11px;color:var(--muted)}
    .review-search{min-height:44px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 12px}
    .panel-label{font:700 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
    .outcome-nav{display:flex;flex-direction:column;gap:4px}
    .outcome-link{min-height:48px;border:0;border-radius:8px;background:transparent;text-align:left;padding:8px 10px;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center}
    .outcome-link:hover{background:var(--surface)}
    .outcome-link.active{background:var(--fg);color:var(--bg)}
    .outcome-index{font:12px var(--font-mono);color:var(--muted)}
    .outcome-link.active .outcome-index,.outcome-link.active small{color:var(--border)}
    .outcome-link span:nth-child(2){font-weight:700;font-size:13px}
    .outcome-link small{color:var(--muted);font:11px var(--font-mono)}
    .review-note{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;color:var(--muted);font-size:11px;line-height:1.55}
    .device-stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;overflow:auto;padding:32px}
    .stage-caption{position:absolute;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:11px var(--font-mono)}
    .stage-caption strong{color:var(--fg)}
    .device{position:relative;width:390px;height:844px;flex:0 0 auto;border-radius:56px;padding:12px;background:var(--fg);box-shadow:var(--shadow),0 0 0 1px var(--border) inset;isolation:isolate}
    .device:before,.device:after{content:"";position:absolute;width:3px;top:108px;bottom:108px;background:color-mix(in oklch,var(--border) 40%,var(--fg));pointer-events:none}
    .device:before{left:-2px}.device:after{right:-2px}
    .rail{position:absolute;width:4px;background:var(--fg);border-radius:8px}
    .rail.l1{left:-3px;top:174px;height:32px}.rail.l2{left:-3px;top:220px;height:60px}.rail.l3{left:-3px;top:290px;height:60px}.rail.r1{right:-3px;top:250px;height:100px}
    .island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:var(--fg);border-radius:24px;z-index:12}
    .screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background 150ms,color 150ms}
    .screen[data-mode="night"]{--bg:#111111;--surface:#111111;--fg:#ffffff;--muted:#d9dee7;--border:#6b7280;--accent-secondary:#ffffff}
    .screen[data-mode="red"]{--red-background:#050000;--red-surface:#170000;--red-foreground:#ff9b9b;--red-muted:#e77474;--red-border:#a63f3f;--red-accent:#ff5454;--red-anchor:#ffb3b3;--bg:var(--red-background);--surface:var(--red-surface);--fg:var(--red-foreground);--muted:var(--red-muted);--border:var(--red-border);--accent:var(--red-accent);--accent-secondary:var(--red-anchor)}
    .statusbar{flex:0 0 47px;padding:18px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:700;position:relative;z-index:6}
    .status-icons{display:flex;align-items:center;gap:6px}.status-icons svg{width:17px;height:11px;fill:currentColor}.status-icons .battery{width:25px}
    .app-context{flex:0 0 52px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:0 12px;gap:8px;background:color-mix(in oklch,var(--bg) 94%,transparent);z-index:5}
    .back-btn,.context-action{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center}
    .back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
    .context-main{min-width:0}
    .context-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .context-main span{display:block;color:var(--muted);font:10px var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .freshness{font:700 9px var(--font-mono);border:1px solid var(--border);border-radius:8px;padding:5px 6px;white-space:nowrap}
    .content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:24px}
    .content::-webkit-scrollbar{display:none}
    .page-head{padding:18px 18px 12px}
    .eyebrow{font:700 10px var(--font-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
    .page-head h1{font:700 24px/1.08 var(--font-display);letter-spacing:-.025em;margin:0}
    .page-head p{color:var(--muted);font-size:13px;line-height:1.45;margin:8px 0 0}
    .module{margin:0 18px;padding:14px 0;border-top:1px solid var(--border);position:relative}
    .module:first-of-type{border-top:0}
    .module.box{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--surface);margin-bottom:12px}
    .module.hero{border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--surface);margin-bottom:12px}
    .module h2,.module h3{margin:0;font-family:var(--font-display)}
    .module h2{font-size:18px}.module h3{font-size:15px}
    .module-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
    .module-title small{color:var(--muted);font:10px var(--font-mono)}
    .meta{color:var(--muted);font:11px/1.45 var(--font-mono)}
    .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
    .row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:10px}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .btn{min-height:44px;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
    .btn.full{width:100%}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}.btn.strong{background:var(--fg);color:var(--bg);border-color:var(--fg)}
    .btn.danger{border-style:dashed}.btn[disabled]{cursor:not-allowed;opacity:.5}
    .icon-btn{width:44px;height:44px;border:1px solid var(--border);background:var(--bg);border-radius:8px;display:grid;place-items:center}
    .icon-btn svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
    .segmented{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
    .option{min-height:44px;border:0;background:transparent;border-radius:6px;padding:7px 8px;font-size:12px}
    .option.selected{background:var(--fg);color:var(--bg);font-weight:700}
    .chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}.chip-row::-webkit-scrollbar{display:none}
    .chip{min-height:44px;white-space:nowrap;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:8px 11px;font-size:12px}
    .chip.selected{background:var(--fg);color:var(--bg);border-color:var(--fg)}
    .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .metric{padding:10px 5px;text-align:center;background:var(--bg)}.metric+.metric{border-left:1px solid var(--border)}
    .metric strong{display:block;font:700 15px var(--font-mono)}.metric span{font-size:9px;color:var(--muted)}
    .status-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:8px;padding:4px 7px;font:700 9px var(--font-mono)}
    .status-badge:before{content:"";width:7px;height:7px;border:1px solid currentColor;border-radius:50%}
    .status-badge.solid:before{background:currentColor}
    .hero-score{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}
    .hero-score strong{font:700 44px/1 var(--font-mono);letter-spacing:-.04em}.hero-score p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .timeline{position:relative;height:48px;border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden}
    .timeline-window{position:absolute;left:28%;right:18%;top:15px;height:16px;border:2px solid var(--fg);border-radius:8px}
    .timeline-node{position:absolute;top:9px;width:26px;height:26px;border-radius:50%;border:2px solid var(--fg);background:var(--bg)}
    .range{width:100%;accent-color:var(--fg);min-height:44px}
    .list{border-top:1px solid var(--border)}
    .list-row{min-height:52px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0}
    .list-row strong{font-size:13px;display:block}.list-row span{font-size:11px;color:var(--muted)}
    .form-field{display:flex;flex-direction:column;gap:5px}.form-field label{font-size:11px;font-weight:700}
    .form-field input,.form-field select,.form-field textarea{min-height:44px;width:100%;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:10px 11px}
    .form-field textarea{min-height:74px;resize:vertical}.field-error{display:none;color:var(--fg);font-size:11px;font-weight:700}.form-field.invalid .field-error{display:block}.form-field.invalid input{border-width:2px;border-style:dashed}
    .switch-row{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .switch{width:52px;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:11px 5px;display:flex;align-items:center}
    .switch:after{content:"";width:20px;height:20px;border-radius:6px;background:var(--muted);transition:transform 150ms}.switch[aria-pressed="true"]{background:var(--fg)}.switch[aria-pressed="true"]:after{background:var(--bg);transform:translateX(21px)}
    .map-canvas,.sky-canvas{height:250px;margin:0 0 12px;position:relative;overflow:hidden;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
    .map-canvas:before{content:"";position:absolute;inset:0;background:linear-gradient(24deg,transparent 34%,var(--border) 35%,transparent 36%,transparent 62%,var(--border) 63%,transparent 64%),linear-gradient(112deg,transparent 44%,var(--border) 45%,transparent 46%)}
    .map-route{position:absolute;left:18%;top:68%;width:64%;height:34%;border:3px solid var(--accent);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(-12deg)}
    .map-marker{position:absolute;min-width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);background:var(--fg);color:var(--bg);box-shadow:0 2px 10px color-mix(in oklch,var(--fg) 24%,transparent);font:700 10px var(--font-mono)}
    .map-marker.selected{background:var(--fg);border-radius:8px}.marker-a{left:18%;top:58%}.marker-b{left:63%;top:24%}.marker-c{left:70%;top:62%}
    .map-topbar{position:absolute;left:12px;right:12px;top:12px;display:grid;grid-template-columns:1fr 44px;gap:8px;z-index:2}
    .map-search{height:44px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:0 12px;box-shadow:0 6px 16px color-mix(in oklch,var(--fg) 10%,transparent)}
    .map-layers{position:absolute;left:12px;bottom:12px;display:flex;gap:4px}
    .map-layer{height:44px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:0 9px;font-size:11px}
    .map-layer.selected{background:var(--fg);color:var(--bg)}
    .polar{aspect-ratio:1;border:1px solid var(--border);border-radius:50%;position:relative;max-width:210px;margin:auto;background:repeating-radial-gradient(circle,var(--border) 0 1px,transparent 1px 32px)}
    .polar:before,.polar:after{content:"";position:absolute;background:var(--border)}.polar:before{left:50%;top:0;bottom:0;width:1px}.polar:after{top:50%;left:0;right:0;height:1px}
    .polar-path{position:absolute;left:16%;right:16%;top:38%;height:40%;border-top:3px solid var(--fg);border-radius:50%}
    .sky-canvas{height:300px;background:var(--fg);color:var(--bg);border:0}
    .sky-canvas svg{width:100%;height:100%}.sky-info{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;color:var(--bg)}
    .sky-target{position:absolute;left:58%;top:39%;width:54px;height:54px;border:1px solid var(--bg);border-radius:50%;display:grid;place-items:center;font:10px var(--font-mono)}
    /* v2 immersive task surfaces: one canvas, overlay controls, one bottom control layer. */
    .content.is-immersive{position:relative;overflow:hidden;padding:0;background:var(--surface)}
    .content.is-immersive>.state-inline{position:absolute;left:12px;right:12px;top:112px;z-index:24;margin:0;box-shadow:var(--shadow)}
    .immersive-task{position:absolute;inset:0;overflow:hidden;background:var(--surface);isolation:isolate}
    .immersive-task button,.immersive-task input,.immersive-task select{min-height:44px}
    .map-viewport{position:absolute;inset:0;margin:0;border:0;background:var(--surface);overflow:hidden}
    .map-grid{position:absolute;inset:0;background:linear-gradient(24deg,transparent 34%,var(--border) 35%,transparent 36%,transparent 62%,var(--border) 63%,transparent 64%),linear-gradient(112deg,transparent 44%,var(--border) 45%,transparent 46%),linear-gradient(0deg,transparent 49%,var(--border) 50%,transparent 51%);opacity:.72}
    .map-terrain{position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 72% 25%,transparent 0 24px,var(--border) 25px 26px,transparent 27px 48px);opacity:.5}
    .map-route-v2{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.map-route-v2 path{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:8 7}
    .map-viewport[data-layer="light"] .map-terrain{opacity:.2}.map-viewport[data-layer="light"] .map-grid{opacity:1}
    .map-viewport[data-layer="cloud"] .map-terrain{opacity:.78}.map-viewport[data-layer="cloud"] .map-grid{opacity:.28}
    .map-marker,.map-cluster{position:absolute;z-index:3;min-width:44px;min-height:44px;border:3px solid var(--bg);background:var(--fg);color:var(--bg);box-shadow:0 2px 10px color-mix(in oklch,var(--fg) 24%,transparent);font:700 10px var(--font-mono);display:grid;place-items:center}
    .map-marker{border-radius:50%}.map-marker.selected{border-radius:8px;outline:3px solid var(--accent);outline-offset:2px}.map-marker[data-role="备选地点"]{border-style:dashed}
    .map-cluster{border-radius:8px;border-style:double}.marker-a{left:13%;top:50%}.marker-b{left:61%;top:28%}.marker-c{left:70%;top:57%}.marker-cluster{left:38%;top:39%}
    .map-context-overlay{position:absolute;z-index:8;left:12px;right:68px;top:12px;min-height:88px;border:1px solid var(--border);border-radius:8px;background:var(--bg);box-shadow:var(--shadow);padding:7px 9px;display:grid;grid-template-columns:1fr 44px;gap:4px 8px;align-items:center}
    .map-context-overlay label{font-size:10px;font-weight:700;color:var(--muted)}
    .map-context-overlay input{min-width:0;width:100%;border:0;background:transparent;padding:0;font-weight:700;outline:0}
    .map-context-meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font:10px var(--font-mono);white-space:nowrap;overflow:hidden}
    .map-overlay-btn{position:absolute;z-index:9;width:44px;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center}.map-overlay-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
    .map-filter-overlay{right:12px;top:12px}.map-locate-overlay{right:12px;top:64px}
    .map-layer-overlay{position:absolute;z-index:7;left:12px;top:112px;display:flex;flex-direction:column;gap:6px}
    .map-layer{min-width:44px;height:44px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);box-shadow:var(--shadow);font-size:10px}.map-layer.selected{background:var(--fg);color:var(--bg);border-color:var(--fg)}
    .map-bottom-sheet{position:absolute;z-index:10;left:0;right:0;bottom:0;height:25%;min-height:156px;background:var(--bg);border-top:1px solid var(--border);border-radius:24px 24px 0 0;box-shadow:0 -18px 34px color-mix(in oklch,var(--fg) 18%,transparent);transition:height 260ms cubic-bezier(.2,0,0,1);overflow:hidden}
    .map-bottom-sheet[data-detent="25"]{height:25%}.map-bottom-sheet[data-detent="55"]{height:55%}.map-bottom-sheet[data-detent="90"]{height:90%}
    .map-sheet-gripbar{height:44px;padding:0 10px 0 6px;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
    .map-sheet-handle{height:44px;border:0;background:transparent;display:grid;place-items:center;touch-action:none}.map-sheet-handle:after{content:"";width:42px;height:5px;border-radius:8px;background:var(--border)}
    .map-detents{display:flex;gap:3px}.map-detent{width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:9px var(--font-mono)}.map-detent[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
    .map-sheet-scroll{height:calc(100% - 44px);overflow-y:auto;overflow-x:hidden;padding:0 14px 20px;overscroll-behavior:contain}
    .map-sheet-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
    .map-sheet-summary h1{margin:0;font:700 17px/1.15 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-sheet-summary p{margin:3px 0 0;color:var(--muted);font:10px var(--font-mono)}.map-sheet-score{font:700 28px/1 var(--font-mono)}
    .map-sheet-primary{grid-column:1/-1;width:100%;min-height:44px;border:1px solid var(--fg);border-radius:8px;background:var(--fg);color:var(--bg);font-weight:700}
    .map-sheet-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .map-bottom-sheet[data-detent="25"] .map-sheet-detail{height:0;margin:0;padding:0;border:0;overflow:hidden;visibility:hidden;pointer-events:none}
    .map-filter-summary{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding-bottom:10px}.map-filter-summary p{margin:0;font-size:11px;line-height:1.45}.map-filter-summary .btn{white-space:nowrap}
    .map-layer-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px}.map-layer-summary button{min-height:44px;border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;font-size:10px}.map-layer-summary .active{background:var(--fg);color:var(--bg)}

      const jump=e.target.closest("[data-jump-control]");if(jump){const node=$("#appContent").querySelector('[data-control="'+jump.dataset.jumpControl+'"]');if(node){if(node.closest(".map-sheet-detail"))setMapDetent("55");if(node.closest(".sky-control-detail"))setSkyPanel(true);$("#appContent").scrollTop=Math.max(0,node.offsetTop-12);node.focus()}return}
      const action=e.target.closest("[data-review-action]");if(action&&action.dataset.reviewAction==="restore-state"){currentState="success";render();return}
      if(action&&action.dataset.reviewAction==="retry-state"){errorRetries++;const delay=[0,2000,4000][Math.min(errorRetries-1,2)];showToast("重试 "+errorRetries+" / 3 · 上次尝试刚刚");if(errorRetries>=3){$("#appContent").querySelector(".state-card").innerHTML='<div class="state-symbol"></div><h2>三次重试均失败</h2><p>请联系支持并提供错误 ID <span class="num">SW-DESIGN-042</span>。</p>';return}setTimeout(()=>{currentState="success";render();showToast("样例重试成功")},delay)}
    }
    function handleInput(e){
      if(e.target.dataset.behavior==="time"||e.target.dataset.behavior==="sky-time"){const mins=19*60+30+Number(e.target.value);const h=Math.floor(mins/60)%24,m=mins%60;context.moment=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");const owner=e.target.closest("[data-control]")||e.target.parentElement;owner.querySelectorAll("[data-time-output]").forEach(o=>o.value=context.moment);updateContextUI();if(e.target.dataset.behavior==="sky-time")syncSkySurface(e.target.value)}
      if(e.target.dataset.behavior==="sky-target"){context.target=e.target.value;syncSkySurface();showToast("目标已同步到天空画布")}
    }
    function handleBlur(e){const field=e.target.closest(".form-field");if(!field||!e.target.required)return;const invalid=!e.target.value.trim();field.classList.toggle("invalid",invalid);e.target.setAttribute("aria-invalid",String(invalid))}
    function filterReview(){
      const q=$("#reviewSearch").value.trim().toLowerCase();document.querySelectorAll(".outcome-link").forEach(b=>{const o=OUTCOMES.find(x=>x.id===b.dataset.outcomeId);const hay=(o.label+" "+o.id+" "+o.controls.flat().join(" ")).toLowerCase();b.hidden=q&&!hay.includes(q)})
    }
    function initSheetDrag(){
      const handle=$("#sheetHandle"),sheet=$("#sheet");let startY,startHeight;
      handle.addEventListener("pointerdown",e=>{startY=e.clientY;startHeight=sheet.getBoundingClientRect().height;handle.setPointerCapture(e.pointerId)});
      handle.addEventListener("pointermove",e=>{if(startY===undefined)return;const max=$("#screen").clientHeight*.9,min=$("#screen").clientHeight*.25;sheet.style.height=Math.max(min,Math.min(max,startHeight+(startY-e.clientY)))+"px"});
      handle.addEventListener("pointerup",e=>{const ratio=sheet.getBoundingClientRect().height/$("#screen").clientHeight;const detent=ratio<.4?"25":ratio<.72?"55":"90";sheet.style.height="";sheet.dataset.detent=detent;startY=undefined;handle.releasePointerCapture(e.pointerId)})
    }
    buildReview();render();initSheetDrag();
    document.addEventListener("click",e=>{handleProductClick(e);handleReviewClick(e)});
    document.addEventListener("input",handleInput);
    document.addEventListener("blur",handleBlur,true);
    $("#reviewSearch").addEventListener("input",filterReview);
    $("#backButton").addEventListener("click",()=>{if(historyStack.length>1){historyStack.pop();navigate(historyStack.at(-1),false)}});
    document.querySelectorAll("[data-detent-value]").forEach(b=>b.addEventListener("click",()=>{$("#sheet").dataset.detent=b.dataset.detentValue}));
    document.addEventListener("click",e=>{const m=e.target.closest("[data-mode-phone]");if(m){mode=m.dataset.modePhone;updateContextUI()}});
  </script>
</body>
</html>
